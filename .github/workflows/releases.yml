name: Releases

# Every folder <project>/<version>/ (with a <project>/project.properties) becomes the GitHub Release
# "<project>-v<version>" with the files of the folder; notes.md is the text of the Release.
# A Release that exists only gets the files it does not have yet (nothing is replaced).
# Uses the token of this repository only.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  releases:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recreate Releases that point at another commit than their tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # after a history rewrite a Release can still name the old commit; its files are all in this
          # repository, so it is deleted (the tag is kept) and created again by the next step
          gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --paginate --jq '.[] | [.tag_name, .target_commitish] | @tsv' |
          while IFS="$(printf '	')" read -r tag target; do
            commit=$(git rev-parse "refs/tags/${tag}^{commit}" 2>/dev/null || true)
            if [ -n "$commit" ] && [ "$target" != "$commit" ] && [ -d "${tag%-v*}/${tag##*-v}" ]; then
              echo "Recreating $tag ($target -> $commit)"
              gh release delete "$tag" --yes
            fi
          done

      - name: Create the missing Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          for props in */project.properties; do
            project="${props%%/*}"
            name=$(sed -n 's/^name=//p' "$props" | tr -d '\r')
            for version in $(ls -d "$project"/*/ 2>/dev/null | xargs -n1 basename | grep -E '^[0-9]' | sort -V); do
              tag="${project}-v${version}"
              files=$(find "$project/$version" -maxdepth 1 -type f ! -name notes.md | sort)
              if gh release view "$tag" > /dev/null 2>&1; then
                # already published: only add the files it does not have yet (never replace)
                have=$(gh release view "$tag" --json assets --jq '.assets[].name')
                for f in $files; do
                  if ! grep -qxF "$(basename "$f")" <<< "$have"; then
                    echo "Adding $(basename "$f") to $tag"
                    gh release upload "$tag" "$f"
                  fi
                done
                continue
              fi
              notes="$project/$version/notes.md"
              [ -f "$notes" ] || notes=/dev/null
              echo "Creating $tag: $files"
              target=$(git rev-parse "refs/tags/${tag}^{commit}" 2>/dev/null || echo "$GITHUB_SHA")
              gh release create "$tag" $files --title "$name $version" --notes-file "$notes" --target "$target"
            done
          done
