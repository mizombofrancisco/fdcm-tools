<text x="36" y="52" font-size="26" font-weight="800" fill="#1E1E1E">Listar uma pasta: uma passagem, com os atributos</text><text x="36" y="80" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13.95">list(dir)</tspan><tspan> lê cada item com os atributos uma vez; filtrar e ordenar nunca voltam ao disco.</tspan></text><g transform="translate(1076,30)"><rect width="128" height="28" rx="14" fill="#FFFFFF" stroke="#E0E0E0"/><circle cx="16" cy="14" r="6" fill="#F08C00"/><text x="30" y="19" font-size="12.5" font-weight="700" fill="#1E1E1E">OctopusFile</text></g>
