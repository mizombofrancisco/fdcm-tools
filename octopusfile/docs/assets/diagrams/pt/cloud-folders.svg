<text x="326" y="269" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start"><tspan>o &quot;path&quot; de </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.09">info.json</tspan><tspan> (</tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.09">%APPDATA%</tspan><tspan>, </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.09">%LOCALAPPDATA%</tspan><tspan> ou </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.09">~/.dropbox</tspan><tspan>)</tspan></text>
