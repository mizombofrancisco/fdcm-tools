<rect x="36" y="232" width="250" height="94" rx="12" fill="#C7E4FF" stroke="#0D8BF2" stroke-width="2.5"/><text x="161" y="283.2" font-size="14" font-weight="700" fill="#1E1E1E" text-anchor="middle">Dropbox</text>
