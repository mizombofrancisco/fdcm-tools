<text x="326" y="161" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start"><tspan>variáveis </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.09">OneDriveConsumer</tspan><tspan>, </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.09">OneDriveCommercial</tspan><tspan> (→ &quot;OneDrive (work)&quot;), </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.09">OneDrive</tspan></text>
