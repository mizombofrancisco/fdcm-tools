<text x="326" y="754" font-size="12.5" font-weight="600" fill="#5C5C5C" text-anchor="start"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">~</tspan><tspan> é a pasta pessoal do utilizador. Os sítios sem etiqueta são procurados em todos os sistemas.</tspan></text>
<rect x="1000" y="176" width="184" height="90" rx="12" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2.5"/><text x="1092" y="208.9" font-size="14" font-weight="700" fill="#1E1E1E" text-anchor="middle">É uma pasta?</text><text x="1092" y="231.1" font-size="11" font-weight="400" fill="#5C5C5C" text-anchor="middle">sítios em falta são</text><text x="1092" y="245.4" font-size="11" font-weight="400" fill="#5C5C5C" text-anchor="middle">ignorados</text>
<rect x="1000" y="306" width="184" height="110" rx="12" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2.5"/><text x="1092" y="339.8" font-size="14" font-weight="700" fill="#1E1E1E" text-anchor="middle">A mesma pasta real</text><text x="1092" y="358" font-size="14" font-weight="700" fill="#1E1E1E" text-anchor="middle">já encontrada?</text><text x="1092" y="380.2" font-size="11" font-weight="400" fill="#5C5C5C" text-anchor="middle"><tspan>por </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="10.23">toRealPath()</tspan><tspan>; se</tspan></text><text x="1092" y="394.5" font-size="11" font-weight="400" fill="#5C5C5C" text-anchor="middle">sim, ignorada</text>
<rect x="1000" y="456" width="184" height="110" rx="12" fill="#E1D3FF" stroke="#8E4EC6" stroke-width="2.5"/><text x="1092" y="498.9" font-size="14" font-weight="700" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13.02">CloudFolder</tspan></text><text x="1092" y="521.1" font-size="11" font-weight="400" fill="#5C5C5C" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="10.23">provider()</tspan><tspan>, </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="10.23">name()</tspan><tspan>,</tspan></text><text x="1092" y="535.4" font-size="11" font-weight="400" fill="#5C5C5C" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="10.23">path()</tspan></text>
<rect x="1110.5" y="423" width="39" height="24" rx="9" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/><text x="1130" y="440" font-size="12.5" font-weight="600" fill="#1E1E1E" text-anchor="middle">não</text>
<g filter="url(#shadow)"><rect x="980" y="690" width="224" height="84" rx="3" fill="#FFE88A"/></g><text x="994" y="714" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start">A deteção só lê pastas e um</text><text x="994" y="732.2" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start"><tspan>ficheiro (</tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.09">info.json</tspan><tspan>);</tspan></text><text x="994" y="750.4" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start">nunca contacta uma nuvem.</text>
<text x="36" y="52" font-size="26" font-weight="800" fill="#1E1E1E">Pastas sincronizadas pelas aplicações oficiais da nuvem</text><text x="36" y="80" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13.95">CloudSyncFolders.detect()</tspan><tspan> procura em sítios conhecidos; são pastas locais normais, a aplicação sincroniza.</tspan></text><g transform="translate(1076,30)"><rect width="128" height="28" rx="14" fill="#FFFFFF" stroke="#E0E0E0"/><circle cx="16" cy="14" r="6" fill="#F08C00"/><text x="30" y="19" font-size="12.5" font-weight="700" fill="#1E1E1E">OctopusFile</text></g>
