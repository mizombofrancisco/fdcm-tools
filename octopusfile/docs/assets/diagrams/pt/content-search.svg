<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 760" width="1240" height="760" role="img" aria-label="Pesquisar dentro dos ficheiros" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title>Pesquisar dentro dos ficheiros</title>
<defs><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#D4D4D4"/></pattern><filter id="shadow" x="-10%" y="-10%" width="130%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#000000" flood-opacity="0.18"/></filter><marker id="arrow-1E1E1E" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1.5,1.5 L10,6 L1.5,10.5" fill="none" stroke="#1E1E1E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-E5484D" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1.5,1.5 L10,6 L1.5,10.5" fill="none" stroke="#E5484D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="1240" height="760" rx="18" fill="#F7F7F5"/><rect width="1240" height="760" rx="18" fill="url(#dots)"/><rect x="0.75" y="0.75" width="1238.5" height="758.5" rx="18" fill="none" stroke="#E0E0E0" stroke-width="1.5"/>
<g><rect x="36" y="140" width="360" height="420" rx="14" fill="#FFE88A" fill-opacity="0.38" stroke="#E0B400" stroke-width="1.5" stroke-dasharray="0"/><rect x="48" y="127" width="256" height="26" rx="8" fill="#E0B400"/><text x="62" y="144" font-size="13" font-weight="700" fill="#FFFFFF">1 · Percorrer a árvore uma vez</text></g>
<g><rect x="436" y="140" width="400" height="420" rx="14" fill="#E1D3FF" fill-opacity="0.38" stroke="#8E4EC6" stroke-width="1.5" stroke-dasharray="0"/><rect x="448" y="127" width="294" height="26" rx="8" fill="#8E4EC6"/><text x="462" y="144" font-size="13" font-weight="700" fill="#FFFFFF">2 · Ler cada ficheiro (em paralelo)</text></g>
<g><rect x="876" y="140" width="328" height="420" rx="14" fill="#CDF3C9" fill-opacity="0.38" stroke="#30A46C" stroke-width="1.5" stroke-dasharray="0"/><rect x="888" y="127" width="134" height="26" rx="8" fill="#30A46C"/><text x="902" y="144" font-size="13" font-weight="700" fill="#FFFFFF">3 · Resultados</text></g>
<g><rect x="36" y="610" width="1168" height="120" rx="14" fill="#C7E4FF" fill-opacity="0.38" stroke="#0D8BF2" stroke-width="1.5" stroke-dasharray="0"/><rect x="48" y="597" width="66" height="26" rx="8" fill="#0D8BF2"/><text x="62" y="614" font-size="13" font-weight="700" fill="#FFFFFF">O fim</text></g>
<path d="M560,252 L546,278" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
<path d="M712,252 L726,278" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
<path d="M666,340 L606,374" fill="none" stroke="#E5484D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#arrow-E5484D)"/>
<path d="M726,340 L726,374" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
<path d="M396,350 L434,350" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
<path d="M836,300 L874,300" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
<path d="M1040,560 L1040,608" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
<g filter="url(#shadow)"><rect x="56" y="168" width="320" height="96" rx="3" fill="#EBEBEB"/></g><text x="70" y="192" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="start">Pastas ignoradas: nomes começados por</text><text x="70" y="210.9" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="start"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.555">.</tspan><tspan>, </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.555">node_modules</tspan><tspan>, </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.555">$RECYCLE.BIN</tspan></text>
<rect x="56" y="286" width="320" height="70" rx="12" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2.5"/><text x="216" y="308.9" font-size="14" font-weight="700" fill="#1E1E1E" text-anchor="middle">extensão na lista</text><text x="216" y="331.1" font-size="11" font-weight="400" fill="#5C5C5C" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="10.23">extensions(…)</tspan><tspan> — 44 por omissão: texto, código,</tspan></text><text x="216" y="345.4" font-size="11" font-weight="400" fill="#5C5C5C" text-anchor="middle">office</text>
<rect x="56" y="372" width="320" height="70" rx="12" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2.5"/><text x="216" y="402.05" font-size="14" font-weight="700" fill="#1E1E1E" text-anchor="middle">0 &lt; tamanho ≤ maxFileBytes</text><text x="216" y="424.25" font-size="11" font-weight="400" fill="#5C5C5C" text-anchor="middle">20 MiB por omissão</text>
<text x="56" y="480" font-size="13" font-weight="400" fill="#5C5C5C" text-anchor="start">Entradas ilegíveis são ignoradas.</text>
<text x="56" y="506" font-size="13" font-weight="400" fill="#5C5C5C" text-anchor="start">Resultado: a lista de ficheiros candidatos.</text>
<polygon points="636,170 806,215 636,260 466,215" fill="#FFE88A" stroke="#E0B400" stroke-width="2.5" stroke-linejoin="round"/><text x="636" y="218.9" font-size="13" font-weight="700" fill="#1E1E1E" text-anchor="middle">docx xlsx pptx odt ods odp?</text>
<rect x="466" y="280" width="160" height="60" rx="12" fill="#FFD7AD" stroke="#F08C00" stroke-width="2.5"/><text x="546" y="305.4" font-size="13" font-weight="700" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.09">DocumentText</tspan></text><text x="546" y="326.3" font-size="10" font-weight="400" fill="#5C5C5C" text-anchor="middle">uma linha por parágrafo</text>
<rect x="646" y="280" width="160" height="60" rx="12" fill="#C7E4FF" stroke="#0D8BF2" stroke-width="2.5"/><text x="726" y="305.05" font-size="14" font-weight="700" fill="#1E1E1E" text-anchor="middle">UTF-8</text><text x="726" y="327.25" font-size="11" font-weight="400" fill="#5C5C5C" text-anchor="middle">estrito</text>
<rect x="646" y="376" width="160" height="60" rx="12" fill="#C7E4FF" stroke="#0D8BF2" stroke-width="2.5"/><text x="726" y="401.05" font-size="14" font-weight="700" fill="#1E1E1E" text-anchor="middle">ISO-8859-1</text><text x="726" y="423.25" font-size="11" font-weight="400" fill="#5C5C5C" text-anchor="middle">Latin-1</text>
<rect x="500.5" y="250" width="39" height="24" rx="9" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/><text x="520" y="267" font-size="12.5" font-weight="600" fill="#1E1E1E" text-anchor="middle">sim</text>
<rect x="740.5" y="250" width="39" height="24" rx="9" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/><text x="760" y="267" font-size="12.5" font-weight="600" fill="#1E1E1E" text-anchor="middle">não</text>
<rect x="664.5" y="345" width="123" height="24" rx="9" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/><text x="726" y="362" font-size="12.5" font-weight="600" fill="#1E1E1E" text-anchor="middle">bytes inválidos</text>
<rect x="466" y="376" width="160" height="60" rx="12" fill="#FFC9C2" stroke="#E5484D" stroke-width="2.5"/><text x="546" y="394.9" font-size="13" font-weight="700" fill="#1E1E1E" text-anchor="middle">binário → ignorar</text><text x="546" y="415.8" font-size="10" font-weight="400" fill="#5C5C5C" text-anchor="middle">uma linha com o carácter</text><text x="546" y="428.8" font-size="10" font-weight="400" fill="#5C5C5C" text-anchor="middle">NUL</text>
<text x="466" y="470" font-size="13" font-weight="400" fill="#5C5C5C" text-anchor="start">Linha a linha, nunca o ficheiro inteiro. Em</text><text x="466" y="487.55" font-size="13" font-weight="400" fill="#5C5C5C" text-anchor="start"><tspan>minúsculas, exceto com </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.09">caseSensitive(true)</tspan><tspan>.</tspan></text>
<rect x="900" y="170" width="280" height="90" rx="12" fill="#CDF3C9" stroke="#30A46C" stroke-width="2.5"/><text x="1040" y="203.9" font-size="13" font-weight="700" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.09">Match(path, line, excerpt)</tspan></text><text x="1040" y="224.8" font-size="10" font-weight="400" fill="#5C5C5C" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="9.3">line</tspan><tspan> a partir de 1 (parágrafo ou linha num</tspan></text><text x="1040" y="237.8" font-size="10" font-weight="400" fill="#5C5C5C" text-anchor="middle">documento)</text>
<g filter="url(#shadow)"><rect x="900" y="280" width="280" height="120" rx="3" fill="#FFE88A"/></g><text x="914" y="304" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="start">Excerto: até 40 caracteres antes</text><text x="914" y="322.9" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="start">e 60 depois do texto; &quot;…&quot; marca</text><text x="914" y="341.8" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="start">um corte.</text>
<rect x="900" y="420" width="280" height="110" rx="12" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2.5"/><text x="1040" y="470.225" font-size="13.5" font-weight="700" fill="#1E1E1E" text-anchor="middle">A primeira ocorrência por ficheiro</text><text x="1040" y="491.775" font-size="10.5" font-weight="400" fill="#5C5C5C" text-anchor="middle"><tspan>ou todas com </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="9.765">allMatchesPerFile(true)</tspan></text>
<rect x="60" y="640" width="360" height="64" rx="12" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2.5"/><text x="240" y="667.225" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.555">onMatch</tspan><tspan> — cada resultado assim que é achado</tspan></text><text x="240" y="688.775" font-size="10.5" font-weight="400" fill="#5C5C5C" text-anchor="middle">pode vir de várias threads</text>
<rect x="440" y="640" width="360" height="64" rx="12" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2.5"/><text x="620" y="667.225" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="middle">lista ordenada por caminho e linha</text><text x="620" y="688.775" font-size="10.5" font-weight="400" fill="#5C5C5C" text-anchor="middle"><tspan>no máximo </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="9.765">maxResults</tspan><tspan> (500 por omissão)</tspan></text>
<rect x="820" y="640" width="360" height="64" rx="12" fill="#FFCCE5" stroke="#E93D82" stroke-width="2.5"/><text x="1000" y="667.275" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.555">cancel.set(true)</tspan><tspan> pára o percurso e a</tspan></text><text x="1000" y="684.825" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="middle">leitura</text>
<text x="36" y="52" font-size="26" font-weight="800" fill="#1E1E1E">Pesquisar dentro dos ficheiros</text><text x="36" y="80" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13.95">new ContentSearcher().search(root, text, onMatch, cancel)</tspan><tspan>: um percurso e depois os ficheiros são lidos em paralelo.</tspan></text><g transform="translate(1076,30)"><rect width="128" height="28" rx="14" fill="#FFFFFF" stroke="#E0E0E0"/><circle cx="16" cy="14" r="6" fill="#F08C00"/><text x="30" y="19" font-size="12.5" font-weight="700" fill="#1E1E1E">OctopusFile</text></g>
</svg>
