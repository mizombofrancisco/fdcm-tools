<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 640" width="1240" height="640" role="img" aria-label="FileHasher: hashes em streaming" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title>FileHasher: hashes em streaming</title>
<defs><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#D4D4D4"/></pattern><filter id="shadow" x="-10%" y="-10%" width="130%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#000000" flood-opacity="0.18"/></filter><marker id="arrow-1E1E1E" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1.5,1.5 L10,6 L1.5,10.5" fill="none" stroke="#1E1E1E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="1240" height="640" rx="18" fill="#F7F7F5"/><rect width="1240" height="640" rx="18" fill="url(#dots)"/><rect x="0.75" y="0.75" width="1238.5" height="638.5" rx="18" fill="none" stroke="#E0E0E0" stroke-width="1.5"/>
<g><rect x="36" y="330" width="560" height="280" rx="14" fill="#C7E4FF" fill-opacity="0.38" stroke="#0D8BF2" stroke-width="1.5" stroke-dasharray="0"/><rect x="48" y="317" width="126" height="26" rx="8" fill="#0D8BF2"/><text x="62" y="334" font-size="13" font-weight="700" fill="#FFFFFF">Três chamadas</text></g>
<g><rect x="636" y="330" width="568" height="280" rx="14" fill="#FFD7AD" fill-opacity="0.38" stroke="#F08C00" stroke-width="1.5" stroke-dasharray="0"/><rect x="648" y="317" width="218" height="26" rx="8" fill="#F08C00"/><text x="662" y="334" font-size="13" font-weight="700" fill="#FFFFFF">partialHash: o que é lido</text></g>
<path d="M186,200 L234,200" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
<path d="M436,200 L484,200" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
<path d="M696,200 L744,200" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
<path d="M956,200 L1004,200" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
<rect x="36" y="150" width="150" height="100" rx="12" fill="#EBEBEB" stroke="#8F8F8F" stroke-width="2.5"/><text x="111" y="204.5" font-size="15" font-weight="700" fill="#1E1E1E" text-anchor="middle">ficheiro</text>
<rect x="236" y="150" width="200" height="100" rx="12" fill="#C7E4FF" stroke="#0D8BF2" stroke-width="2.5"/><text x="336" y="195.05" font-size="14" font-weight="700" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13.02">FileChannel</tspan></text><text x="336" y="217.25" font-size="11" font-weight="400" fill="#5C5C5C" text-anchor="middle">só leitura</text>
<rect x="486" y="150" width="210" height="100" rx="12" fill="#C2F0E6" stroke="#12A594" stroke-width="2.5"/><text x="591" y="195.05" font-size="14" font-weight="700" fill="#1E1E1E" text-anchor="middle">buffer de 64 KiB</text><text x="591" y="217.25" font-size="11" font-weight="400" fill="#5C5C5C" text-anchor="middle">direto, um por thread</text>
<rect x="746" y="150" width="210" height="100" rx="12" fill="#E1D3FF" stroke="#8E4EC6" stroke-width="2.5"/><text x="851" y="195.05" font-size="14" font-weight="700" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13.02">MessageDigest</tspan></text><text x="851" y="217.25" font-size="11" font-weight="400" fill="#5C5C5C" text-anchor="middle">um por thread</text>
<rect x="1006" y="160" width="198" height="80" rx="40" fill="#CDF3C9" stroke="#30A46C" stroke-width="2.5"/><text x="1105" y="204.2" font-size="14" font-weight="700" fill="#1E1E1E" text-anchor="middle">texto hex</text>
<text x="721" y="136" font-size="12.5" font-weight="700" fill="#5C5C5C" text-anchor="middle">bloco a bloco, até ao fim</text>
<rect x="60" y="356" width="512" height="68" rx="12" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2.5"/><text x="316" y="385.05" font-size="14" font-weight="700" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13.02">hash(file)</tspan></text><text x="316" y="407.25" font-size="11" font-weight="400" fill="#5C5C5C" text-anchor="middle">o ficheiro inteiro</text>
<rect x="60" y="438" width="512" height="68" rx="12" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2.5"/><text x="316" y="467.05" font-size="14" font-weight="700" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13.02">matches(file, expected)</tspan></text><text x="316" y="489.25" font-size="11" font-weight="400" fill="#5C5C5C" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="10.23">hash</tspan><tspan> comparado com um texto hex, sem distinguir maiúsculas</tspan></text>
<rect x="60" y="520" width="512" height="68" rx="12" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2.5"/><text x="316" y="549.05" font-size="14" font-weight="700" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13.02">partialHash(file, size)</tspan></text><text x="316" y="571.25" font-size="11" font-weight="400" fill="#5C5C5C" text-anchor="middle">início + fim + tamanho (à direita)</text>
<rect x="660" y="366" width="520" height="50" rx="8" fill="#EBEBEB" fill-opacity="1" stroke="#8F8F8F" stroke-width="2"/>
<rect x="660" y="366" width="130" height="50" rx="8" fill="#FFD7AD" fill-opacity="1" stroke="#F08C00" stroke-width="2"/>
<rect x="1050" y="366" width="130" height="50" rx="8" fill="#FFD7AD" fill-opacity="1" stroke="#F08C00" stroke-width="2"/>
<text x="725" y="397" font-size="12.5" font-weight="700" fill="#1E1E1E" text-anchor="middle">primeiros 16 KiB</text>
<text x="1115" y="397" font-size="12.5" font-weight="700" fill="#1E1E1E" text-anchor="middle">últimos 16 KiB</text>
<text x="920" y="397" font-size="13" font-weight="400" fill="#5C5C5C" text-anchor="middle">não é lido</text>
<text x="660" y="446" font-size="13.5" font-weight="600" fill="#1E1E1E" text-anchor="start">+ o tamanho (8 bytes) também entra no hash</text>
<text x="660" y="472" font-size="13.5" font-weight="400" fill="#5C5C5C" text-anchor="start">Um ficheiro com 32 KiB ou menos é lido por inteiro.</text>
<g filter="url(#shadow)"><rect x="660" y="506" width="520" height="72" rx="3" fill="#FFE88A"/></g><text x="674" y="530" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="start">Hashes parciais diferentes: ficheiros de certeza diferentes.</text><text x="674" y="548.9" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="start"><tspan>Iguais ainda precisam de </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.555">hash(file)</tspan><tspan> para confirmar.</tspan></text>
<text x="36" y="290" font-size="13" font-weight="400" fill="#5C5C5C" text-anchor="start"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.09">new FileHasher()</tspan><tspan> = SHA-256 · </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.09">new FileHasher(&quot;SHA-1&quot;)</tspan><tspan>, &quot;MD5&quot;, &quot;SHA-512&quot;… qualquer nome de </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.09">MessageDigest</tspan><tspan>; um desconhecido: </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.09">IllegalArgumentException</tspan></text>
<text x="36" y="52" font-size="26" font-weight="800" fill="#1E1E1E">FileHasher: hashes em streaming</text><text x="36" y="80" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start"><tspan>O ficheiro passa por um buffer de 64 KiB para um </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13.95">MessageDigest</tspan><tspan>; nunca é carregado inteiro em memória.</tspan></text><g transform="translate(1076,30)"><rect width="128" height="28" rx="14" fill="#FFFFFF" stroke="#E0E0E0"/><circle cx="16" cy="14" r="6" fill="#F08C00"/><text x="30" y="19" font-size="12.5" font-weight="700" fill="#1E1E1E">OctopusFile</text></g>
</svg>
