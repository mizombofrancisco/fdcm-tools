<g filter="url(#shadow)"><rect x="430" y="610" width="370" height="190" rx="3" fill="#FFD7AD"/></g><text x="444" y="634" font-size="14" font-weight="700" fill="#1E1E1E">Acrescentar</text><text x="444" y="654.9" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start">Acrescentar no fim em vez de substituir:</text><text x="444" y="673.1" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.09">appendText</tspan><tspan>, </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.09">appendBytes</tspan><tspan>, </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.09">new LineWriter(p,</tspan></text><text x="444" y="691.3" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.09">true)</tspan><tspan>, </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.09">new BinaryWriter(p, true)</tspan><tspan>, ou</tspan></text><text x="444" y="709.5" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.09">octo.write(p).append(s)</tspan><tspan>. Sem isso, o ficheiro</tspan></text><text x="444" y="727.7" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start">é substituído.</text>
