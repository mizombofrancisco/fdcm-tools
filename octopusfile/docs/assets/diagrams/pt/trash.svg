<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 590" width="1240" height="590" role="img" aria-label="O Lixo: nada é apagado antes de estar seguro" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title>O Lixo: nada é apagado antes de estar seguro</title>
<defs><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#D4D4D4"/></pattern><filter id="shadow" x="-10%" y="-10%" width="130%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#000000" flood-opacity="0.18"/></filter><marker id="arrow-1E1E1E" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1.5,1.5 L10,6 L1.5,10.5" fill="none" stroke="#1E1E1E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-E5484D" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1.5,1.5 L10,6 L1.5,10.5" fill="none" stroke="#E5484D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="1240" height="590" rx="18" fill="#F7F7F5"/><rect width="1240" height="590" rx="18" fill="url(#dots)"/><rect x="0.75" y="0.75" width="1238.5" height="588.5" rx="18" fill="none" stroke="#E0E0E0" stroke-width="1.5"/>

<path d="M206,180 L258,180" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
<path d="M460,180 L508,180" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
<path d="M720,180 L768,180" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
<path d="M980,180 L1028,180" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
<path d="M840,220 L785,268" fill="none" stroke="#E5484D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#arrow-E5484D)"/>
<path d="M930,220 L1040,268" fill="none" stroke="#E5484D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#arrow-E5484D)"/>
<path d="M206,490 L258,490" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
<path d="M490,490 L538,490" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
<path d="M870,490 L918,490" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
<rect x="36" y="140" width="170" height="80" rx="12" fill="#EBEBEB" stroke="#8F8F8F" stroke-width="2.5"/><text x="121" y="184.5" font-size="15" font-weight="700" fill="#1E1E1E" text-anchor="middle">ficheiro ou pasta</text>
<rect x="260" y="140" width="200" height="80" rx="12" fill="#FFD7AD" stroke="#F08C00" stroke-width="2.5"/><text x="360" y="174.7" font-size="15" font-weight="700" fill="#1E1E1E" text-anchor="middle">Comprimir</text><text x="360" y="198.2" font-size="12" font-weight="400" fill="#5C5C5C" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.16">&lt;trash&gt;/&lt;id&gt;.zip</tspan></text>
<g><circle cx="264" cy="144" r="13" fill="#1E1E1E" stroke="#1E1E1E" stroke-width="2"/><text x="264" y="148" font-size="13" font-weight="800" text-anchor="middle" fill="#FFFFFF">1</text></g>
<rect x="510" y="140" width="210" height="80" rx="12" fill="#C7E4FF" stroke="#0D8BF2" stroke-width="2.5"/><text x="615" y="174.7" font-size="15" font-weight="700" fill="#1E1E1E" text-anchor="middle">Registar</text><text x="615" y="198.2" font-size="12" font-weight="400" fill="#5C5C5C" text-anchor="middle"><tspan>uma linha em </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.16">index.tsv</tspan></text>
<g><circle cx="514" cy="144" r="13" fill="#1E1E1E" stroke="#1E1E1E" stroke-width="2"/><text x="514" y="148" font-size="13" font-weight="800" text-anchor="middle" fill="#FFFFFF">2</text></g>
<rect x="770" y="140" width="210" height="80" rx="12" fill="#FFC9C2" stroke="#E5484D" stroke-width="2.5"/><text x="875" y="184.5" font-size="15" font-weight="700" fill="#1E1E1E" text-anchor="middle">Apagar o original</text>
<g><circle cx="774" cy="144" r="13" fill="#1E1E1E" stroke="#1E1E1E" stroke-width="2"/><text x="774" y="148" font-size="13" font-weight="800" text-anchor="middle" fill="#FFFFFF">3</text></g>
<rect x="1030" y="150" width="174" height="60" rx="30" fill="#CDF3C9" stroke="#30A46C" stroke-width="2.5"/><text x="1117" y="184.5" font-size="15" font-weight="700" fill="#1E1E1E" text-anchor="middle">No Lixo</text>
<g filter="url(#shadow)"><rect x="650" y="270" width="270" height="118" rx="3" fill="#FFCCE5"/></g><text x="664" y="294" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="start">Um ficheiro que não se pode</text><text x="664" y="312.9" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="start">apagar: desfeito — sem zip, sem</text><text x="664" y="331.8" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="start">entrada, o ficheiro intacto.</text>
<g filter="url(#shadow)"><rect x="940" y="270" width="264" height="118" rx="3" fill="#FFCCE5"/></g><text x="954" y="294" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="start">Uma pasta apagada só em parte:</text><text x="954" y="312.9" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="start">a cópia completa fica no Lixo;</text><text x="954" y="331.8" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="start">a exceção diz isso.</text>
<g filter="url(#shadow)"><rect x="36" y="262" width="290" height="126" rx="3" fill="#FFE88A"/></g><text x="50" y="286" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="start">Pasta por omissão</text><text x="50" y="304.9" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="start"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.555">~/.octopusfile/trash</tspan><tspan>. Os arquivos</tspan></text><text x="50" y="323.8" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="start">são procurados na própria pasta do</text><text x="50" y="342.7" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="start">Lixo, por isso um Lixo mudado de</text><text x="50" y="361.6" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="start">sítio continua a funcionar.</text>
<g filter="url(#shadow)"><rect x="345" y="262" width="285" height="126" rx="3" fill="#C7E4FF"/></g><text x="359" y="286" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="start">Igual em Windows, Linux e macOS: a</text><text x="359" y="304.9" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="start">reciclagem do sistema não é usada.</text>
<rect x="36" y="460" width="170" height="60" rx="30" fill="#CDF3C9" stroke="#30A46C" stroke-width="2.5"/><text x="121" y="494.2" font-size="14" font-weight="700" fill="#1E1E1E" text-anchor="middle">restore(id)</text>
<rect x="260" y="450" width="230" height="80" rx="12" fill="#FFD7AD" stroke="#F08C00" stroke-width="2.5"/><text x="375" y="484.75" font-size="15" font-weight="700" fill="#1E1E1E" text-anchor="middle">Extrair para uma pasta</text><text x="375" y="504.25" font-size="15" font-weight="700" fill="#1E1E1E" text-anchor="middle">temporária</text>
<rect x="540" y="440" width="330" height="100" rx="12" fill="#C7E4FF" stroke="#0D8BF2" stroke-width="2.5"/><text x="705" y="474.95" font-size="15" font-weight="700" fill="#1E1E1E" text-anchor="middle">Mover para o sítio original (ou outro</text><text x="705" y="494.45" font-size="15" font-weight="700" fill="#1E1E1E" text-anchor="middle">à escolha)</text><text x="705" y="517.95" font-size="12" font-weight="400" fill="#5C5C5C" text-anchor="middle"><tspan>nunca substitui: </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.16">FileAlreadyExistsException</tspan></text>
<rect x="920" y="450" width="284" height="80" rx="12" fill="#EBEBEB" stroke="#8F8F8F" stroke-width="2.5"/><text x="1062" y="494.5" font-size="15" font-weight="700" fill="#1E1E1E" text-anchor="middle">Apagar o zip e a entrada</text>
<text x="36" y="52" font-size="26" font-weight="800" fill="#1E1E1E">O Lixo: nada é apagado antes de estar seguro</text><text x="36" y="80" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13.95">moveToTrash</tspan><tspan> comprime, regista e só depois apaga; </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13.95">restore</tspan><tspan> nunca substitui nada.</tspan></text><g transform="translate(1076,30)"><rect width="128" height="28" rx="14" fill="#FFFFFF" stroke="#E0E0E0"/><circle cx="16" cy="14" r="6" fill="#F08C00"/><text x="30" y="19" font-size="12.5" font-weight="700" fill="#1E1E1E">OctopusFile</text></g>
</svg>
