<text x="698" y="340" font-size="12.5" font-weight="600" fill="#5C5C5C" text-anchor="middle">ZIP</text>
<g filter="url(#shadow)"><rect x="800" y="266" width="404" height="86" rx="3" fill="#FFE88A"/></g><text x="814" y="290" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="start">Uma cópia posterior tem outro nome, por isso nunca</text><text x="814" y="308.9" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="start">substitui uma anterior. Nada é apagado: os ZIP</text><text x="814" y="327.8" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="start">antigos ficam até os remover.</text>
<text x="58" y="470" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="start"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.555">getOriginalPath()</tspan><tspan>  — o que foi copiado</tspan></text>
<text x="58" y="501" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="start"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.555">getBackupPath()</tspan><tspan>  — o novo .zip</tspan></text>
<text x="58" y="532" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="start"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.555">getCreatedAt()</tspan><tspan>  — quando</tspan></text>
<text x="58" y="563" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="start"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.555">getOriginalSizeBytes()</tspan><tspan> · </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.555">getCompressedSizeBytes()</tspan></text>
<text x="58" y="594" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="start"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.555">getCompressionRatio()</tspan><tspan>  — % poupada (0 numa origem vazia)</tspan></text>
<rect x="662" y="456" width="520" height="48" rx="12" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2.5"/><text x="922" y="483.9" font-size="13" font-weight="700" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.09">schedule(source, folder, period, unit, onBackupCreated)</tspan></text>
<text x="662" y="532" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="start"><tspan>• uma thread daemon: </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.555">OctopusFile-BackupScheduler</tspan></text>
<text x="662" y="556" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="start">• primeira execução após um período, depois a cada período</text>
<text x="662" y="580" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="start">• uma execução falhada é registada; as seguintes continuam</text>
<text x="662" y="604" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="start"><tspan>• </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.555">stop()</tspan><tspan> ou </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.555">close()</tspan><tspan> termina</tspan></text>
<rect x="36" y="680" width="230" height="70" rx="35" fill="#CDF3C9" stroke="#30A46C" stroke-width="2.5"/><text x="151" y="718.9" font-size="13" font-weight="700" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.09">backup(zip).restoreTo(dir)</tspan></text>
<rect x="320" y="670" width="360" height="90" rx="12" fill="#FFD7AD" stroke="#F08C00" stroke-width="2.5"/><text x="500" y="702.4" font-size="14.5" font-weight="700" fill="#1E1E1E" text-anchor="middle">Extrair cada entrada</text><text x="500" y="725.25" font-size="11.5" font-weight="400" fill="#5C5C5C" text-anchor="middle"><tspan>datas mantidas; uma entrada que sairia de </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="10.695">dir</tspan><tspan> (zip</tspan></text><text x="500" y="740.2" font-size="11.5" font-weight="400" fill="#5C5C5C" text-anchor="middle">slip) para tudo</text>
<rect x="734" y="680" width="150" height="70" rx="12" fill="#EBEBEB" stroke="#8F8F8F" stroke-width="2.5"/><text x="809" y="710.1" font-size="14" font-weight="700" fill="#1E1E1E" text-anchor="middle">ficheiros em</text><text x="809" y="728.3" font-size="14" font-weight="700" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13.02">dir</tspan></text>
<g filter="url(#shadow)"><rect x="930" y="664" width="274" height="104" rx="3" fill="#FFCCE5"/></g><text x="944" y="688" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="start">Ficheiros com o mesmo nome em</text><text x="944" y="706.9" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="start"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.555">dir</tspan><tspan> são substituídos: restaure</tspan></text><text x="944" y="725.8" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="start">para uma pasta vazia.</text>
<text x="36" y="52" font-size="26" font-weight="800" fill="#1E1E1E">Cópias de segurança em ZIP com data — BackupService</text><text x="36" y="80" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13.95">backup(source, folder)</tspan><tspan> escreve sempre um ZIP novo: o nome leva a data e a hora, ao milissegundo.</tspan></text><g transform="translate(1076,30)"><rect width="128" height="28" rx="14" fill="#FFFFFF" stroke="#E0E0E0"/><circle cx="16" cy="14" r="6" fill="#F08C00"/><text x="30" y="19" font-size="12.5" font-weight="700" fill="#1E1E1E">OctopusFile</text></g>
</svg>
