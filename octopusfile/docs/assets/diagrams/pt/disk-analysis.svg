<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 730" width="1240" height="730" role="img" aria-label="Análise do disco num só percurso" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title>Análise do disco num só percurso</title>
<defs><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#D4D4D4"/></pattern><filter id="shadow" x="-10%" y="-10%" width="130%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#000000" flood-opacity="0.18"/></filter><marker id="arrow-1E1E1E" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1.5,1.5 L10,6 L1.5,10.5" fill="none" stroke="#1E1E1E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="1240" height="730" rx="18" fill="#F7F7F5"/><rect width="1240" height="730" rx="18" fill="url(#dots)"/><rect x="0.75" y="0.75" width="1238.5" height="728.5" rx="18" fill="none" stroke="#E0E0E0" stroke-width="1.5"/>
<g><rect x="250" y="140" width="480" height="380" rx="14" fill="#FFE88A" fill-opacity="0.38" stroke="#E0B400" stroke-width="1.5" stroke-dasharray="0"/><rect x="262" y="127" width="104" height="26" rx="8" fill="#E0B400"/><text x="276" y="144" font-size="13" font-weight="700" fill="#FFFFFF">O percurso</text></g>
<g><rect x="780" y="140" width="424" height="520" rx="14" fill="#CDF3C9" fill-opacity="0.38" stroke="#30A46C" stroke-width="1.5" stroke-dasharray="0"/><rect x="792" y="127" width="172" height="26" rx="8" fill="#30A46C"/><text x="806" y="144" font-size="13" font-weight="700" fill="#FFFFFF">DiskAnalyzer.Result</text></g>
<path d="M206,205 L248,205" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
<path d="M490,256 L490,270" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
<path d="M490,390 L490,404" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
<path d="M730,330 L778,330" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
<path d="M36,160 v90 a85,10 0 0 0 170,0 v-90" fill="#EBEBEB" stroke="#8F8F8F" stroke-width="2.5"/><ellipse cx="121" cy="160" rx="85" ry="10" fill="#EBEBEB" stroke="#8F8F8F" stroke-width="2.5"/><text x="121" y="213.5" font-size="15" font-weight="700" fill="#1E1E1E" text-anchor="middle">pasta</text>
<rect x="274" y="170" width="432" height="86" rx="12" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2.5"/><text x="490" y="200.9" font-size="14" font-weight="700" fill="#1E1E1E" text-anchor="middle">Ao entrar numa pasta</text><text x="490" y="223.1" font-size="11" font-weight="400" fill="#5C5C5C" text-anchor="middle"><tspan>ignora </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="10.23">node_modules</tspan><tspan>, </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="10.23">$RECYCLE.BIN</tspan><tspan>, </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="10.23">System Volume Information</tspan><tspan>,</tspan></text><text x="490" y="237.4" font-size="11" font-weight="400" fill="#5C5C5C" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="10.23">AppData</tspan><tspan>, </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="10.23">.git</tspan><tspan> e nomes começados por </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="10.23">.</tspan><tspan> (não a raiz)</tspan></text>
<rect x="274" y="272" width="432" height="118" rx="12" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2.5"/><text x="490" y="318.9" font-size="14" font-weight="700" fill="#1E1E1E" text-anchor="middle">Cada ficheiro</text><text x="490" y="341.1" font-size="11" font-weight="400" fill="#5C5C5C" text-anchor="middle">soma o tamanho à sua pasta · pode entrar nos N maiores · antigo e</text><text x="490" y="355.4" font-size="11" font-weight="400" fill="#5C5C5C" text-anchor="middle">grande? · conta na sua categoria (pela extensão)</text>
<rect x="274" y="406" width="432" height="92" rx="12" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2.5"/><text x="490" y="439.9" font-size="14" font-weight="700" fill="#1E1E1E" text-anchor="middle">Ao sair de uma pasta</text><text x="490" y="462.1" font-size="11" font-weight="400" fill="#5C5C5C" text-anchor="middle">tamanho = ficheiros próprios + subpastas · subpastas ordenadas,</text><text x="490" y="476.4" font-size="11" font-weight="400" fill="#5C5C5C" text-anchor="middle">maior primeiro · sem ficheiros nem subpastas: vazia</text>
<rect x="800" y="170" width="384" height="66" rx="12" fill="#C2F0E6" stroke="#12A594" stroke-width="2.5"/><text x="992" y="191.4" font-size="13.5" font-weight="700" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.555">root</tspan></text><text x="992" y="212.95" font-size="10.5" font-weight="400" fill="#5C5C5C" text-anchor="middle"><tspan>árvore de pastas: </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="9.765">size()</tspan><tspan>, </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="9.765">ownFilesSize()</tspan><tspan>, </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="9.765">fileCount()</tspan><tspan>,</tspan></text><text x="992" y="226.6" font-size="10.5" font-weight="400" fill="#5C5C5C" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="9.765">children()</tspan></text>
<rect x="800" y="250" width="384" height="66" rx="12" fill="#C7E4FF" stroke="#0D8BF2" stroke-width="2.5"/><text x="992" y="278.225" font-size="13.5" font-weight="700" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.555">largest</tspan></text><text x="992" y="299.775" font-size="10.5" font-weight="400" fill="#5C5C5C" text-anchor="middle"><tspan>os N maiores ficheiros (</tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="9.765">top(n)</tspan><tspan>, 60 por omissão)</tspan></text>
<rect x="800" y="330" width="384" height="66" rx="12" fill="#FFD7AD" stroke="#F08C00" stroke-width="2.5"/><text x="992" y="358.225" font-size="13.5" font-weight="700" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.555">oldLarge</tspan></text><text x="992" y="379.775" font-size="10.5" font-weight="400" fill="#5C5C5C" text-anchor="middle"><tspan>≥ 50 MiB e sem alterações há 180 dias (</tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="9.765">old(age, size)</tspan><tspan>)</tspan></text>
<rect x="800" y="410" width="384" height="66" rx="12" fill="#EBEBEB" stroke="#8F8F8F" stroke-width="2.5"/><text x="992" y="438.225" font-size="13.5" font-weight="700" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.555">emptyFolders</tspan></text><text x="992" y="459.775" font-size="10.5" font-weight="400" fill="#5C5C5C" text-anchor="middle">pastas abaixo da raiz sem nada analisado lá dentro</text>
<rect x="800" y="490" width="384" height="66" rx="12" fill="#E1D3FF" stroke="#8E4EC6" stroke-width="2.5"/><text x="992" y="511.4" font-size="13.5" font-weight="700" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.555">categories</tspan></text><text x="992" y="532.95" font-size="10.5" font-weight="400" fill="#5C5C5C" text-anchor="middle">bytes e ficheiros por tipo, maior primeiro; tipos vazios ficam</text><text x="992" y="546.6" font-size="10.5" font-weight="400" fill="#5C5C5C" text-anchor="middle">de fora</text>
<rect x="800" y="570" width="384" height="66" rx="12" fill="#FFCCE5" stroke="#E93D82" stroke-width="2.5"/><text x="992" y="598.225" font-size="13.5" font-weight="700" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.555">cancelled</tspan><tspan> · </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.555">elapsedMillis</tspan></text><text x="992" y="619.775" font-size="10.5" font-weight="400" fill="#5C5C5C" text-anchor="middle">parou antes? · quanto demorou</text>
<g filter="url(#shadow)"><rect x="36" y="300" width="190" height="200" rx="3" fill="#E1D3FF"/></g><text x="50" y="324" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start">Categorias: images,</text><text x="50" y="342.2" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start">videos, music,</text><text x="50" y="360.4" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start">documents, archives,</text><text x="50" y="378.6" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start">apps, code — e other.</text><text x="50" y="396.8" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start">— ver</text><text x="50" y="415" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.09">category(name)</tspan><tspan>.</tspan></text>
<g filter="url(#shadow)"><rect x="250" y="560" width="230" height="140" rx="3" fill="#C7E4FF"/></g><text x="264" y="584" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="start"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.555">progress</tspan><tspan> recebe o número</tspan></text><text x="264" y="602.9" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="start">de ficheiros vistos, de</text><text x="264" y="621.8" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="start">2 000 em 2 000 e no fim.</text>
<g filter="url(#shadow)"><rect x="500" y="560" width="230" height="140" rx="3" fill="#FFCCE5"/></g><text x="514" y="584" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="start"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.555">cancel</tspan><tspan> pára o percurso:</tspan></text><text x="514" y="602.9" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="start">as pastas ainda abertas são</text><text x="514" y="621.8" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="start"><tspan>fechadas e </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.555">cancelled</tspan><tspan> fica</tspan></text><text x="514" y="640.7" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="start">true — um resultado</text><text x="514" y="659.6" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="start">parcial.</text>
<g filter="url(#shadow)"><rect x="36" y="560" width="190" height="140" rx="3" fill="#FFE88A"/></g><text x="50" y="584" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.09">skipHidden(false)</tspan><tspan> e</tspan></text><text x="50" y="602.2" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.09">skipNames(set)</tspan><tspan> mudam</tspan></text><text x="50" y="620.4" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start">o que é ignorado.</text><text x="50" y="638.6" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start">Entradas ilegíveis são</text><text x="50" y="656.8" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start">ignoradas.</text>
<text x="780" y="692" font-size="13.5" font-weight="600" fill="#5C5C5C" text-anchor="start">Só é guardado um objeto por pasta, nunca um por ficheiro.</text>
<text x="36" y="52" font-size="26" font-weight="800" fill="#1E1E1E">Análise do disco num só percurso</text><text x="36" y="80" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13.95">new DiskAnalyzer().analyze(folder, progress, cancel)</tspan><tspan> visita cada ficheiro uma vez e só guarda as pastas.</tspan></text><g transform="translate(1076,30)"><rect width="128" height="28" rx="14" fill="#FFFFFF" stroke="#E0E0E0"/><circle cx="16" cy="14" r="6" fill="#F08C00"/><text x="30" y="19" font-size="12.5" font-weight="700" fill="#1E1E1E">OctopusFile</text></g>
</svg>
