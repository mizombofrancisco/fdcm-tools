<text x="36" y="270" font-size="15" font-weight="800" fill="#1E1E1E" text-anchor="start">Ficheiro do formato 2</text>
<rect x="36" y="284" width="80" height="48" rx="12" fill="#FFD7AD" stroke="#F08C00" stroke-width="2.5"/><text x="76" y="312.05" font-size="13.5" font-weight="700" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.555">OFE2</tspan></text>
<text x="76" y="352" font-size="12" font-weight="400" fill="#5C5C5C" text-anchor="middle">4 bytes</text>
<rect x="120" y="284" width="100" height="48" rx="12" fill="#EBEBEB" stroke="#8F8F8F" stroke-width="2.5"/><text x="170" y="312.05" font-size="13.5" font-weight="700" fill="#1E1E1E" text-anchor="middle">sal</text>
<text x="170" y="352" font-size="12" font-weight="400" fill="#5C5C5C" text-anchor="middle">16 bytes</text>
<rect x="224" y="284" width="200" height="48" rx="12" fill="#C7E4FF" stroke="#0D8BF2" stroke-width="2.5"/><text x="324" y="312.05" font-size="13.5" font-weight="700" fill="#1E1E1E" text-anchor="middle">bloco 0</text>
