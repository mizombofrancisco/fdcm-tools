<rect x="696" y="284" width="200" height="48" rx="12" fill="#C2F0E6" stroke="#12A594" stroke-width="2.5"/><text x="796" y="312.05" font-size="13.5" font-weight="700" fill="#1E1E1E" text-anchor="middle">último bloco</text>
<rect x="236" y="392" width="120" height="64" rx="12" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2.5"/><text x="296" y="419.225" font-size="13.5" font-weight="700" fill="#1E1E1E" text-anchor="middle">tamanho</text><text x="296" y="440.775" font-size="10.5" font-weight="400" fill="#5C5C5C" text-anchor="middle">4 bytes</text>
<rect x="362" y="392" width="160" height="64" rx="12" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2.5"/><text x="442" y="419.225" font-size="13.5" font-weight="700" fill="#1E1E1E" text-anchor="middle">nonce</text><text x="442" y="440.775" font-size="10.5" font-weight="400" fill="#5C5C5C" text-anchor="middle">12 bytes, aleatório</text>
<rect x="528" y="392" width="370" height="64" rx="12" fill="#C7E4FF" stroke="#0D8BF2" stroke-width="2.5"/><text x="713" y="419.225" font-size="13.5" font-weight="700" fill="#1E1E1E" text-anchor="middle">dados + tag</text><text x="713" y="440.775" font-size="10.5" font-weight="400" fill="#5C5C5C" text-anchor="middle">até 1 MiB + tag de 16 bytes</text>
<g filter="url(#shadow)"><rect x="36" y="384" width="184" height="112" rx="3" fill="#FFE88A"/></g><text x="50" y="408" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start">Cada bloco é</text><text x="50" y="426.2" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start">autenticado com</text><text x="50" y="444.4" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.09">OFE2</tspan><tspan> + número do</tspan></text><text x="50" y="462.6" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start">bloco + marca de</text><text x="50" y="480.8" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start">último.</text>
<g filter="url(#shadow)"><rect x="940" y="270" width="264" height="104" rx="3" fill="#FFCCE5"/></g><text x="954" y="294" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start">Detetado: um byte alterado (tag),</text><text x="954" y="312.2" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start">blocos trocados ou removidos</text><text x="954" y="330.4" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start">(número), um ficheiro cortado</text><text x="954" y="348.6" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start">(sem marca de último).</text>
<g filter="url(#shadow)"><rect x="940" y="392" width="264" height="76" rx="3" fill="#C7E4FF"/></g><text x="954" y="416" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start">A memória usada é um bloco, seja</text><text x="954" y="434.2" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start">qual for o tamanho do ficheiro.</text>
<text x="36" y="532" font-size="15" font-weight="800" fill="#1E1E1E" text-anchor="start">Formato 1 (1.2 e anteriores)</text>
