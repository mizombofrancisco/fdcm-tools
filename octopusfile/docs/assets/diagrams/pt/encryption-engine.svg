<text x="36" y="52" font-size="26" font-weight="800" fill="#1E1E1E">EncryptionEngine: um ficheiro, uma palavra-passe</text><text x="36" y="80" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start">Formato 2 (desde a 1.3): AES-256-GCM em blocos de 1 MiB, cada um autenticado com o seu número e uma marca de &quot;último bloco&quot;.</text><g transform="translate(1076,30)"><rect width="128" height="28" rx="14" fill="#FFFFFF" stroke="#E0E0E0"/><circle cx="16" cy="14" r="6" fill="#F08C00"/><text x="30" y="19" font-size="12.5" font-weight="700" fill="#1E1E1E">OctopusFile</text></g>
