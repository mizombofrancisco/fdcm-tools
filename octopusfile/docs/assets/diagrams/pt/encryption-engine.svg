<rect x="1010" y="646" width="180" height="60" rx="12" fill="#CDF3C9" stroke="#30A46C" stroke-width="2.5"/><text x="1100" y="664.9" font-size="13" font-weight="700" fill="#1E1E1E" text-anchor="middle">passa a ser o destino</text><text x="1100" y="685.8" font-size="10" font-weight="400" fill="#5C5C5C" text-anchor="middle">movimento atómico se</text><text x="1100" y="698.8" font-size="10" font-weight="400" fill="#5C5C5C" text-anchor="middle">possível</text>
<rect x="1010" y="724" width="180" height="84" rx="12" fill="#FFC9C2" stroke="#E5484D" stroke-width="2.5"/><text x="1100" y="754.9" font-size="13" font-weight="700" fill="#1E1E1E" text-anchor="middle">.part apagado</text><text x="1100" y="775.8" font-size="10" font-weight="400" fill="#5C5C5C" text-anchor="middle">destino intacto; &quot;wrong</text><text x="1100" y="788.8" font-size="10" font-weight="400" fill="#5C5C5C" text-anchor="middle">password or corrupted file&quot;</text>
