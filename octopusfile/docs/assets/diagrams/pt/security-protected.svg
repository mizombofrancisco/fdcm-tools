<rect x="754" y="526" width="206" height="72" rx="12" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2.5"/><text x="857" y="550.4" font-size="13.5" font-weight="700" fill="#1E1E1E" text-anchor="middle">fora?</text><text x="857" y="571.95" font-size="10.5" font-weight="400" fill="#5C5C5C" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="9.765">startsWith(destination)</tspan><tspan> é</tspan></text><text x="857" y="585.6" font-size="10.5" font-weight="400" fill="#5C5C5C" text-anchor="middle">falso</text>
<rect x="986" y="526" width="206" height="72" rx="12" fill="#CDF3C9" stroke="#30A46C" stroke-width="2.5"/><text x="1089" y="557.225" font-size="13.5" font-weight="700" fill="#1E1E1E" text-anchor="middle">recusada</text><text x="1089" y="578.775" font-size="10.5" font-weight="400" fill="#5C5C5C" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="9.765">IOException</tspan><tspan>: zip slip</tspan></text>
