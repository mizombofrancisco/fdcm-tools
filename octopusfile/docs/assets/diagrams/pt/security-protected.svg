<rect x="522" y="626" width="206" height="72" rx="12" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2.5"/><text x="625" y="666.05" font-size="13.5" font-weight="700" fill="#1E1E1E" text-anchor="middle">o destino existe?</text>
<rect x="754" y="626" width="206" height="72" rx="12" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2.5"/><text x="857" y="657.225" font-size="13.5" font-weight="700" fill="#1E1E1E" text-anchor="middle">recusado</text><text x="857" y="678.775" font-size="10.5" font-weight="400" fill="#5C5C5C" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="9.765">FileAlreadyExistsException</tspan></text>
<rect x="986" y="626" width="206" height="72" rx="12" fill="#FFD7AD" stroke="#F08C00" stroke-width="2.5"/><text x="1089" y="657.225" font-size="13.5" font-weight="700" fill="#1E1E1E" text-anchor="middle">nada substituído</text><text x="1089" y="678.775" font-size="10.5" font-weight="400" fill="#5C5C5C" text-anchor="middle">de surpresa, em lado nenhum</text>
<text x="36" y="52" font-size="26" font-weight="800" fill="#1E1E1E">O que está protegido, e como</text><text x="36" y="80" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start">Cada área e os passos que o código dá; os números são as constantes das classes.</text><g transform="translate(1076,30)"><rect width="128" height="28" rx="14" fill="#FFFFFF" stroke="#E0E0E0"/><circle cx="16" cy="14" r="6" fill="#F08C00"/><text x="30" y="19" font-size="12.5" font-weight="700" fill="#1E1E1E">OctopusFile</text></g>
