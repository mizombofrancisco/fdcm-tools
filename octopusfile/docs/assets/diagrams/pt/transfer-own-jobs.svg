<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 760" width="1240" height="760" role="img" aria-label="A sua própria tarefa na mesma fila" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title>A sua própria tarefa na mesma fila</title>
<defs><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#D4D4D4"/></pattern><filter id="shadow" x="-10%" y="-10%" width="130%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#000000" flood-opacity="0.18"/></filter><marker id="arrow-1E1E1E" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1.5,1.5 L10,6 L1.5,10.5" fill="none" stroke="#1E1E1E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-E93D82" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1.5,1.5 L10,6 L1.5,10.5" fill="none" stroke="#E93D82" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="1240" height="760" rx="18" fill="#F7F7F5"/><rect width="1240" height="760" rx="18" fill="url(#dots)"/><rect x="0.75" y="0.75" width="1238.5" height="758.5" rx="18" fill="none" stroke="#E0E0E0" stroke-width="1.5"/>
<g><rect x="380" y="130" width="460" height="556" rx="14" fill="#C7E4FF" fill-opacity="0.38" stroke="#0D8BF2" stroke-width="1.5" stroke-dasharray="0"/><rect x="392" y="117" width="309" height="26" rx="8" fill="#0D8BF2"/><text x="406" y="134" font-size="13" font-weight="700" fill="#FFFFFF">Reporter r — o que o seu código chama</text></g>
<path d="M186,226 L186,288" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
<path d="M186,370 L186,432" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
<path d="M336,482 L402,482" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#arrow-1E1E1E)"/>
<path d="M816,440 L850,440 L850,308 L878,308" fill="none" stroke="#E93D82" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#arrow-E93D82)"/>
<path d="M1076,208 L1098,208" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
<path d="M1076,308 L1098,308" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
<path d="M1076,408 L1098,408" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
<rect x="36" y="130" width="300" height="96" rx="12" fill="#FFD7AD" stroke="#F08C00" stroke-width="2.5"/><text x="186" y="173.05" font-size="14" font-weight="700" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13.02">tm.task(Kind, title, dest, work)</tspan></text><text x="186" y="195.25" font-size="11" font-weight="400" fill="#5C5C5C" text-anchor="middle"><tspan>devolve logo o </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="10.23">Transfer</tspan><tspan> (QUEUED)</tspan></text>
<rect x="36" y="290" width="300" height="80" rx="40" fill="#C2F0E6" stroke="#12A594" stroke-width="2.5"/><text x="186" y="325.05" font-size="14" font-weight="700" fill="#1E1E1E" text-anchor="middle">thread de trabalho</text><text x="186" y="347.25" font-size="11" font-weight="400" fill="#5C5C5C" text-anchor="middle">estado RUNNING</text>
<rect x="36" y="434" width="300" height="96" rx="12" fill="#2B2B2B" stroke="#1E1E1E" stroke-width="2.5"/><text x="186" y="476.7" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13.95">work.run(r)</tspan></text><text x="186" y="500.2" font-size="12" font-weight="400" fill="#E6E6E6" text-anchor="middle"><tspan>o seu </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.16">Work</tspan><tspan> recebe </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.16">Reporter r</tspan></text>
<rect x="163" y="245" width="46" height="24" rx="9" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/><text x="186" y="262" font-size="12.5" font-weight="600" fill="#1E1E1E" text-anchor="middle">fila</text>
<rect x="159.5" y="389" width="53" height="24" rx="9" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/><text x="186" y="406" font-size="12.5" font-weight="600" fill="#1E1E1E" text-anchor="middle">chama</text>
<rect x="404" y="160" width="412" height="68" rx="12" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2.5"/><text x="610" y="189.05" font-size="14" font-weight="700" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13.02">r.total(bytes, files)</tspan></text><text x="610" y="211.25" font-size="11" font-weight="400" fill="#5C5C5C" text-anchor="middle">os totais, se conhecidos; avisa logo</text>
<rect x="404" y="244" width="412" height="68" rx="12" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2.5"/><text x="610" y="273.05" font-size="14" font-weight="700" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13.02">r.bytes(n)</tspan></text><text x="610" y="295.25" font-size="11" font-weight="400" fill="#5C5C5C" text-anchor="middle">mais n bytes: progresso e velocidade</text>
<rect x="404" y="328" width="412" height="68" rx="12" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2.5"/><text x="610" y="357.05" font-size="14" font-weight="700" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13.02">r.file(name)</tspan></text><text x="610" y="379.25" font-size="11" font-weight="400" fill="#5C5C5C" text-anchor="middle">um ficheiro feito: aparece como item atual</text>
<rect x="404" y="412" width="412" height="68" rx="12" fill="#FFCCE5" stroke="#E93D82" stroke-width="2.5"/><text x="610" y="441.05" font-size="14" font-weight="700" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13.02">r.checkCancel()</tspan></text><text x="610" y="463.25" font-size="11" font-weight="400" fill="#5C5C5C" text-anchor="middle"><tspan>lança </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="10.23">TransferCancelledException</tspan><tspan> se cancelado</tspan></text>
<rect x="404" y="496" width="412" height="68" rx="12" fill="#FFCCE5" stroke="#E93D82" stroke-width="2.5"/><text x="610" y="525.05" font-size="14" font-weight="700" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13.02">r.cancelled()</tspan></text><text x="610" y="547.25" font-size="11" font-weight="400" fill="#5C5C5C" text-anchor="middle">true se cancelado — para callbacks que não podem lançar</text>
<rect x="404" y="580" width="412" height="68" rx="12" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2.5"/><text x="610" y="609.05" font-size="14" font-weight="700" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13.02">r.result(value)</tspan></text><text x="610" y="631.25" font-size="11" font-weight="400" fill="#5C5C5C" text-anchor="middle"><tspan>o que </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="10.23">getResult()</tspan><tspan> devolve</tspan></text>
<text x="880" y="150" font-size="15" font-weight="800" fill="#1E1E1E" text-anchor="start"><tspan>Como </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13.95">run</tspan><tspan> acaba</tspan></text>
<rect x="880" y="176" width="196" height="64" rx="12" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2.5"/><text x="978" y="211.9" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="middle">termina normalmente</text>
<rect x="1100" y="186" width="104" height="44" rx="22" fill="#CDF3C9" stroke="#30A46C" stroke-width="2.5"/><text x="1152" y="211.75" font-size="12.5" font-weight="700" fill="#1E1E1E" text-anchor="middle">DONE</text>
<text x="880" y="258" font-size="12" font-weight="400" fill="#5C5C5C" text-anchor="start"><tspan>CANCELLED se </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.16">cancel()</tspan><tspan> foi pedido</tspan></text>
<rect x="880" y="276" width="196" height="64" rx="12" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2.5"/><text x="978" y="311.9" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.09">TransferCancelledException</tspan></text>
<rect x="1100" y="286" width="104" height="44" rx="22" fill="#FFD7AD" stroke="#F08C00" stroke-width="2.5"/><text x="1152" y="311.75" font-size="12.5" font-weight="700" fill="#1E1E1E" text-anchor="middle">CANCELLED</text>
<rect x="880" y="376" width="196" height="64" rx="12" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2.5"/><text x="978" y="411.9" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="middle">outra exceção qualquer</text>
<rect x="1100" y="386" width="104" height="44" rx="22" fill="#FFC9C2" stroke="#E5484D" stroke-width="2.5"/><text x="1152" y="411.75" font-size="12.5" font-weight="700" fill="#1E1E1E" text-anchor="middle">FAILED</text>
<text x="880" y="458" font-size="12" font-weight="400" fill="#5C5C5C" text-anchor="start"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.16">getError()</tspan><tspan> = a mensagem</tspan></text>
<g filter="url(#shadow)"><rect x="880" y="486" width="324" height="92" rx="3" fill="#FFE88A"/></g><text x="894" y="510" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start">Os ouvintes são avisados no máximo de 120</text><text x="894" y="528.2" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start">em 120 ms (cerca de 8 por segundo), e</text><text x="894" y="546.4" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start"><tspan>logo em </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.09">total()</tspan><tspan> e nas mudanças de</tspan></text><text x="894" y="564.6" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start">estado.</text>
<g filter="url(#shadow)"><rect x="880" y="594" width="324" height="92" rx="3" fill="#C7E4FF"/></g><text x="894" y="618" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start">Progresso: bytes quando o total em bytes</text><text x="894" y="636.2" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start"><tspan>é conhecido; com </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.09">total(0, files)</tspan><tspan>,</tspan></text><text x="894" y="654.4" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start">ficheiros feitos / ficheiros; senão -1.</text>
<g filter="url(#shadow)"><rect x="36" y="570" width="300" height="116" rx="3" fill="#EBEBEB"/></g><text x="50" y="594" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start">Tipos: COPY, MOVE, SEND, UPLOAD,</text><text x="50" y="612.2" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start">DOWNLOAD, BACKUP, SYNC, VAULT,</text><text x="50" y="630.4" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start">RESTORE, SEARCH, INDEX, SCAN — só um</text><text x="50" y="648.6" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start">rótulo.</text>
<text x="380" y="726" font-size="13" font-weight="600" fill="#5C5C5C" text-anchor="start">Cancelado ainda em QUEUED: o código nunca corre.</text>
<text x="36" y="52" font-size="26" font-weight="800" fill="#1E1E1E">A sua própria tarefa na mesma fila</text><text x="36" y="80" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13.95">tm.task(kind, title, destination, work)</tspan><tspan> embrulha o seu código num </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13.95">Transfer</tspan><tspan>; corre numa thread de trabalho.</tspan></text><g transform="translate(1076,30)"><rect width="128" height="28" rx="14" fill="#FFFFFF" stroke="#E0E0E0"/><circle cx="16" cy="14" r="6" fill="#F08C00"/><text x="30" y="19" font-size="12.5" font-weight="700" fill="#1E1E1E">OctopusFile</text></g>
</svg>
