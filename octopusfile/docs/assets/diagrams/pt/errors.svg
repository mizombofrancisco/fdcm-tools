<g filter="url(#shadow)"><rect x="36" y="410" width="230" height="170" rx="3" fill="#FFE88A"/></g><text x="50" y="434" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="start">A fachada converte a</text><text x="50" y="452.9" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="start"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.555">IOException</tspan><tspan> de um módulo</tspan></text><text x="50" y="471.8" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="start"><tspan>em </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.555">OctopusFileException</tspan><tspan> e</tspan></text><text x="50" y="490.7" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="start">mantém o código do erro.</text>
<g filter="url(#shadow)"><rect x="300" y="490" width="330" height="130" rx="3" fill="#FFCCE5"/></g><text x="314" y="514" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="start"><tspan>Cuidado: </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.555">catch (OctopusFileException</tspan></text><text x="314" y="532.9" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="start"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.555">e)</tspan><tspan> à volta de uma classe de um módulo</tspan></text><text x="314" y="551.8" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="start">compila mas não apanha nada. Apanhe</text><text x="314" y="570.7" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="start"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.555">IOException</tspan><tspan>.</tspan></text>
<text x="36" y="52" font-size="26" font-weight="800" fill="#1E1E1E">Uma regra para os erros (toda a linha 2.x)</text><text x="36" y="80" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start"><tspan>A fachada lança exceções não verificadas; os módulos declaram </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13.95">IOException</tspan><tspan>, como </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13.95">java.nio.file.Files</tspan><tspan>.</tspan></text><g transform="translate(1076,30)"><rect width="128" height="28" rx="14" fill="#FFFFFF" stroke="#E0E0E0"/><circle cx="16" cy="14" r="6" fill="#F08C00"/><text x="30" y="19" font-size="12.5" font-weight="700" fill="#1E1E1E">OctopusFile</text></g>
