<rect x="595.5" y="418" width="53" height="24" rx="9" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/><text x="622" y="435" font-size="12.5" font-weight="600" fill="#1E1E1E" text-anchor="middle">lança</text>
