<rect x="700" y="120" width="500" height="90" rx="12" fill="#FFC9C2" stroke="#E5484D" stroke-width="2.5"/><text x="950" y="159.7" font-size="15" font-weight="700" fill="#1E1E1E" text-anchor="middle">OctopusFileException (não verificada)</text><text x="950" y="183.2" font-size="12" font-weight="400" fill="#5C5C5C" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.16">errorCode()</tspan><tspan> · </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.16">getPath()</tspan><tspan> · a causa lá dentro</tspan></text>
