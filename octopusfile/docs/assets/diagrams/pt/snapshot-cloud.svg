<rect x="257.5" y="783" width="39" height="24" rx="9" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/><text x="277" y="800" font-size="12.5" font-weight="600" fill="#1E1E1E" text-anchor="middle">sim</text>
<g filter="url(#shadow)"><rect x="880" y="716" width="324" height="92" rx="3" fill="#FFCCE5"/></g><text x="894" y="740" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start">Sem ficheiro de definições:</text><text x="894" y="758.2" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.09">NoSuchFileException</tspan><tspan> — não há</tspan></text><text x="894" y="776.4" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start">repositório nesta pasta. Nada local é</text><text x="894" y="794.6" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start">apagado.</text>
<g filter="url(#shadow)"><rect x="880" y="822" width="324" height="86" rx="3" fill="#E1D3FF"/></g><text x="894" y="846" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="start">Cifrado continua cifrado: os ficheiros</text><text x="894" y="863.5" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="start">viajam como estão no disco. Ambos devolvem</text><text x="894" y="881" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="start"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">SyncReport(filesCopied, bytesCopied,</tspan></text><text x="894" y="898.5" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="start"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">filesDeleted)</tspan><tspan>.</tspan></text>
<text x="36" y="52" font-size="26" font-weight="800" fill="#1E1E1E">Instantâneos na nuvem — push e pull</text><text x="36" y="80" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start">O conteúdo guardado nunca muda: só viajam os ficheiros em falta, numa ordem que nunca deixa um instantâneo sem o seu conteúdo.</text><g transform="translate(1076,30)"><rect width="128" height="28" rx="14" fill="#FFFFFF" stroke="#E0E0E0"/><circle cx="16" cy="14" r="6" fill="#F08C00"/><text x="30" y="19" font-size="12.5" font-weight="700" fill="#1E1E1E">OctopusFile</text></g>
</svg>
