<rect x="300" y="760" width="290" height="118" rx="12" fill="#C7E4FF" stroke="#0D8BF2" stroke-width="2.5"/><text x="445" y="799.75" font-size="14" font-weight="700" fill="#1E1E1E" text-anchor="middle">Trazer só o que falta aqui</text><text x="445" y="821.95" font-size="11" font-weight="400" fill="#5C5C5C" text-anchor="middle"><tspan>definições, </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="10.23">objects/xx/&lt;64 hex&gt;</tspan><tspan>, </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="10.23">*.snap</tspan></text><text x="445" y="836.25" font-size="11" font-weight="400" fill="#5C5C5C" text-anchor="middle">— outros nomes são ignorados; cada um via</text><text x="445" y="850.55" font-size="11" font-weight="400" fill="#5C5C5C" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="10.23">&lt;file&gt;.part</tspan></text>
