<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 750" width="1240" height="750" role="img" aria-label="Do que o OctopusFile precisa" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title>Do que o OctopusFile precisa</title>
<defs><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#D4D4D4"/></pattern><filter id="shadow" x="-10%" y="-10%" width="130%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#000000" flood-opacity="0.18"/></filter><marker id="arrow-1E1E1E" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1.5,1.5 L10,6 L1.5,10.5" fill="none" stroke="#1E1E1E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="1240" height="750" rx="18" fill="#F7F7F5"/><rect width="1240" height="750" rx="18" fill="url(#dots)"/><rect x="0.75" y="0.75" width="1238.5" height="748.5" rx="18" fill="none" stroke="#E0E0E0" stroke-width="1.5"/>
<g><rect x="36" y="130" width="300" height="240" rx="14" fill="#FFD7AD" fill-opacity="0.38" stroke="#F08C00" stroke-width="1.5" stroke-dasharray="0"/><rect x="48" y="117" width="58" height="26" rx="8" fill="#F08C00"/><text x="62" y="134" font-size="13" font-weight="700" fill="#FFFFFF">Java</text></g>
<g><rect x="356" y="130" width="848" height="240" rx="14" fill="#C7E4FF" fill-opacity="0.38" stroke="#0D8BF2" stroke-width="1.5" stroke-dasharray="0"/><rect x="368" y="117" width="172" height="26" rx="8" fill="#0D8BF2"/><text x="382" y="134" font-size="13" font-weight="700" fill="#FFFFFF">Sistemas operativos</text></g>
<g><rect x="36" y="420" width="760" height="300" rx="14" fill="#CDF3C9" fill-opacity="0.38" stroke="#30A46C" stroke-width="1.5" stroke-dasharray="0"/><rect x="48" y="407" width="218" height="26" rx="8" fill="#30A46C"/><text x="62" y="424" font-size="13" font-weight="700" fill="#FFFFFF">Module path ou class path</text></g>
<g><rect x="816" y="420" width="388" height="300" rx="14" fill="#E1D3FF" fill-opacity="0.38" stroke="#8E4EC6" stroke-width="1.5" stroke-dasharray="0"/><rect x="828" y="407" width="149" height="26" rx="8" fill="#8E4EC6"/><text x="842" y="424" font-size="13" font-weight="700" fill="#FFFFFF">Sem dependências</text></g>
<path d="M230,526 L230,546" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
<path d="M600,526 L600,546" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
<path d="M1010,496 L1010,520" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
<rect x="66" y="162" width="240" height="90" rx="12" fill="#FFD7AD" stroke="#F08C00" stroke-width="2.5"/><text x="186" y="201" font-size="17" font-weight="700" fill="#1E1E1E" text-anchor="middle">Java 17 ou mais recente</text><text x="186" y="227.1" font-size="14" font-weight="400" fill="#5C5C5C" text-anchor="middle"><tspan>compilado com </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13.02">release 17</tspan></text>
<g filter="url(#shadow)"><rect x="66" y="272" width="240" height="76" rx="3" fill="#FFE88A"/></g><text x="80" y="296" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start">Toda a linha 2.x LTS fica no</text><text x="80" y="314.2" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start">Java 17.</text>
<rect x="380" y="162" width="254" height="70" rx="12" fill="#CDF3C9" stroke="#30A46C" stroke-width="2.5"/><text x="507" y="191" font-size="17" font-weight="700" fill="#1E1E1E" text-anchor="middle">Windows 11</text><text x="507" y="217.1" font-size="14" font-weight="400" fill="#5C5C5C" text-anchor="middle">testado</text>
<text x="507" y="262" font-size="12.5" font-weight="600" fill="#1E1E1E" text-anchor="middle"><tspan>caminhos UNC e </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">net use</tspan><tspan> para</tspan></text><text x="507" y="278.875" font-size="12.5" font-weight="600" fill="#1E1E1E" text-anchor="middle">partilhas</text>
<rect x="654" y="162" width="254" height="70" rx="12" fill="#FFE88A" stroke="#E0B400" stroke-width="2.5"/><text x="781" y="191" font-size="17" font-weight="700" fill="#1E1E1E" text-anchor="middle">Linux</text><text x="781" y="217.1" font-size="14" font-weight="400" fill="#5C5C5C" text-anchor="middle">precisa de mais testes</text>
<text x="781" y="262" font-size="12.5" font-weight="600" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">/media</tspan><tspan>, </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">/run/media</tspan><tspan> · </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">gio</tspan></text><text x="781" y="278.875" font-size="12.5" font-weight="600" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">mount</tspan><tspan> para SMB</tspan></text>
<rect x="928" y="162" width="254" height="70" rx="12" fill="#FFE88A" stroke="#E0B400" stroke-width="2.5"/><text x="1055" y="191" font-size="17" font-weight="700" fill="#1E1E1E" text-anchor="middle">macOS</text><text x="1055" y="217.1" font-size="14" font-weight="400" fill="#5C5C5C" text-anchor="middle">precisa de mais testes</text>
<text x="1055" y="262" font-size="12.5" font-weight="600" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">/Volumes</tspan><tspan> · </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">mount volume</tspan><tspan> para</tspan></text><text x="1055" y="278.875" font-size="12.5" font-weight="600" fill="#1E1E1E" text-anchor="middle">SMB</text>
<text x="380" y="340" font-size="13" font-weight="600" fill="#1E1E1E" text-anchor="start">Ficheiros, Lixo, pesquisa, cofre, cópias de segurança: o mesmo código Java em todos os sistemas.</text>
<rect x="60" y="456" width="340" height="70" rx="12" fill="#CDF3C9" stroke="#30A46C" stroke-width="2.5"/><text x="230" y="485.7" font-size="15" font-weight="700" fill="#1E1E1E" text-anchor="middle">Module path</text><text x="230" y="509.2" font-size="12" font-weight="400" fill="#5C5C5C" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.16">requires com.octopusfile;</tspan></text>
<rect x="430" y="456" width="340" height="70" rx="12" fill="#EBEBEB" stroke="#8F8F8F" stroke-width="2.5"/><text x="600" y="485.7" font-size="15" font-weight="700" fill="#1E1E1E" text-anchor="middle">Class path</text><text x="600" y="509.2" font-size="12" font-weight="400" fill="#5C5C5C" text-anchor="middle">o JAR funciona como antes da 1.2</text>
<g filter="url(#shadow)"><rect x="60" y="548" width="340" height="140" rx="3" fill="#CDF3C9"/></g><text x="74" y="572" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start">Só os pacotes exportados são visíveis: a</text><text x="74" y="590.2" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start"><tspan>raiz, </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.09">modules.*</tspan><tspan> e </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.09">infrastructure.</tspan></text><text x="74" y="608.4" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start">compression, errors, hashing, network,</text><text x="74" y="626.6" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start">security, storage.</text>
<g filter="url(#shadow)"><rect x="430" y="548" width="340" height="140" rx="3" fill="#FFCCE5"/></g><text x="444" y="572" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start">Todas as classes públicas ficam visíveis,</text><text x="444" y="590.2" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start">também as internas: as marcadas com</text><text x="444" y="608.4" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.09">@Internal</tspan><tspan> podem mudar em qualquer versão.</tspan></text>
<rect x="900" y="452" width="220" height="44" rx="22" fill="#FFD7AD" stroke="#F08C00" stroke-width="2.5"/><text x="1010" y="478.2" font-size="14" font-weight="700" fill="#1E1E1E" text-anchor="middle">OctopusFile.jar</text>
<rect x="840" y="524" width="164" height="36" rx="18" fill="#2B2B2B" stroke="#1E1E1E" stroke-width="2.5"/><text x="922" y="545.75" font-size="12.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">java.base</text>
<rect x="1016" y="524" width="164" height="36" rx="18" fill="#2B2B2B" stroke="#1E1E1E" stroke-width="2.5"/><text x="1098" y="545.75" font-size="12.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">java.logging</text>
<rect x="840" y="570" width="164" height="36" rx="18" fill="#2B2B2B" stroke="#1E1E1E" stroke-width="2.5"/><text x="922" y="591.75" font-size="12.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">java.net.http</text>
<rect x="1016" y="570" width="164" height="36" rx="18" fill="#2B2B2B" stroke="#1E1E1E" stroke-width="2.5"/><text x="1098" y="591.75" font-size="12.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">java.xml</text>
<text x="840" y="630" font-size="12.5" font-weight="600" fill="#5C5C5C" text-anchor="start"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">requires</tspan><tspan> no module-info: registos, HTTP</tspan></text>
<text x="840" y="648" font-size="12.5" font-weight="600" fill="#5C5C5C" text-anchor="start">(WebDAV, transferências), XML (WebDAV).</text>
<text x="840" y="682" font-size="12.5" font-weight="700" fill="#8E4EC6" text-anchor="start">Nenhum outro JAR; só montar SMB corre um</text>
<text x="840" y="706" font-size="12.5" font-weight="700" fill="#8E4EC6" text-anchor="start"><tspan>comando do sistema (</tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">net use</tspan><tspan>, </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">gio</tspan><tspan>, </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">mount</tspan><tspan>).</tspan></text>
<text x="36" y="52" font-size="26" font-weight="800" fill="#1E1E1E">Do que o OctopusFile precisa</text><text x="36" y="80" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start">Um runtime Java 17 e mais nada; o JAR funciona como módulo ou no class path.</text><g transform="translate(1076,30)"><rect width="128" height="28" rx="14" fill="#FFFFFF" stroke="#E0E0E0"/><circle cx="16" cy="14" r="6" fill="#F08C00"/><text x="30" y="19" font-size="12.5" font-weight="700" fill="#1E1E1E">OctopusFile</text></g>
</svg>
