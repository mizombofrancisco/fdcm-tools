<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 560" width="1240" height="560" role="img" aria-label="Três ferramentas para proteger dados — qual escolher?" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title>Três ferramentas para proteger dados — qual escolher?</title>
<defs><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#D4D4D4"/></pattern><filter id="shadow" x="-10%" y="-10%" width="130%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#000000" flood-opacity="0.18"/></filter><marker id="arrow-1E1E1E" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1.5,1.5 L10,6 L1.5,10.5" fill="none" stroke="#1E1E1E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="1240" height="560" rx="18" fill="#F7F7F5"/><rect width="1240" height="560" rx="18" fill="url(#dots)"/><rect x="0.75" y="0.75" width="1238.5" height="558.5" rx="18" fill="none" stroke="#E0E0E0" stroke-width="1.5"/>

<path d="M236,275 L270,275 L270,175 L298,175" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
<path d="M550,175 L598,175" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
<path d="M236,275 L270,275 L270,315 L298,315" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
<path d="M550,315 L598,315" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
<path d="M236,275 L270,275 L270,455 L298,455" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
<path d="M550,455 L598,455" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
<polygon points="136,210 236,275 136,340 36,275" fill="#FFE88A" stroke="#E0B400" stroke-width="2.5" stroke-linejoin="round"/><text x="136" y="270.1" font-size="14" font-weight="700" fill="#1E1E1E" text-anchor="middle">O que quer</text><text x="136" y="288.3" font-size="14" font-weight="700" fill="#1E1E1E" text-anchor="middle">proteger?</text>
<g filter="url(#shadow)"><rect x="300" y="120" width="250" height="110" rx="3" fill="#FFE88A"/></g><text x="314" y="144" font-size="15" font-weight="400" fill="#1E1E1E" text-anchor="start">Muitos ficheiros privados</text>
<rect x="600" y="120" width="604" height="110" rx="12" fill="#E1D3FF" stroke="#8E4EC6" stroke-width="2.5"/><text x="902" y="159.9" font-size="17" font-weight="700" fill="#1E1E1E" text-anchor="middle">Vault</text><text x="902" y="186" font-size="14" font-weight="400" fill="#5C5C5C" text-anchor="middle">uma pasta: nomes, tamanhos e datas também cifrados · chave da palavra-passe</text><text x="902" y="204.2" font-size="14" font-weight="400" fill="#5C5C5C" text-anchor="middle">(PBKDF2, 310 000 iterações)</text>
<g filter="url(#shadow)"><rect x="300" y="260" width="250" height="110" rx="3" fill="#FFE88A"/></g><text x="314" y="284" font-size="15" font-weight="400" fill="#1E1E1E" text-anchor="start">Um ficheiro para guardar</text><text x="314" y="305" font-size="15" font-weight="400" fill="#1E1E1E" text-anchor="start">ou enviar</text>
<rect x="600" y="260" width="604" height="110" rx="12" fill="#C7E4FF" stroke="#0D8BF2" stroke-width="2.5"/><text x="902" y="299.9" font-size="17" font-weight="700" fill="#1E1E1E" text-anchor="middle">EncryptionEngine</text><text x="902" y="326" font-size="14" font-weight="400" fill="#5C5C5C" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13.02">encrypt(source, target, password)</tspan><tspan> · formato OFE2 em blocos de 1 MiB ·</tspan></text><text x="902" y="344.2" font-size="14" font-weight="400" fill="#5C5C5C" text-anchor="middle">PBKDF2, 210 000 iterações</text>
<g filter="url(#shadow)"><rect x="300" y="400" width="250" height="110" rx="3" fill="#FFE88A"/></g><text x="314" y="424" font-size="15" font-weight="400" fill="#1E1E1E" text-anchor="start">Uma palavra-passe que a</text><text x="314" y="445" font-size="15" font-weight="400" fill="#1E1E1E" text-anchor="start">app reutiliza</text>
<rect x="600" y="400" width="604" height="110" rx="12" fill="#C2F0E6" stroke="#12A594" stroke-width="2.5"/><text x="902" y="439.9" font-size="17" font-weight="700" fill="#1E1E1E" text-anchor="middle">CredentialVault</text><text x="902" y="466" font-size="14" font-weight="400" fill="#5C5C5C" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13.02">seal</tspan><tspan> / </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13.02">open</tspan><tspan> de segredos pequenos · chave aleatória num ficheiro</tspan></text><text x="902" y="484.2" font-size="14" font-weight="400" fill="#5C5C5C" text-anchor="middle">privado, sem palavra-passe</text>
<text x="36" y="52" font-size="26" font-weight="800" fill="#1E1E1E">Três ferramentas para proteger dados — qual escolher?</text><text x="36" y="80" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start">Todas usam AES-256-GCM; mudam no que protegem e de onde vem a chave.</text><g transform="translate(1076,30)"><rect width="128" height="28" rx="14" fill="#FFFFFF" stroke="#E0E0E0"/><circle cx="16" cy="14" r="6" fill="#F08C00"/><text x="30" y="19" font-size="12.5" font-weight="700" fill="#1E1E1E">OctopusFile</text></g>
</svg>
