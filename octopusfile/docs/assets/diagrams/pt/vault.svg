<g filter="url(#shadow)"><rect x="36" y="470" width="340" height="120" rx="3" fill="#FFE88A"/></g><text x="50" y="494" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="start"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.555">extract</tspan><tspan> escreve um ficheiro temporário e</tspan></text><text x="50" y="512.9" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="start">só lhe dá o nome final depois de verificar</text><text x="50" y="531.8" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="start">todos os blocos: nunca fica um ficheiro</text><text x="50" y="550.7" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="start">parcial.</text>
<g filter="url(#shadow)"><rect x="400" y="470" width="360" height="120" rx="3" fill="#FFCCE5"/></g><text x="414" y="494" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="start">Não há recuperação sem a palavra-passe.</text><text x="414" y="512.9" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="start"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.555">lock()</tspan><tspan> ou </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.555">close()</tspan><tspan> esquece a chave.</tspan></text>
<text x="36" y="52" font-size="26" font-weight="800" fill="#1E1E1E">Cofre: uma pasta cifrada</text><text x="36" y="80" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start">A palavra-passe nunca é guardada; nomes, tamanhos e datas também são cifrados.</text><g transform="translate(1076,30)"><rect width="128" height="28" rx="14" fill="#FFFFFF" stroke="#E0E0E0"/><circle cx="16" cy="14" r="6" fill="#F08C00"/><text x="30" y="19" font-size="12.5" font-weight="700" fill="#1E1E1E">OctopusFile</text></g>
