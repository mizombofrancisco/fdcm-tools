<g><rect x="636" y="130" width="568" height="380" rx="14" fill="#E1D3FF" fill-opacity="0.38" stroke="#8E4EC6" stroke-width="1.5" stroke-dasharray="0"/><rect x="648" y="117" width="66" height="26" rx="8" fill="#8E4EC6"/><text x="662" y="134" font-size="13" font-weight="700" fill="#FFFFFF">Cofre</text></g>
<g><rect x="36" y="560" width="376" height="240" rx="14" fill="#FFCCE5" fill-opacity="0.38" stroke="#E93D82" stroke-width="1.5" stroke-dasharray="0"/><rect x="48" y="547" width="149" height="26" rx="8" fill="#E93D82"/><text x="62" y="564" font-size="13" font-weight="700" fill="#FFFFFF">EncryptionEngine</text></g>
<g><rect x="432" y="560" width="376" height="240" rx="14" fill="#C7E4FF" fill-opacity="0.38" stroke="#0D8BF2" stroke-width="1.5" stroke-dasharray="0"/><rect x="444" y="547" width="142" height="26" rx="8" fill="#0D8BF2"/><text x="458" y="564" font-size="13" font-weight="700" fill="#FFFFFF">CredentialVault</text></g>
<g><rect x="828" y="560" width="376" height="240" rx="14" fill="#FFD7AD" fill-opacity="0.38" stroke="#F08C00" stroke-width="1.5" stroke-dasharray="0"/><rect x="840" y="547" width="126" height="26" rx="8" fill="#F08C00"/><text x="854" y="564" font-size="13" font-weight="700" fill="#FFFFFF">Partilhas SMB</text></g>
<path d="M290,196 L326,196" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
<path d="M290,280 L326,280" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
<path d="M290,364 L326,364" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
<path d="M880,196 L916,196" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
<path d="M880,280 L916,280" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
<path d="M880,364 L916,364" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
<path d="M880,448 L916,448" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
<path d="M224,656 L224,698" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
<path d="M620,656 L620,698" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
<path d="M1016,656 L1016,698" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
<rect x="52" y="160" width="236" height="72" rx="12" fill="#FFC9C2" stroke="#E5484D" stroke-width="2.5"/><text x="170" y="175.375" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="middle">as duas chaves enviadas ao</text><text x="170" y="191.625" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="middle">mesmo tempo: um computador no</text><text x="170" y="207.875" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="middle">meio podia experimentar</text><text x="170" y="224.125" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="middle">milhões</text>
<rect x="328" y="160" width="268" height="72" rx="12" fill="#CDF3C9" stroke="#30A46C" stroke-width="2.5"/><text x="462" y="183.5" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="middle">compromisso: primeiro o hash da</text><text x="462" y="199.75" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="middle">chave, depois a chave; uma hipótese</text><text x="462" y="216" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="middle">num milhão</text>
<rect x="52" y="244" width="236" height="72" rx="12" fill="#FFC9C2" stroke="#E5484D" stroke-width="2.5"/><text x="170" y="275.625" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="middle">uma ligação silenciosa prendia</text><text x="170" y="291.875" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="middle">uma thread para sempre</text>
<rect x="328" y="244" width="268" height="72" rx="12" fill="#CDF3C9" stroke="#30A46C" stroke-width="2.5"/><text x="462" y="275.625" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="middle">15 s para o handshake, no máximo 4</text><text x="462" y="291.875" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="middle">ligações, socket sempre fechado</text>
<rect x="52" y="328" width="236" height="72" rx="12" fill="#FFC9C2" stroke="#E5484D" stroke-width="2.5"/><text x="170" y="351.5" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="middle"><tspan>recebido em </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">name.part</tspan><tspan>:</tspan></text><text x="170" y="367.75" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="middle">truncava um ficheiro do</text><text x="170" y="384" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="middle">utilizador com esse nome</text>
<rect x="328" y="328" width="268" height="72" rx="12" fill="#CDF3C9" stroke="#30A46C" stroke-width="2.5"/><text x="462" y="351.5" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="middle"><tspan>um novo </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">.part</tspan><tspan> oculto; tem de</tspan></text><text x="462" y="367.75" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="middle"><tspan>caber no espaço livre; </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">CON</tspan><tspan>,</tspan></text><text x="462" y="384" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">NUL</tspan><tspan>, </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">COM1</tspan><tspan>… limpos</tspan></text>
<g filter="url(#shadow)"><rect x="52" y="410" width="552" height="70" rx="3" fill="#FFE88A"/></g><text x="66" y="434" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start"><tspan>Esta é a versão 2 do protocolo (</tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.09">FILEEXP-LAN2</tspan><tspan>, </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.09">FXL2</tspan><tspan>). Os computadores</tspan></text><text x="66" y="452.2" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start">com a versão 1 são recusados com uma mensagem clara.</text>
<rect x="652" y="160" width="226" height="72" rx="12" fill="#FFC9C2" stroke="#E5484D" stroke-width="2.5"/><text x="765" y="183.5" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="middle">mudar a palavra-passe:</text><text x="765" y="199.75" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="middle">ficheiros movidos um a um;</text><text x="765" y="216" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="middle">uma falha podia perdê-los</text>
<rect x="918" y="160" width="262" height="72" rx="12" fill="#CDF3C9" stroke="#30A46C" stroke-width="2.5"/><text x="1049" y="183.5" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="middle">um ponto de confirmação:</text><text x="1049" y="199.75" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="middle"><tspan>substituir </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">vault.properties</tspan><tspan>;</tspan></text><text x="1049" y="216" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">unlock</tspan><tspan> termina ou desfaz</tspan></text>
<rect x="652" y="244" width="226" height="72" rx="12" fill="#FFC9C2" stroke="#E5484D" stroke-width="2.5"/><text x="765" y="275.625" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="middle">cópias decifradas escritas</text><text x="765" y="291.875" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="middle">numa pasta temporária</text>
<rect x="918" y="244" width="262" height="72" rx="12" fill="#CDF3C9" stroke="#30A46C" stroke-width="2.5"/><text x="1049" y="275.625" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="middle">cifrado de novo bloco a bloco em</text><text x="1049" y="291.875" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="middle"><tspan>memória (</tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">id.new</tspan><tspan>)</tspan></text>
<rect x="652" y="328" width="226" height="72" rx="12" fill="#FFC9C2" stroke="#E5484D" stroke-width="2.5"/><text x="765" y="351.5" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="middle">um número absurdo de</text><text x="765" y="367.75" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="middle">iterações bloqueava o</text><text x="765" y="384" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">unlock</tspan></text>
<rect x="918" y="328" width="262" height="72" rx="12" fill="#CDF3C9" stroke="#30A46C" stroke-width="2.5"/><text x="1049" y="359.625" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="middle">fora de 100 000 – 10 000 000:</text><text x="1049" y="375.875" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="middle">recusado como dano</text>
<rect x="652" y="412" width="226" height="72" rx="12" fill="#FFC9C2" stroke="#E5484D" stroke-width="2.5"/><text x="765" y="443.625" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">extract</tspan><tspan> escrevia em</tspan></text><text x="765" y="459.875" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">name.part</tspan></text>
<rect x="918" y="412" width="262" height="72" rx="12" fill="#CDF3C9" stroke="#30A46C" stroke-width="2.5"/><text x="1049" y="435.5" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="middle">um ficheiro temporário novo, com o</text><text x="1049" y="451.75" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="middle">nome final só depois de verificar</text><text x="1049" y="468" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="middle">os blocos</text>
<rect x="52" y="588" width="344" height="66" rx="12" fill="#FFC9C2" stroke="#E5484D" stroke-width="2.5"/><text x="224" y="608.5" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="middle">o ficheiro inteiro em memória (uma mensagem</text><text x="224" y="624.75" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="middle">GCM); palavra-passe errada: destino parcial ou</text><text x="224" y="641" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="middle">vazio</text>
<rect x="52" y="700" width="344" height="84" rx="12" fill="#CDF3C9" stroke="#30A46C" stroke-width="2.5"/><text x="224" y="729.5" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="middle">formato 2 em blocos de 1 MiB; o destino só</text><text x="224" y="745.75" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="middle">aparece depois de tudo verificado; o formato 1</text><text x="224" y="762" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="middle">continua a abrir</text>
<rect x="448" y="588" width="344" height="66" rx="12" fill="#FFC9C2" stroke="#E5484D" stroke-width="2.5"/><text x="620" y="608.5" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="middle">um ficheiro de chave danificado era</text><text x="620" y="624.75" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="middle">substituído em silêncio: todos os segredos</text><text x="620" y="641" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="middle">perdidos</text>
<rect x="448" y="700" width="344" height="84" rx="12" fill="#CDF3C9" stroke="#30A46C" stroke-width="2.5"/><text x="620" y="737.625" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="middle">um erro, e o ficheiro é mantido; um ficheiro</text><text x="620" y="753.875" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="middle">de chave novo é privado desde o primeiro byte</text>
<rect x="844" y="588" width="344" height="66" rx="12" fill="#FFC9C2" stroke="#E5484D" stroke-width="2.5"/><text x="1016" y="616.625" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="middle">macOS: a palavra-passe nos argumentos do</text><text x="1016" y="632.875" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">osascript</tspan><tspan>, visível no </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">ps</tspan></text>
<rect x="844" y="700" width="344" height="84" rx="12" fill="#CDF3C9" stroke="#30A46C" stroke-width="2.5"/><text x="1016" y="729.5" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="middle">o script passa pela entrada padrão; a saída é</text><text x="1016" y="745.75" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="middle">lida durante a execução; palavra-passe tirada</text><text x="1016" y="762" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="middle">dos erros</text>
<text x="36" y="52" font-size="26" font-weight="800" fill="#1E1E1E">Alterações na 1.3: antes → depois</text><text x="36" y="80" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start">Vermelho: como era antes da revisão. Verde: como o código funciona desde a 1.3.</text><g transform="translate(1076,30)"><rect width="128" height="28" rx="14" fill="#FFFFFF" stroke="#E0E0E0"/><circle cx="16" cy="14" r="6" fill="#F08C00"/><text x="30" y="19" font-size="12.5" font-weight="700" fill="#1E1E1E">OctopusFile</text></g>
</svg>
