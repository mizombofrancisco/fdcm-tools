<rect x="149" y="434" width="130" height="24" rx="9" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/><text x="214" y="451" font-size="12.5" font-weight="600" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">pause()</tspan><tspan> — logo</tspan></text>
<rect x="169" y="288" width="186" height="24" rx="9" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/><text x="262" y="305" font-size="12.5" font-weight="600" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">resume()</tspan><tspan> — mesmo lugar</tspan></text>
<rect x="679" y="368" width="242" height="24" rx="9" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/><text x="800" y="385" font-size="12.5" font-weight="600" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">pause()</tspan><tspan> — próximo ponto seguro</tspan></text>
<rect x="557.5" y="288" width="165" height="24" rx="9" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/><text x="640" y="305" font-size="12.5" font-weight="600" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">resume()</tspan><tspan> — continua</tspan></text>
<rect x="693" y="506" width="214" height="24" rx="9" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/><text x="800" y="523" font-size="12.5" font-weight="600" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">cancel()</tspan><tspan> — também em pausa</tspan></text>
<g filter="url(#shadow)"><rect x="850" y="410" width="190" height="96" rx="3" fill="#FFE88A"/></g><text x="864" y="434" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="start"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">isPauseRequested()</tspan><tspan>:</tspan></text><text x="864" y="451.5" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="start"><tspan>verdadeiro de </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">pause()</tspan></text><text x="864" y="469" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="start"><tspan>a </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">resume()</tspan></text>
<g filter="url(#shadow)"><rect x="60" y="652" width="266" height="132" rx="3" fill="#CDF3C9"/></g><text x="74" y="676" font-size="13" font-weight="700" fill="#1E1E1E">copy</text><text x="74" y="696.225" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="start">antes do item seguinte e depois de</text><text x="74" y="713.725" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="start">cada bloco de 1 MB: o ficheiro</text><text x="74" y="731.225" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="start">meio escrito continua do mesmo</text><text x="74" y="748.725" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="start">byte</text>
<g filter="url(#shadow)"><rect x="344" y="652" width="266" height="132" rx="3" fill="#FFE88A"/></g><text x="358" y="676" font-size="13" font-weight="700" fill="#1E1E1E">upload</text><text x="358" y="696.225" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="start">só entre ficheiros: um pedido</text><text x="358" y="713.725" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="start">nunca espera a meio</text>
<g filter="url(#shadow)"><rect x="628" y="652" width="266" height="132" rx="3" fill="#FFCCE5"/></g><text x="642" y="676" font-size="13" font-weight="700" fill="#1E1E1E">pushSnapshots</text><text x="642" y="696.225" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="start">só na fila; a correr, a pausa fica</text><text x="642" y="713.725" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="start">pedida</text>
<g filter="url(#shadow)"><rect x="912" y="652" width="266" height="132" rx="3" fill="#FFD7AD"/></g><text x="926" y="676" font-size="13" font-weight="700" fill="#1E1E1E">descargas, pullSnapshots</text><text x="926" y="696.225" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="start">depois do próximo bloco; a ligação</text><text x="926" y="713.725" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="start">fica aberta (um servidor pode</text><text x="926" y="731.225" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="start">fechá-la)</text>
<g filter="url(#shadow)"><rect x="60" y="800" width="266" height="132" rx="3" fill="#C7E4FF"/></g><text x="74" y="824" font-size="13" font-weight="700" fill="#1E1E1E">snapshot, restore,</text><text x="74" y="842" font-size="13" font-weight="700" fill="#1E1E1E">restoreVersion</text><text x="74" y="862.45" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="start">no próximo relatório de progresso;</text><text x="74" y="879.95" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="start">o repositório fica ocupado</text>
<g filter="url(#shadow)"><rect x="344" y="800" width="266" height="132" rx="3" fill="#C2F0E6"/></g><text x="358" y="824" font-size="13" font-weight="700" fill="#1E1E1E">searchContent</text><text x="358" y="844.225" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="start">só quando comunica um resultado</text>
<g filter="url(#shadow)"><rect x="628" y="800" width="266" height="132" rx="3" fill="#C2F0E6"/></g><text x="642" y="824" font-size="13" font-weight="700" fill="#1E1E1E">buildIndex, findDuplicates</text><text x="642" y="844.225" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="start">no próximo relatório de progresso</text><text x="642" y="861.725" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="start">(alguns milhares de nomes)</text>
<g filter="url(#shadow)"><rect x="912" y="800" width="266" height="132" rx="3" fill="#EBEBEB"/></g><text x="926" y="824" font-size="13" font-weight="700" fill="#1E1E1E">task(...)</text><text x="926" y="844.225" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="start"><tspan>em </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">checkCancel()</tspan><tspan> e</tspan></text><text x="926" y="861.725" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="start"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">cancelled()</tspan><tspan>; nunca chamados → só</tspan></text><text x="926" y="879.225" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="start">na fila</text>
<text x="36" y="52" font-size="26" font-weight="800" fill="#1E1E1E">Pausar e retomar: os estados de uma Transfer desde a 2.1</text><text x="36" y="80" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13.95">pause()</tspan><tspan>, </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13.95">resume()</tspan><tspan>, </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13.95">TransferManager.pauseAll()</tspan><tspan> / </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13.95">resumeAll()</tspan><tspan> — </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13.95">PAUSED</tspan><tspan> não é um estado final.</tspan></text><g transform="translate(1076,30)"><rect width="128" height="28" rx="14" fill="#FFFFFF" stroke="#E0E0E0"/><circle cx="16" cy="14" r="6" fill="#F08C00"/><text x="30" y="19" font-size="12.5" font-weight="700" fill="#1E1E1E">OctopusFile</text></g>
</svg>
