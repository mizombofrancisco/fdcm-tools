<text x="1052" y="392" font-size="12.5" font-weight="700" fill="#5C5C5C" text-anchor="end"><tspan>terminados: </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">isFinished()</tspan></text>
