<text x="620" y="488" font-size="12.5" font-weight="700" fill="#E5484D" text-anchor="middle">uma falha em qualquer passo</text>
<text x="36" y="690" font-size="13.5" font-weight="400" fill="#5C5C5C" text-anchor="start"><tspan>Sucesso: </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.555">renameAll</tspan><tspan> devolve os pares; passe-os de volta invertidos para desfazer. Os nomes temporários começam por </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.555">.~ren-</tspan><tspan> e ficam na mesma pasta.</tspan></text>
<text x="36" y="52" font-size="26" font-weight="800" fill="#1E1E1E">renameAll: tudo ou nada</text><text x="36" y="80" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start">Exemplo: uma troca (a ↔ b) e uma mudança simples (c → d) na mesma pasta.</text><g transform="translate(1076,30)"><rect width="128" height="28" rx="14" fill="#FFFFFF" stroke="#E0E0E0"/><circle cx="16" cy="14" r="6" fill="#F08C00"/><text x="30" y="19" font-size="12.5" font-weight="700" fill="#1E1E1E">OctopusFile</text></g>
