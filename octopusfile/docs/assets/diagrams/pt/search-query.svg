<g filter="url(#shadow)"><rect x="856" y="552" width="348" height="92" rx="3" fill="#FFE88A"/></g><text x="870" y="576" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start">Só as palavras com 3 ou mais letras usam o</text><text x="870" y="594.2" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start">índice de trigramas; texto mais curto é</text><text x="870" y="612.4" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start">verificado em todos os nomes.</text>
<g filter="url(#shadow)"><rect x="856" y="660" width="348" height="90" rx="3" fill="#C7E4FF"/></g><text x="870" y="684" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start">Um texto vazio coincide com todos os nomes:</text><text x="870" y="702.2" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start">aí só contam os filtros.</text>
<text x="36" y="52" font-size="26" font-weight="800" fill="#1E1E1E">Uma pesquisa por nome: SearchQuery entra, SearchResult sai</text><text x="36" y="80" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13.95">index.search(query)</tspan><tspan> usa o índice de trigramas para achar candidatos, filtra-os e guarda os </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13.95">limit</tspan><tspan> melhores.</tspan></text><g transform="translate(1076,30)"><rect width="128" height="28" rx="14" fill="#FFFFFF" stroke="#E0E0E0"/><circle cx="16" cy="14" r="6" fill="#F08C00"/><text x="30" y="19" font-size="12.5" font-weight="700" fill="#1E1E1E">OctopusFile</text></g>
