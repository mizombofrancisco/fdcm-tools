<text x="60" y="660" font-size="13" font-weight="600" fill="#1E1E1E" text-anchor="start"><tspan>Cada </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.09">FileEvent</tspan><tspan> tem </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.09">path()</tspan><tspan>, </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.09">kind()</tspan><tspan> e </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.09">timestamp()</tspan><tspan>; no OVERFLOW o caminho é a pasta: volte a lê-la.</tspan></text>
<rect x="60" y="770" width="300" height="140" rx="12" fill="#E1D3FF" stroke="#8E4EC6" stroke-width="2.5"/><text x="210" y="827.9" font-size="14" font-weight="700" fill="#1E1E1E" text-anchor="middle">Um motor partilhado</text><text x="210" y="850.1" font-size="11" font-weight="400" fill="#5C5C5C" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="10.23">modules.monitoring.WatchService</tspan><tspan>: um serviço</tspan></text><text x="210" y="864.4" font-size="11" font-weight="400" fill="#5C5C5C" text-anchor="middle">do sistema e uma thread para todas as pastas</text>
