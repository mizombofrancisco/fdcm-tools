<rect x="639.5" y="818" width="151" height="24" rx="9" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/><text x="715" y="835" font-size="12.5" font-weight="600" fill="#1E1E1E" text-anchor="middle">CREATED → registada</text>
<g filter="url(#shadow)"><rect x="850" y="762" width="334" height="158" rx="3" fill="#FFE88A"/></g><text x="864" y="786" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="start"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">recursive = true</tspan><tspan>: todas as subpastas são</tspan></text><text x="864" y="803.5" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="start">registadas no início, e cada nova quando</text><text x="864" y="821" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="start">chega o seu evento CREATED.</text><text x="864" y="838.5" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="start"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">Subscription.cancel()</tspan><tspan> para; um ouvinte que</tspan></text><text x="864" y="856" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="start">lança uma exceção vai para o registo (log) e</text><text x="864" y="873.5" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="start">os outros continuam.</text>
<text x="36" y="52" font-size="26" font-weight="800" fill="#1E1E1E">Vigiar pastas: do sistema às suas callbacks</text><text x="36" y="80" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start"><tspan>Assente no </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13.95">WatchService</tspan><tspan> do JDK. A fachada vigia uma pasta; o módulo pode seguir uma árvore inteira.</tspan></text><g transform="translate(1076,30)"><rect width="128" height="28" rx="14" fill="#FFFFFF" stroke="#E0E0E0"/><circle cx="16" cy="14" r="6" fill="#F08C00"/><text x="30" y="19" font-size="12.5" font-weight="700" fill="#1E1E1E">OctopusFile</text></g>
</svg>
