<rect x="820" y="172" width="360" height="106" rx="12" fill="#E1D3FF" stroke="#8E4EC6" stroke-width="2.5"/><text x="1000" y="212.9" font-size="14" font-weight="700" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13.02">FileWatcher(folder).watch()</tspan></text><text x="1000" y="235.1" font-size="11" font-weight="400" fill="#5C5C5C" text-anchor="middle"><tspan>o seu próprio </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="10.23">WatchService</tspan><tspan> do JDK · uma pasta, não as</tspan></text><text x="1000" y="249.4" font-size="11" font-weight="400" fill="#5C5C5C" text-anchor="middle"><tspan>subpastas · verifica o </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="10.23">close()</tspan><tspan> de 200 em 200 ms</tspan></text>
