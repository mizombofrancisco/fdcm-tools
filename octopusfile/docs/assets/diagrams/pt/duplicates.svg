<g filter="url(#shadow)"><rect x="36" y="440" width="280" height="150" rx="3" fill="#FFE88A"/></g><text x="50" y="464" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.09">minSize(bytes)</tspan><tspan> — 1 por omissão,</tspan></text><text x="50" y="482.2" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start">por isso ficheiros vazios nunca são</text><text x="50" y="500.4" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start"><tspan>duplicados. </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.09">skipHidden(true)</tspan><tspan> —</tspan></text><text x="50" y="518.6" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start"><tspan>nomes com ponto, </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.09">$RECYCLE.BIN</tspan><tspan>,</tspan></text><text x="50" y="536.8" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.09">System Volume Information</tspan><tspan>.</tspan></text>
<g filter="url(#shadow)"><rect x="336" y="440" width="280" height="150" rx="3" fill="#C7E4FF"/></g><text x="350" y="464" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start">Mensagens de progresso: &quot;Scanning:</text><text x="350" y="482.2" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start">N files&quot; de 5 000 em 5 000</text><text x="350" y="500.4" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start">ficheiros, depois os candidatos por</text><text x="350" y="518.6" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start">tamanho e por fim os grupos a</text><text x="350" y="536.8" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start">confirmar.</text>
<g filter="url(#shadow)"><rect x="636" y="440" width="280" height="150" rx="3" fill="#FFCCE5"/></g><text x="650" y="464" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start"><tspan>Ativar </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.09">cancel</tspan><tspan> pára o trabalho; os</tspan></text><text x="650" y="482.2" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start">grupos já confirmados são</text><text x="650" y="500.4" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start">devolvidos. Os ficheiros ilegíveis</text><text x="650" y="518.6" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start">são ignorados.</text>
<g filter="url(#shadow)"><rect x="936" y="440" width="268" height="150" rx="3" fill="#CDF3C9"/></g><text x="950" y="464" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start">A lista vem ordenada pelo espaço</text><text x="950" y="482.2" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start">desperdiçado, do maior para o</text><text x="950" y="500.4" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start">menor.</text>
<text x="36" y="52" font-size="26" font-weight="800" fill="#1E1E1E">Encontrar duplicados em três passos</text><text x="36" y="80" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start">Cada passo só olha para o que sobreviveu ao anterior, por isso a maioria dos ficheiros nunca é lida por inteiro.</text><g transform="translate(1076,30)"><rect width="128" height="28" rx="14" fill="#FFFFFF" stroke="#E0E0E0"/><circle cx="16" cy="14" r="6" fill="#F08C00"/><text x="30" y="19" font-size="12.5" font-weight="700" fill="#1E1E1E">OctopusFile</text></g>
