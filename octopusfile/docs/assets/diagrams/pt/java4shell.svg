<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 900" width="1240" height="900" role="img" aria-label="Java4Shell (CVE-2026-114938): descodificar Base64 sem o código com falha" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title>Java4Shell (CVE-2026-114938): descodificar Base64 sem o código com falha</title>
