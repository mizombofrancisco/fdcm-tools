<g><rect x="36" y="130" width="330" height="470" rx="14" fill="#FFE88A" fill-opacity="0.38" stroke="#E0B400" stroke-width="1.5" stroke-dasharray="0"/><rect x="48" y="117" width="195" height="26" rx="8" fill="#E0B400"/><text x="62" y="134" font-size="13" font-weight="700" fill="#FFFFFF">Base64 que vem de fora</text></g>
<g><rect x="410" y="130" width="794" height="210" rx="14" fill="#FFC9C2" fill-opacity="0.38" stroke="#E5484D" stroke-width="1.5" stroke-dasharray="0"/><rect x="422" y="117" width="172" height="26" rx="8" fill="#E5484D"/><text x="436" y="134" font-size="13" font-weight="700" fill="#FFFFFF">Até à 2.0.5 / 2.1.1</text></g>
