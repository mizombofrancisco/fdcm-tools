<path d="M346,502 L432,471" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
<rect x="56" y="166" width="290" height="112" rx="12" fill="#FFC9C2" stroke="#E5484D" stroke-width="2.5"/><text x="201" y="209.9" font-size="14" font-weight="700" fill="#1E1E1E" text-anchor="middle">Anúncio da Partilha local</text><text x="201" y="232.1" font-size="11" font-weight="400" fill="#5C5C5C" text-anchor="middle">UDP, de qualquer computador, antes de</text><text x="201" y="246.4" font-size="11" font-weight="400" fill="#5C5C5C" text-anchor="middle">qualquer chave</text>
<rect x="56" y="306" width="290" height="112" rx="12" fill="#FFD7AD" stroke="#F08C00" stroke-width="2.5"/><text x="201" y="357.05" font-size="14" font-weight="700" fill="#1E1E1E" text-anchor="middle">Nomes numa oferta ou sincronização</text><text x="201" y="379.25" font-size="11" font-weight="400" fill="#5C5C5C" text-anchor="middle">antes de a pessoa aceitar</text>
<rect x="56" y="446" width="290" height="112" rx="12" fill="#FFE88A" stroke="#E0B400" stroke-width="2.5"/><text x="201" y="480.8" font-size="14" font-weight="700" fill="#1E1E1E" text-anchor="middle">Cofre, palavras-passe,</text><text x="201" y="499" font-size="14" font-weight="700" fill="#1E1E1E" text-anchor="middle">instantâneos</text><text x="201" y="521.2" font-size="11" font-weight="400" fill="#5C5C5C" text-anchor="middle">ficheiros que podem vir de uma nuvem</text><text x="201" y="535.5" font-size="11" font-weight="400" fill="#5C5C5C" text-anchor="middle"><tspan>(</tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="10.23">pull</tspan><tspan>)</tspan></text>
<rect x="434" y="176" width="260" height="70" rx="12" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2.5"/><text x="564" y="214.75" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">Base64.getDecoder().decode(…)</tspan></text>
<rect x="744" y="166" width="436" height="90" rx="12" fill="#FFC9C2" stroke="#E5484D" stroke-width="2.5"/><text x="962" y="189.8" font-size="14" font-weight="700" fill="#1E1E1E" text-anchor="middle">Intrínseco de descodificação do HotSpot (AVX-512</text><text x="962" y="208" font-size="14" font-weight="700" fill="#1E1E1E" text-anchor="middle">VBMI)</text><text x="962" y="230.2" font-size="11" font-weight="400" fill="#5C5C5C" text-anchor="middle">JDK 17.0.6–17.0.21.0.3: escrita fora dos limites com uma entrada</text><text x="962" y="244.5" font-size="11" font-weight="400" fill="#5C5C5C" text-anchor="middle">preparada</text>
<text x="434" y="300" font-size="13" font-weight="600" fill="#5C5C5C" text-anchor="start">Só uma JVM corrigida (17.0.21.1 ou mais recente) protegia a biblioteca.</text>
<rect x="434" y="436" width="260" height="70" rx="12" fill="#CDF3C9" stroke="#30A46C" stroke-width="2.5"/><text x="564" y="474.9" font-size="13" font-weight="700" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.09">SafeBase64.decode(…)</tspan></text>
<rect x="744" y="426" width="436" height="90" rx="12" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2.5"/><text x="962" y="466.4" font-size="13" font-weight="700" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.09">Base64.getDecoder().wrap(…)</tspan></text><text x="962" y="487.3" font-size="10" font-weight="400" fill="#5C5C5C" text-anchor="middle">o descodificador por fluxo do JDK: nunca usa o intrínseco</text>
<text x="434" y="560" font-size="13" font-weight="600" fill="#5C5C5C" text-anchor="start"><tspan>Os mesmos bytes, as mesmas recusas (</tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.09">IllegalArgumentException</tspan><tspan>), os mesmos formatos no disco e na rede.</tspan></text>
<g filter="url(#shadow)"><rect x="60" y="686" width="360" height="160" rx="3" fill="#FFE88A"/></g><text x="74" y="710" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start">Atualize a JVM na mesma: a correção está no</text><text x="74" y="728.2" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start">Java (17.0.21.1, 21.0.13.1, 25.0.5.1…). O</text><text x="74" y="746.4" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.09">SafeBase64</tspan><tspan> só afasta do caminho com falha a</tspan></text><text x="74" y="764.6" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start">descodificação do próprio OctopusFile.</text>
<g filter="url(#shadow)"><rect x="444" y="686" width="360" height="160" rx="3" fill="#FFCCE5"/></g><text x="458" y="710" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start">As aplicações que trazem o seu runtime (jlink,</text><text x="458" y="728.2" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start">jpackage) têm de ser refeitas com um JDK</text><text x="458" y="746.4" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start">corrigido, como o FileExp 3.11.1.</text>
<g filter="url(#shadow)"><rect x="828" y="686" width="360" height="160" rx="3" fill="#CDF3C9"/></g><text x="842" y="710" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.09">ant selftest</tspan><tspan>: mais de 40 000 entradas</tspan></text><text x="842" y="728.2" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start">comparadas com o descodificador do JDK, e uma</text><text x="842" y="746.4" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start">verificação de que nenhum ficheiro o chama.</text>
<text x="36" y="52" font-size="26" font-weight="800" fill="#1E1E1E">Java4Shell (CVE-2026-114938): descodificar Base64 sem o código com falha</text><text x="36" y="80" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start"><tspan>Desde a 2.0.6 / 2.1.2 toda a descodificação Base64 do OctopusFile passa pelo </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13.95">SafeBase64</tspan><tspan>: o mesmo resultado, seguro mesmo numa JVM por atualizar.</tspan></text><g transform="translate(1076,30)"><rect width="128" height="28" rx="14" fill="#FFFFFF" stroke="#E0E0E0"/><circle cx="16" cy="14" r="6" fill="#F08C00"/><text x="30" y="19" font-size="12.5" font-weight="700" fill="#1E1E1E">OctopusFile</text></g>
</svg>
