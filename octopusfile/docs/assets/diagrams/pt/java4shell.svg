<g><rect x="36" y="650" width="1168" height="220" rx="14" fill="#C7E4FF" fill-opacity="0.38" stroke="#0D8BF2" stroke-width="1.5" stroke-dasharray="0"/><rect x="48" y="637" width="286" height="26" rx="8" fill="#0D8BF2"/><text x="62" y="654" font-size="13" font-weight="700" fill="#FFFFFF">O que significa para uma aplicação</text></g>
