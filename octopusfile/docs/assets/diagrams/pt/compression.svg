<rect x="586.5" y="488" width="67" height="24" rx="9" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/><text x="620" y="505" font-size="12.5" font-weight="600" fill="#1E1E1E" text-anchor="middle">repetir</text>
<g filter="url(#shadow)"><rect x="36" y="760" width="370" height="116" rx="3" fill="#FFE88A"/></g><text x="50" y="784" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="start"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">list(zip)</tspan><tspan> lê só o diretório central: nome,</tspan></text><text x="50" y="801.5" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="start">tamanho, tamanho comprimido, data.</text><text x="50" y="819" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="start"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">uncompressedSize(zip)</tspan><tspan> diz quanto espaço a</tspan></text><text x="50" y="836.5" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="start">extração precisa.</text>
<g filter="url(#shadow)"><rect x="426" y="760" width="370" height="116" rx="3" fill="#C7E4FF"/></g><text x="440" y="784" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="start"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">onProgress(bytes -&gt; …)</tspan><tspan> recebe os bytes feitos.</tspan></text><text x="440" y="801.5" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="start"><tspan>Na fachada: </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">compress</tspan><tspan> falha com </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">WRITE_ERROR</tspan><tspan>,</tspan></text><text x="440" y="819" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="start"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">extract</tspan><tspan> com </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">READ_ERROR</tspan><tspan>.</tspan></text>
<g filter="url(#shadow)"><rect x="816" y="760" width="388" height="116" rx="3" fill="#FFCCE5"/></g><text x="830" y="784" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="start">Um ficheiro com o mesmo nome já na pasta é</text><text x="830" y="801.5" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="start">substituído; as entradas escritas antes de uma</text><text x="830" y="819" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="start">rejeitada ficam.</text>
<text x="36" y="52" font-size="26" font-weight="800" fill="#1E1E1E">ZIP em streaming, seguro para extrair</text><text x="36" y="80" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13.95">ZipCompressionEngine</tspan><tspan> lê e escreve com buffers de 64 KiB: nunca um ficheiro inteiro em memória.</tspan></text><g transform="translate(1076,30)"><rect width="128" height="28" rx="14" fill="#FFFFFF" stroke="#E0E0E0"/><circle cx="16" cy="14" r="6" fill="#F08C00"/><text x="30" y="19" font-size="12.5" font-weight="700" fill="#1E1E1E">OctopusFile</text></g>
</svg>
