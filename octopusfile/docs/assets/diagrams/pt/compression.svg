<rect x="790" y="620" width="390" height="84" rx="12" fill="#FFC9C2" stroke="#E5484D" stroke-width="2.5"/><text x="985" y="657.225" font-size="13.5" font-weight="700" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.555">IOException</tspan><tspan>: zip slip — a extração para</tspan></text><text x="985" y="678.775" font-size="10.5" font-weight="400" fill="#5C5C5C" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="9.765">../../evil</tspan><tspan> nunca é escrito fora</tspan></text>
