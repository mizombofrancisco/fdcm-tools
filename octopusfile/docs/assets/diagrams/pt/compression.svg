<rect x="230" y="550" width="210" height="80" rx="12" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2.5"/><text x="335" y="585.05" font-size="14" font-weight="700" fill="#1E1E1E" text-anchor="middle">Entrada seguinte</text><text x="335" y="607.25" font-size="11" font-weight="400" fill="#5C5C5C" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="10.23">ZipInputStream</tspan><tspan>, uma a uma</tspan></text>
