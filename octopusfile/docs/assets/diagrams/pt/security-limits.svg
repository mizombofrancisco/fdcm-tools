<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 690" width="1240" height="690" role="img" aria-label="Limites: o que NÃO está protegido" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title>Limites: o que NÃO está protegido</title>
<defs><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#D4D4D4"/></pattern><filter id="shadow" x="-10%" y="-10%" width="130%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#000000" flood-opacity="0.18"/></filter></defs>
<rect width="1240" height="690" rx="18" fill="#F7F7F5"/><rect width="1240" height="690" rx="18" fill="url(#dots)"/><rect x="0.75" y="0.75" width="1238.5" height="688.5" rx="18" fill="none" stroke="#E0E0E0" stroke-width="1.5"/>
<g><rect x="36" y="130" width="376" height="250" rx="14" fill="#EBEBEB" fill-opacity="0.38" stroke="#8F8F8F" stroke-width="1.5" stroke-dasharray="0"/><rect x="48" y="117" width="157" height="26" rx="8" fill="#8F8F8F"/><text x="62" y="134" font-size="13" font-weight="700" fill="#FFFFFF">A biblioteca toda</text></g>
<g><rect x="432" y="130" width="376" height="250" rx="14" fill="#E1D3FF" fill-opacity="0.38" stroke="#8E4EC6" stroke-width="1.5" stroke-dasharray="0"/><rect x="444" y="117" width="66" height="26" rx="8" fill="#8E4EC6"/><text x="458" y="134" font-size="13" font-weight="700" fill="#FFFFFF">Cofre</text></g>
<g><rect x="828" y="130" width="376" height="250" rx="14" fill="#C7E4FF" fill-opacity="0.38" stroke="#0D8BF2" stroke-width="1.5" stroke-dasharray="0"/><rect x="840" y="117" width="142" height="26" rx="8" fill="#0D8BF2"/><text x="854" y="134" font-size="13" font-weight="700" fill="#FFFFFF">CredentialVault</text></g>
<g><rect x="36" y="410" width="376" height="250" rx="14" fill="#C2F0E6" fill-opacity="0.38" stroke="#12A594" stroke-width="1.5" stroke-dasharray="0"/><rect x="48" y="397" width="134" height="26" rx="8" fill="#12A594"/><text x="62" y="414" font-size="13" font-weight="700" fill="#FFFFFF">Partilha local</text></g>
<g><rect x="432" y="410" width="376" height="250" rx="14" fill="#FFD7AD" fill-opacity="0.38" stroke="#F08C00" stroke-width="1.5" stroke-dasharray="0"/><rect x="444" y="397" width="134" height="26" rx="8" fill="#F08C00"/><text x="458" y="414" font-size="13" font-weight="700" fill="#FFFFFF">SMB no Windows</text></g>
<g><rect x="828" y="410" width="376" height="250" rx="14" fill="#EBEBEB" fill-opacity="0.38" stroke="#8F8F8F" stroke-width="1.5" stroke-dasharray="0"/><rect x="840" y="397" width="187" height="26" rx="8" fill="#8F8F8F"/><text x="854" y="414" font-size="13" font-weight="700" fill="#FFFFFF">Permissões no Windows</text></g>

<rect x="52" y="164" width="344" height="74" rx="12" fill="#CDF3C9" stroke="#30A46C" stroke-width="2.5"/><text x="224" y="204.9" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="middle">práticas habituais no desenho, e testado</text>
<rect x="52" y="270" width="344" height="96" rx="12" fill="#FFC9C2" stroke="#E5484D" stroke-width="2.5"/><text x="224" y="305" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="middle">não auditado de forma independente: ninguém</text><text x="224" y="321.9" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="middle">fora do projeto o reviu. Não sozinho para</text><text x="224" y="338.8" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="middle">dados de elevado valor.</text>
<g><rect x="62" y="152" width="72" height="24" rx="12" fill="#CDF3C9" stroke="#30A46C" stroke-width="1.5"/><text x="98.2" y="168" font-size="12" font-weight="700" text-anchor="middle" fill="#1E1E1E">testado</text></g>
<g><rect x="62" y="258" width="108" height="24" rx="12" fill="#FFC9C2" stroke="#E5484D" stroke-width="1.5"/><text x="116.2" y="274" font-size="12" font-weight="700" text-anchor="middle" fill="#1E1E1E">não auditado</text></g>
<rect x="448" y="164" width="344" height="74" rx="12" fill="#CDF3C9" stroke="#30A46C" stroke-width="2.5"/><text x="620" y="196.45" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="middle">sem a palavra-passe não se leem nem alteram</text><text x="620" y="213.35" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="middle">conteúdos; nomes, tamanhos e datas cifrados</text>
<rect x="448" y="270" width="344" height="96" rx="12" fill="#FFC9C2" stroke="#E5484D" stroke-width="2.5"/><text x="620" y="296.55" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="middle">quem escreve na pasta pode repor um</text><text x="620" y="313.45" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.09">index.bin</tspan><tspan> antigo ou apagar ficheiros; o</tspan></text><text x="620" y="330.35" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="middle">número e os tamanhos aproximados veem-se.</text><text x="620" y="347.25" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="middle">Mínimo 6 caracteres: peça mais.</text>
<g><rect x="458" y="152" width="86" height="24" rx="12" fill="#CDF3C9" stroke="#30A46C" stroke-width="1.5"/><text x="501.4" y="168" font-size="12" font-weight="700" text-anchor="middle" fill="#1E1E1E">protegido</text></g>
<g><rect x="458" y="258" width="115" height="24" rx="12" fill="#FFC9C2" stroke="#E5484D" stroke-width="1.5"/><text x="515.8" y="274" font-size="12" font-weight="700" text-anchor="middle" fill="#1E1E1E">não protegido</text></g>
<rect x="844" y="164" width="344" height="74" rx="12" fill="#CDF3C9" stroke="#30A46C" stroke-width="2.5"/><text x="1016" y="204.9" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="middle">leitura casual de um ficheiro de definições</text>
<rect x="844" y="270" width="344" height="96" rx="12" fill="#FFC9C2" stroke="#E5484D" stroke-width="2.5"/><text x="1016" y="305" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="middle">malware executado como o mesmo utilizador: a</text><text x="1016" y="321.9" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="middle">chave fica ao lado dos dados, só com as</text><text x="1016" y="338.8" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="middle">permissões da conta</text>
<g><rect x="854" y="152" width="86" height="24" rx="12" fill="#CDF3C9" stroke="#30A46C" stroke-width="1.5"/><text x="897.4" y="168" font-size="12" font-weight="700" text-anchor="middle" fill="#1E1E1E">protegido</text></g>
<g><rect x="854" y="258" width="115" height="24" rx="12" fill="#FFC9C2" stroke="#E5484D" stroke-width="1.5"/><text x="911.8" y="274" font-size="12" font-weight="700" text-anchor="middle" fill="#1E1E1E">não protegido</text></g>
<rect x="52" y="444" width="344" height="74" rx="12" fill="#CDF3C9" stroke="#30A46C" stroke-width="2.5"/><text x="224" y="476.45" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="middle">um computador no meio — se as pessoas</text><text x="224" y="493.35" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="middle">compararem o código de 6 dígitos</text>
<rect x="52" y="550" width="344" height="96" rx="12" fill="#FFC9C2" stroke="#E5484D" stroke-width="2.5"/><text x="224" y="585" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="middle">anúncios falsificados: qualquer um anuncia</text><text x="224" y="601.9" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="middle">qualquer nome; um código não comparado não</text><text x="224" y="618.8" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="middle">protege nada</text>
<g><rect x="62" y="432" width="86" height="24" rx="12" fill="#CDF3C9" stroke="#30A46C" stroke-width="1.5"/><text x="105.4" y="448" font-size="12" font-weight="700" text-anchor="middle" fill="#1E1E1E">protegido</text></g>
<g><rect x="62" y="538" width="115" height="24" rx="12" fill="#FFC9C2" stroke="#E5484D" stroke-width="1.5"/><text x="119.8" y="554" font-size="12" font-weight="700" text-anchor="middle" fill="#1E1E1E">não protegido</text></g>
<rect x="448" y="444" width="344" height="74" rx="12" fill="#CDF3C9" stroke="#30A46C" stroke-width="2.5"/><text x="620" y="476.45" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="middle"><tspan>corrigido na 2.0.1: </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.09">WNetAddConnection2</tspan><tspan> a</tspan></text><text x="620" y="493.35" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="middle">partir de um script na entrada padrão</text>
<rect x="448" y="550" width="344" height="96" rx="12" fill="#FFC9C2" stroke="#E5484D" stroke-width="2.5"/><text x="620" y="585" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="middle"><tspan>antes da 2.0.1: o </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.09">net use</tspan><tspan> recebia a</tspan></text><text x="620" y="601.9" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="middle">palavra-passe como argumento, visível na</text><text x="620" y="618.8" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="middle">lista de processos</text>
<g><rect x="458" y="432" width="115" height="24" rx="12" fill="#CDF3C9" stroke="#30A46C" stroke-width="1.5"/><text x="515.8" y="448" font-size="12" font-weight="700" text-anchor="middle" fill="#1E1E1E">desde a 2.0.1</text></g>
<g><rect x="458" y="538" width="122" height="24" rx="12" fill="#FFC9C2" stroke="#E5484D" stroke-width="1.5"/><text x="519.4" y="554" font-size="12" font-weight="700" text-anchor="middle" fill="#1E1E1E">antes da 2.0.1</text></g>
<rect x="844" y="444" width="344" height="74" rx="12" fill="#CDF3C9" stroke="#30A46C" stroke-width="2.5"/><text x="1016" y="484.9" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="middle">a pasta do utilizador, quando é privada</text>
<rect x="844" y="550" width="344" height="96" rx="12" fill="#FFC9C2" stroke="#E5484D" stroke-width="2.5"/><text x="1016" y="585" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="middle">o OctopusFile não altera ACLs: parte do</text><text x="1016" y="601.9" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="middle">princípio de que a pasta do utilizador é</text><text x="1016" y="618.8" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="middle">privada</text>
<g><rect x="854" y="432" width="86" height="24" rx="12" fill="#CDF3C9" stroke="#30A46C" stroke-width="1.5"/><text x="897.4" y="448" font-size="12" font-weight="700" text-anchor="middle" fill="#1E1E1E">protegido</text></g>
<g><rect x="854" y="538" width="115" height="24" rx="12" fill="#FFC9C2" stroke="#E5484D" stroke-width="1.5"/><text x="911.8" y="554" font-size="12" font-weight="700" text-anchor="middle" fill="#1E1E1E">não protegido</text></g>
<text x="36" y="52" font-size="26" font-weight="800" fill="#1E1E1E">Limites: o que NÃO está protegido</text><text x="36" y="80" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start">Leia isto antes de confiar no OctopusFile para dados sensíveis.</text><g transform="translate(1076,30)"><rect width="128" height="28" rx="14" fill="#FFFFFF" stroke="#E0E0E0"/><circle cx="16" cy="14" r="6" fill="#F08C00"/><text x="30" y="19" font-size="12.5" font-weight="700" fill="#1E1E1E">OctopusFile</text></g>
</svg>
