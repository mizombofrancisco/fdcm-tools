<rect x="440" y="566" width="340" height="96" rx="12" fill="#CDF3C9" stroke="#30A46C" stroke-width="2.5"/><text x="610" y="608" font-size="17" font-weight="700" fill="#1E1E1E" text-anchor="middle">2.1, 2.2…</text><text x="610" y="634.1" font-size="14" font-weight="400" fill="#5C5C5C" text-anchor="middle">só acrescentar: nunca remover nem mudar</text>
<rect x="820" y="566" width="340" height="96" rx="12" fill="#C7E4FF" stroke="#0D8BF2" stroke-width="2.5"/><text x="990" y="598.9" font-size="17" font-weight="700" fill="#1E1E1E" text-anchor="middle">3.0</text><text x="990" y="625" font-size="14" font-weight="400" fill="#5C5C5C" text-anchor="middle">só então: remover o que a 2.x marcou como</text><text x="990" y="643.2" font-size="14" font-weight="400" fill="#5C5C5C" text-anchor="middle">obsoleto</text>
<text x="36" y="506" font-size="13.5" font-weight="600" fill="#5C5C5C" text-anchor="start">Cada elemento público tem Javadoc.</text>
<text x="36" y="52" font-size="26" font-weight="800" fill="#1E1E1E">API congelada: um teste é a porta</text><text x="36" y="80" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start">Desde a 2.0.0-rc.1 cada elemento público está listado num ficheiro; os testes falham se o código for diferente.</text><g transform="translate(1076,30)"><rect width="128" height="28" rx="14" fill="#FFFFFF" stroke="#E0E0E0"/><circle cx="16" cy="14" r="6" fill="#F08C00"/><text x="30" y="19" font-size="12.5" font-weight="700" fill="#1E1E1E">OctopusFile</text></g>
