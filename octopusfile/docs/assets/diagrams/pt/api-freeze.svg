<g filter="url(#shadow)"><rect x="880" y="362" width="324" height="96" rx="3" fill="#FFE88A"/></g><text x="894" y="386" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="start"><tspan>Só para um acréscimo intencional: </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.555">ant</tspan></text><text x="894" y="404.9" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="start"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.555">selftest -Dapi.update=true</tspan><tspan> reescreve a</tspan></text><text x="894" y="423.8" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="start">lista; reveja as diferenças.</text>
