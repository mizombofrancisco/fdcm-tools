<rect x="1040" y="650" width="150" height="120" rx="12" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2.5"/><text x="1115" y="714.5" font-size="15" font-weight="700" fill="#1E1E1E" text-anchor="middle"></text>
<text x="1115" y="676" font-size="17" font-weight="800" fill="#1E1E1E" text-anchor="middle">sem rede</text>
<text x="1115" y="700" font-size="12.5" font-weight="700" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">IOException</tspan></text>
<text x="1115" y="725" font-size="11.5" font-weight="400" fill="#5C5C5C" text-anchor="middle">&quot;Cannot reach &lt;host&gt;&quot;</text>
<text x="1204" y="608" font-size="12.5" font-weight="600" fill="#E5484D" text-anchor="end">a vermelho: as mesmas exceções dos ficheiros locais (desde a 2.0)</text>
<g filter="url(#shadow)"><rect x="36" y="820" width="560" height="76" rx="3" fill="#FFE88A"/></g><text x="50" y="844" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="start">Com um utilizador, cada pedido leva-o com a palavra-passe (Basic). O endereço</text><text x="50" y="861.5" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="start"><tspan>tem de ser </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">https://</tspan><tspan> ou </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">http://</tspan><tspan>. Esperas: 12 s para ligar, 60 s por</tspan></text><text x="50" y="879" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="start">pedido, 6 h por envio ou transferência.</text>
<g filter="url(#shadow)"><rect x="620" y="820" width="584" height="76" rx="3" fill="#C7E4FF"/></g><text x="634" y="844" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="start"><tspan>A resposta XML é lida com os DOCTYPEs recusados (sem XXE); nomes como </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">.</tspan><tspan>, </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">..</tspan></text><text x="634" y="861.5" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="start"><tspan>ou com </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">\</tspan><tspan> são descartados e nunca chegam ao disco local.</tspan></text>
<text x="36" y="52" font-size="26" font-weight="800" fill="#1E1E1E">WebDAV: cada método é um pedido HTTP</text><text x="36" y="80" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13.95">WebDavStorage</tspan><tspan> fala com o servidor com </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13.95">java.net.http</tspan><tspan>; as respostas tornam-se as mesmas exceções dos ficheiros locais.</tspan></text><g transform="translate(1076,30)"><rect width="128" height="28" rx="14" fill="#FFFFFF" stroke="#E0E0E0"/><circle cx="16" cy="14" r="6" fill="#F08C00"/><text x="30" y="19" font-size="12.5" font-weight="700" fill="#1E1E1E">OctopusFile</text></g>
</svg>
