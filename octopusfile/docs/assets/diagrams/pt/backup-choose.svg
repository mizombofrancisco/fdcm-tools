<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 620" width="1240" height="620" role="img" aria-label="Três formas de guardar uma cópia — qual escolher?" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title>Três formas de guardar uma cópia — qual escolher?</title>
<defs><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#D4D4D4"/></pattern><filter id="shadow" x="-10%" y="-10%" width="130%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#000000" flood-opacity="0.18"/></filter><marker id="arrow-1E1E1E" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1.5,1.5 L10,6 L1.5,10.5" fill="none" stroke="#1E1E1E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="1240" height="620" rx="18" fill="#F7F7F5"/><rect width="1240" height="620" rx="18" fill="url(#dots)"/><rect x="0.75" y="0.75" width="1238.5" height="618.5" rx="18" fill="none" stroke="#E0E0E0" stroke-width="1.5"/>
<g><rect x="290" y="130" width="292" height="440" rx="14" fill="#FFD7AD" fill-opacity="0.38" stroke="#F08C00" stroke-width="1.5" stroke-dasharray="0"/><rect x="302" y="117" width="126" height="26" rx="8" fill="#F08C00"/><text x="316" y="134" font-size="13" font-weight="700" fill="#FFFFFF">BackupService</text></g>
<g><rect x="602" y="130" width="292" height="440" rx="14" fill="#E1D3FF" fill-opacity="0.38" stroke="#8E4EC6" stroke-width="1.5" stroke-dasharray="0"/><rect x="614" y="117" width="164" height="26" rx="8" fill="#8E4EC6"/><text x="628" y="134" font-size="13" font-weight="700" fill="#FFFFFF">SnapshotRepository</text></g>
<g><rect x="914" y="130" width="292" height="440" rx="14" fill="#C2F0E6" fill-opacity="0.38" stroke="#12A594" stroke-width="1.5" stroke-dasharray="0"/><rect x="926" y="117" width="187" height="26" rx="8" fill="#12A594"/><text x="940" y="134" font-size="13" font-weight="700" fill="#FFFFFF">DirectorySynchronizer</text></g>
<path d="M226,290 L284,290" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
<polygon points="131,230 226,290 131,350 36,290" fill="#FFE88A" stroke="#E0B400" stroke-width="2.5" stroke-linejoin="round"/><text x="131" y="285.275" font-size="13.5" font-weight="700" fill="#1E1E1E" text-anchor="middle">Do que vai</text><text x="131" y="302.825" font-size="13.5" font-weight="700" fill="#1E1E1E" text-anchor="middle">precisar depois?</text>
<text x="310" y="172" font-size="16" font-weight="800" fill="#1E1E1E" text-anchor="start">Um ficheiro por cópia</text>
<rect x="306" y="190" width="260" height="50" rx="12" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2.5"/><text x="436" y="210.625" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="middle">um ZIP com data:</text><text x="436" y="226.875" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">Documents-yyyyMMdd-HHmmssSSS.zip</tspan></text>
<rect x="306" y="252" width="260" height="50" rx="12" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2.5"/><text x="436" y="280.75" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="middle">cada vez guarda tudo outra vez</text>
<rect x="306" y="314" width="260" height="50" rx="12" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2.5"/><text x="436" y="342.75" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="middle">abre com qualquer programa de ZIP</text>
<rect x="306" y="376" width="260" height="50" rx="12" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2.5"/><text x="436" y="404.75" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">restoreTo</tspan><tspan> substitui nomes iguais</tspan></text>
<g filter="url(#shadow)"><rect x="306" y="456" width="260" height="78" rx="3" fill="#FFE88A"/></g><text x="320" y="480" font-size="14" font-weight="400" fill="#1E1E1E" text-anchor="start">&quot;um ficheiro que posso enviar</text><text x="320" y="499.6" font-size="14" font-weight="400" fill="#1E1E1E" text-anchor="start">ou guardar&quot;</text>
<text x="622" y="172" font-size="16" font-weight="800" fill="#1E1E1E" text-anchor="start">Um histórico de versões</text>
<rect x="618" y="190" width="260" height="50" rx="12" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2.5"/><text x="748" y="218.75" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="middle">só o conteúdo novo é guardado</text>
<rect x="618" y="252" width="260" height="50" rx="12" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2.5"/><text x="748" y="280.75" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="middle">ficheiros iguais guardados uma vez</text>
<rect x="618" y="314" width="260" height="50" rx="12" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2.5"/><text x="748" y="342.75" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="middle">palavra-passe AES-256-GCM opcional</text>
<rect x="618" y="376" width="260" height="50" rx="12" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2.5"/><text x="748" y="396.625" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">push</tspan><tspan> / </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">pull</tspan><tspan> para uma nuvem</tspan></text><text x="748" y="412.875" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="middle">WebDAV</text>
<g filter="url(#shadow)"><rect x="618" y="456" width="260" height="78" rx="3" fill="#FFE88A"/></g><text x="632" y="480" font-size="14" font-weight="400" fill="#1E1E1E" text-anchor="start">&quot;voltar à terça-feira passada&quot;</text>
<text x="934" y="172" font-size="16" font-weight="800" fill="#1E1E1E" text-anchor="start">A mesma pasta noutro sítio</text>
<rect x="930" y="190" width="260" height="50" rx="12" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2.5"/><text x="1060" y="218.75" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="middle">ficheiros normais, prontos a abrir</text>
<rect x="930" y="252" width="260" height="50" rx="12" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2.5"/><text x="1060" y="280.75" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="middle">copia só o que é novo ou mudou</text>
<rect x="930" y="314" width="260" height="50" rx="12" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2.5"/><text x="1060" y="342.75" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">mirror = true</tspan><tspan> também apaga</tspan></text>
<rect x="930" y="376" width="260" height="50" rx="12" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2.5"/><text x="1060" y="404.75" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="middle">sem histórico: só o último estado</text>
<g filter="url(#shadow)"><rect x="930" y="456" width="260" height="78" rx="3" fill="#FFE88A"/></g><text x="944" y="480" font-size="14" font-weight="400" fill="#1E1E1E" text-anchor="start">&quot;a minha pasta, também na pen&quot;</text>
<text x="36" y="400" font-size="12.5" font-weight="400" fill="#5C5C5C" text-anchor="start">Cada coluna é uma classe; a fachada</text>
<text x="36" y="418" font-size="12.5" font-weight="400" fill="#5C5C5C" text-anchor="start"><tspan>oferece </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">backup(…)</tspan><tspan> e </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">sync(…)</tspan><tspan>.</tspan></text>
<text x="36" y="52" font-size="26" font-weight="800" fill="#1E1E1E">Três formas de guardar uma cópia — qual escolher?</text><text x="36" y="80" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start">O mesmo objetivo, resultados diferentes no disco: escolha pelo que vai precisar de recuperar.</text><g transform="translate(1076,30)"><rect width="128" height="28" rx="14" fill="#FFFFFF" stroke="#E0E0E0"/><circle cx="16" cy="14" r="6" fill="#F08C00"/><text x="30" y="19" font-size="12.5" font-weight="700" fill="#1E1E1E">OctopusFile</text></g>
</svg>
