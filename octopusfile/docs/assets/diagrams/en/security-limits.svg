<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 690" width="1240" height="690" role="img" aria-label="Limits: what is NOT protected" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title>Limits: what is NOT protected</title>
<defs><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#D4D4D4"/></pattern><filter id="shadow" x="-10%" y="-10%" width="130%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#000000" flood-opacity="0.18"/></filter></defs>
<rect width="1240" height="690" rx="18" fill="#F7F7F5"/><rect width="1240" height="690" rx="18" fill="url(#dots)"/><rect x="0.75" y="0.75" width="1238.5" height="688.5" rx="18" fill="none" stroke="#E0E0E0" stroke-width="1.5"/>
<g><rect x="36" y="130" width="376" height="250" rx="14" fill="#EBEBEB" fill-opacity="0.38" stroke="#8F8F8F" stroke-width="1.5" stroke-dasharray="0"/><rect x="48" y="117" width="157" height="26" rx="8" fill="#8F8F8F"/><text x="62" y="134" font-size="13" font-weight="700" fill="#FFFFFF">The whole library</text></g>
<g><rect x="432" y="130" width="376" height="250" rx="14" fill="#E1D3FF" fill-opacity="0.38" stroke="#8E4EC6" stroke-width="1.5" stroke-dasharray="0"/><rect x="444" y="117" width="66" height="26" rx="8" fill="#8E4EC6"/><text x="458" y="134" font-size="13" font-weight="700" fill="#FFFFFF">Vault</text></g>
<g><rect x="828" y="130" width="376" height="250" rx="14" fill="#C7E4FF" fill-opacity="0.38" stroke="#0D8BF2" stroke-width="1.5" stroke-dasharray="0"/><rect x="840" y="117" width="142" height="26" rx="8" fill="#0D8BF2"/><text x="854" y="134" font-size="13" font-weight="700" fill="#FFFFFF">CredentialVault</text></g>
<g><rect x="36" y="410" width="376" height="250" rx="14" fill="#C2F0E6" fill-opacity="0.38" stroke="#12A594" stroke-width="1.5" stroke-dasharray="0"/><rect x="48" y="397" width="134" height="26" rx="8" fill="#12A594"/><text x="62" y="414" font-size="13" font-weight="700" fill="#FFFFFF">Sharing nearby</text></g>
<g><rect x="432" y="410" width="376" height="250" rx="14" fill="#FFD7AD" fill-opacity="0.38" stroke="#F08C00" stroke-width="1.5" stroke-dasharray="0"/><rect x="444" y="397" width="134" height="26" rx="8" fill="#F08C00"/><text x="458" y="414" font-size="13" font-weight="700" fill="#FFFFFF">SMB on Windows</text></g>
<g><rect x="828" y="410" width="376" height="250" rx="14" fill="#EBEBEB" fill-opacity="0.38" stroke="#8F8F8F" stroke-width="1.5" stroke-dasharray="0"/><rect x="840" y="397" width="210" height="26" rx="8" fill="#8F8F8F"/><text x="854" y="414" font-size="13" font-weight="700" fill="#FFFFFF">Windows file permissions</text></g>

<rect x="52" y="164" width="344" height="74" rx="12" fill="#CDF3C9" stroke="#30A46C" stroke-width="2.5"/><text x="224" y="204.9" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="middle">common practice in the design, and tested</text>
<rect x="52" y="270" width="344" height="96" rx="12" fill="#FFC9C2" stroke="#E5484D" stroke-width="2.5"/><text x="224" y="305" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="middle">not independently audited: nobody outside</text><text x="224" y="321.9" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="middle">the project reviewed it. Not alone for</text><text x="224" y="338.8" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="middle">high-value data.</text>
<g><rect x="62" y="152" width="65" height="24" rx="12" fill="#CDF3C9" stroke="#30A46C" stroke-width="1.5"/><text x="94.6" y="168" font-size="12" font-weight="700" text-anchor="middle" fill="#1E1E1E">tested</text></g>
<g><rect x="62" y="258" width="101" height="24" rx="12" fill="#FFC9C2" stroke="#E5484D" stroke-width="1.5"/><text x="112.6" y="274" font-size="12" font-weight="700" text-anchor="middle" fill="#1E1E1E">not audited</text></g>
<rect x="448" y="164" width="344" height="74" rx="12" fill="#CDF3C9" stroke="#30A46C" stroke-width="2.5"/><text x="620" y="196.45" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="middle">contents cannot be read or changed without</text><text x="620" y="213.35" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="middle">the password; names, sizes, dates encrypted</text>
<rect x="448" y="270" width="344" height="96" rx="12" fill="#FFC9C2" stroke="#E5484D" stroke-width="2.5"/><text x="620" y="296.55" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="middle">whoever can write to the folder can put back</text><text x="620" y="313.45" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="middle"><tspan>an older </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.09">index.bin</tspan><tspan> or delete files; the</tspan></text><text x="620" y="330.35" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="middle">number and approximate sizes show. Minimum 6</text><text x="620" y="347.25" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="middle">characters: ask for more.</text>
<g><rect x="458" y="152" width="86" height="24" rx="12" fill="#CDF3C9" stroke="#30A46C" stroke-width="1.5"/><text x="501.4" y="168" font-size="12" font-weight="700" text-anchor="middle" fill="#1E1E1E">protected</text></g>
<g><rect x="458" y="258" width="115" height="24" rx="12" fill="#FFC9C2" stroke="#E5484D" stroke-width="1.5"/><text x="515.8" y="274" font-size="12" font-weight="700" text-anchor="middle" fill="#1E1E1E">not protected</text></g>
<rect x="844" y="164" width="344" height="74" rx="12" fill="#CDF3C9" stroke="#30A46C" stroke-width="2.5"/><text x="1016" y="204.9" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="middle">casual reading of a settings file</text>
<rect x="844" y="270" width="344" height="96" rx="12" fill="#FFC9C2" stroke="#E5484D" stroke-width="2.5"/><text x="1016" y="305" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="middle">malware running as the same user: the key</text><text x="1016" y="321.9" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="middle">sits next to the data, protected only by the</text><text x="1016" y="338.8" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="middle">account</text>
<g><rect x="854" y="152" width="86" height="24" rx="12" fill="#CDF3C9" stroke="#30A46C" stroke-width="1.5"/><text x="897.4" y="168" font-size="12" font-weight="700" text-anchor="middle" fill="#1E1E1E">protected</text></g>
<g><rect x="854" y="258" width="115" height="24" rx="12" fill="#FFC9C2" stroke="#E5484D" stroke-width="1.5"/><text x="911.8" y="274" font-size="12" font-weight="700" text-anchor="middle" fill="#1E1E1E">not protected</text></g>
<rect x="52" y="444" width="344" height="74" rx="12" fill="#CDF3C9" stroke="#30A46C" stroke-width="2.5"/><text x="224" y="476.45" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="middle">a computer in the middle — if the people</text><text x="224" y="493.35" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="middle">compare the 6-digit code</text>
<rect x="52" y="550" width="344" height="96" rx="12" fill="#FFC9C2" stroke="#E5484D" stroke-width="2.5"/><text x="224" y="593.45" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="middle">spoofed announcements: anyone can announce</text><text x="224" y="610.35" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="middle">any name; an unchecked code protects nothing</text>
<g><rect x="62" y="432" width="86" height="24" rx="12" fill="#CDF3C9" stroke="#30A46C" stroke-width="1.5"/><text x="105.4" y="448" font-size="12" font-weight="700" text-anchor="middle" fill="#1E1E1E">protected</text></g>
<g><rect x="62" y="538" width="115" height="24" rx="12" fill="#FFC9C2" stroke="#E5484D" stroke-width="1.5"/><text x="119.8" y="554" font-size="12" font-weight="700" text-anchor="middle" fill="#1E1E1E">not protected</text></g>
<rect x="448" y="444" width="344" height="74" rx="12" fill="#CDF3C9" stroke="#30A46C" stroke-width="2.5"/><text x="620" y="476.45" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="middle"><tspan>fixed in 2.0.1: </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.09">WNetAddConnection2</tspan><tspan> from a</tspan></text><text x="620" y="493.35" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="middle">script on standard input</text>
<rect x="448" y="550" width="344" height="96" rx="12" fill="#FFC9C2" stroke="#E5484D" stroke-width="2.5"/><text x="620" y="593.45" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="middle"><tspan>before 2.0.1: </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.09">net use</tspan><tspan> got the password as</tspan></text><text x="620" y="610.35" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="middle">an argument, visible in the process list</text>
<g><rect x="458" y="432" width="101" height="24" rx="12" fill="#CDF3C9" stroke="#30A46C" stroke-width="1.5"/><text x="508.6" y="448" font-size="12" font-weight="700" text-anchor="middle" fill="#1E1E1E">since 2.0.1</text></g>
<g><rect x="458" y="538" width="108" height="24" rx="12" fill="#FFC9C2" stroke="#E5484D" stroke-width="1.5"/><text x="512.2" y="554" font-size="12" font-weight="700" text-anchor="middle" fill="#1E1E1E">before 2.0.1</text></g>
<rect x="844" y="444" width="344" height="74" rx="12" fill="#CDF3C9" stroke="#30A46C" stroke-width="2.5"/><text x="1016" y="484.9" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="middle">the user folder, when it is private</text>
<rect x="844" y="550" width="344" height="96" rx="12" fill="#FFC9C2" stroke="#E5484D" stroke-width="2.5"/><text x="1016" y="593.45" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="middle">OctopusFile does not change ACLs: it relies</text><text x="1016" y="610.35" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="middle">on the user folder being private</text>
<g><rect x="854" y="432" width="86" height="24" rx="12" fill="#CDF3C9" stroke="#30A46C" stroke-width="1.5"/><text x="897.4" y="448" font-size="12" font-weight="700" text-anchor="middle" fill="#1E1E1E">protected</text></g>
<g><rect x="854" y="538" width="115" height="24" rx="12" fill="#FFC9C2" stroke="#E5484D" stroke-width="1.5"/><text x="911.8" y="554" font-size="12" font-weight="700" text-anchor="middle" fill="#1E1E1E">not protected</text></g>
<text x="36" y="52" font-size="26" font-weight="800" fill="#1E1E1E">Limits: what is NOT protected</text><text x="36" y="80" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start">Read this before relying on OctopusFile for sensitive data.</text><g transform="translate(1076,30)"><rect width="128" height="28" rx="14" fill="#FFFFFF" stroke="#E0E0E0"/><circle cx="16" cy="14" r="6" fill="#F08C00"/><text x="30" y="19" font-size="12.5" font-weight="700" fill="#1E1E1E">OctopusFile</text></g>
</svg>
