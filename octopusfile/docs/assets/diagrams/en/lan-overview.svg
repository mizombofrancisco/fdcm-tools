<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 940" width="1240" height="940" role="img" aria-label="Sharing nearby: two computers on the same network" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title>Sharing nearby: two computers on the same network</title>
<defs><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#D4D4D4"/></pattern><filter id="shadow" x="-10%" y="-10%" width="130%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#000000" flood-opacity="0.18"/></filter><marker id="arrow-1E1E1E" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1.5,1.5 L10,6 L1.5,10.5" fill="none" stroke="#1E1E1E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="1240" height="940" rx="18" fill="#F7F7F5"/><rect width="1240" height="940" rx="18" fill="url(#dots)"/><rect x="0.75" y="0.75" width="1238.5" height="938.5" rx="18" fill="none" stroke="#E0E0E0" stroke-width="1.5"/>
<g><rect x="36" y="130" width="370" height="580" rx="14" fill="#C7E4FF" fill-opacity="0.38" stroke="#0D8BF2" stroke-width="1.5" stroke-dasharray="0"/><rect x="48" y="117" width="157" height="26" rx="8" fill="#0D8BF2"/><text x="62" y="134" font-size="13" font-weight="700" fill="#FFFFFF">Office PC — sends</text></g>
<g><rect x="834" y="130" width="370" height="580" rx="14" fill="#CDF3C9" fill-opacity="0.38" stroke="#30A46C" stroke-width="1.5" stroke-dasharray="0"/><rect x="846" y="117" width="202" height="26" rx="8" fill="#30A46C"/><text x="860" y="134" font-size="13" font-weight="700" fill="#FFFFFF">Ana&#x27;s laptop — receives</text></g>
<g><rect x="834" y="760" width="370" height="160" rx="14" fill="#FFE88A" fill-opacity="0.38" stroke="#E0B400" stroke-width="1.5" stroke-dasharray="0"/><rect x="846" y="747" width="119" height="26" rx="8" fill="#E0B400"/><text x="860" y="764" font-size="13" font-weight="700" fill="#FFFFFF">inbox folder</text></g>
<path d="M1019,548 L1019,564" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
<path d="M830,322 L410,322" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#arrow-1E1E1E)"/>
<path d="M408,411 L832,411" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
<path d="M408,506 L832,506" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
<path d="M830,580 L410,580" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
<path d="M408,642 L832,642" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
<path d="M830,690 L410,690" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
<path d="M934,618 L934,734 L1150,734 L1150,778" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#arrow-1E1E1E)"/>
<rect x="56" y="160" width="330" height="58" rx="12" fill="#2B2B2B" stroke="#1E1E1E" stroke-width="2.5"/><text x="221" y="192.75" font-size="12.5" font-weight="400" fill="#FFFFFF" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">new LanShare(&quot;Office PC&quot;, null, null)</tspan></text>
<text x="56" y="244" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start">No handler: only listens on UDP 47821;</text>
<text x="56" y="264" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start">it does not announce itself.</text>
<rect x="56" y="290" width="330" height="64" rx="12" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2.5"/><text x="221" y="317.225" font-size="13.5" font-weight="700" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.555">peers()</tspan></text><text x="221" y="338.775" font-size="10.5" font-weight="400" fill="#5C5C5C" text-anchor="middle">computers heard in the last 12 s, by name</text>
<rect x="56" y="376" width="330" height="70" rx="12" fill="#C7E4FF" stroke="#0D8BF2" stroke-width="2.5"/><text x="221" y="406.625" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">LanShare.send(peer, &quot;Office PC&quot;, files,</tspan></text><text x="221" y="422.875" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">code -&gt; …, progress, cancel)</tspan></text>
<rect x="56" y="470" width="330" height="64" rx="12" fill="#E1D3FF" stroke="#8E4EC6" stroke-width="2.5"/><text x="221" y="497.05" font-size="14" font-weight="700" fill="#1E1E1E" text-anchor="middle">shows the code</text><text x="221" y="519.25" font-size="11" font-weight="400" fill="#5C5C5C" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="10.23">CodeListener</tspan><tspan> — e.g. 481 207</tspan></text>
<rect x="56" y="600" width="330" height="84" rx="12" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2.5"/><text x="221" y="637.575" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">send</tspan><tspan> returns when the receiver says DONE</tspan></text><text x="221" y="657.825" font-size="9.5" font-weight="400" fill="#5C5C5C" text-anchor="middle"><tspan>DECLINE: </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="8.835">IOException</tspan><tspan> &quot;The other computer declined&quot;</tspan></text>
<rect x="854" y="160" width="330" height="58" rx="12" fill="#2B2B2B" stroke="#1E1E1E" stroke-width="2.5"/><text x="1019" y="184.625" font-size="12.5" font-weight="400" fill="#FFFFFF" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">new LanShare(&quot;Ana&#x27;s laptop&quot;, handler,</tspan></text><text x="1019" y="200.875" font-size="12.5" font-weight="400" fill="#FFFFFF" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">null)</tspan></text>
<text x="854" y="244" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start">TCP server on a free port; announces</text>
<text x="854" y="264" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start">itself every 3 s; up to 4 at a time.</text>
<rect x="854" y="376" width="330" height="70" rx="12" fill="#E1D3FF" stroke="#8E4EC6" stroke-width="2.5"/><text x="1019" y="406.05" font-size="14" font-weight="700" fill="#1E1E1E" text-anchor="middle">shows the same code</text><text x="1019" y="428.25" font-size="11" font-weight="400" fill="#5C5C5C" text-anchor="middle">the person compares the two screens</text>
<rect x="854" y="464" width="330" height="84" rx="12" fill="#CDF3C9" stroke="#30A46C" stroke-width="2.5"/><text x="1019" y="494.9" font-size="13" font-weight="700" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.09">handler.incoming(Incoming in)</tspan></text><text x="1019" y="515.8" font-size="10" font-weight="400" fill="#5C5C5C" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="9.3">sender()</tspan><tspan>, </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="9.3">names()</tspan><tspan>, </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="9.3">totalBytes()</tspan><tspan>, </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="9.3">code()</tspan><tspan> — on a</tspan></text><text x="1019" y="528.8" font-size="10" font-weight="400" fill="#5C5C5C" text-anchor="middle">network thread</text>
<rect x="854" y="566" width="160" height="50" rx="25" fill="#CDF3C9" stroke="#30A46C" stroke-width="2.5"/><text x="934" y="594.75" font-size="12.5" font-weight="700" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">accept(inbox, …)</tspan></text>
<rect x="1024" y="566" width="160" height="50" rx="25" fill="#FFC9C2" stroke="#E5484D" stroke-width="2.5"/><text x="1104" y="594.75" font-size="12.5" font-weight="700" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">decline()</tspan></text>
<text x="1104" y="638" font-size="12" font-weight="600" fill="#5C5C5C" text-anchor="middle">no answer in about 2 min</text><text x="1104" y="654.2" font-size="12" font-weight="600" fill="#5C5C5C" text-anchor="middle">→ declined</text>
<rect x="436" y="288" width="368" height="24" rx="9" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/><text x="620" y="305" font-size="12.5" font-weight="600" fill="#1E1E1E" text-anchor="middle">UDP broadcast: FILEEXP-LAN2 | id | TCP port | name</text>
<g><circle cx="416" cy="300" r="13" fill="#1E1E1E" stroke="#1E1E1E" stroke-width="2"/><text x="416" y="304" font-size="13" font-weight="800" text-anchor="middle" fill="#FFFFFF">1</text></g>
<rect x="499" y="377" width="242" height="24" rx="9" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/><text x="620" y="394" font-size="12.5" font-weight="600" fill="#1E1E1E" text-anchor="middle">TCP to that port: keys exchanged</text>
<g><circle cx="479" cy="389" r="13" fill="#1E1E1E" stroke="#1E1E1E" stroke-width="2"/><text x="479" y="393" font-size="13" font-weight="800" text-anchor="middle" fill="#FFFFFF">2</text></g>
<rect x="460.5" y="472" width="319" height="24" rx="9" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/><text x="620" y="489" font-size="12.5" font-weight="600" fill="#1E1E1E" text-anchor="middle">encrypted: sender&#x27;s name, file names, sizes</text>
<g><circle cx="440" cy="484" r="13" fill="#1E1E1E" stroke="#1E1E1E" stroke-width="2"/><text x="440" y="488" font-size="13" font-weight="800" text-anchor="middle" fill="#FFFFFF">3</text></g>
<rect x="551.5" y="546" width="137" height="24" rx="9" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/><text x="620" y="563" font-size="12.5" font-weight="600" fill="#1E1E1E" text-anchor="middle">ACCEPT or DECLINE</text>
<g><circle cx="531" cy="558" r="13" fill="#1E1E1E" stroke="#1E1E1E" stroke-width="2"/><text x="531" y="562" font-size="13" font-weight="800" text-anchor="middle" fill="#FFFFFF">4</text></g>
<rect x="481.5" y="608" width="277" height="24" rx="9" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/><text x="620" y="625" font-size="12.5" font-weight="600" fill="#1E1E1E" text-anchor="middle">the files, in encrypted 64 KiB frames</text>
<g><circle cx="461" cy="620" r="13" fill="#1E1E1E" stroke="#1E1E1E" stroke-width="2"/><text x="461" y="624" font-size="13" font-weight="800" text-anchor="middle" fill="#FFFFFF">5</text></g>
<rect x="597" y="656" width="46" height="24" rx="9" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/><text x="620" y="673" font-size="12.5" font-weight="600" fill="#1E1E1E" text-anchor="middle">DONE</text>
<g><circle cx="577" cy="668" r="13" fill="#1E1E1E" stroke="#1E1E1E" stroke-width="2"/><text x="577" y="672" font-size="13" font-weight="800" text-anchor="middle" fill="#FFFFFF">6</text></g>
<rect x="854" y="782" width="330" height="36" rx="12" fill="#FFE88A" stroke="#E0B400" stroke-width="2.5"/><text x="1019" y="803.75" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="middle">photo.jpg</text>
<rect x="854" y="826" width="330" height="36" rx="12" fill="#FFE88A" stroke="#E0B400" stroke-width="2.5"/><text x="1019" y="847.75" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="middle">photo (2).jpg</text>
<rect x="854" y="870" width="330" height="36" rx="12" fill="#EBEBEB" stroke="#8F8F8F" stroke-width="2.5"/><text x="1019" y="891.75" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">.1a2b3c4d.part</tspan><tspan> — hidden, while receiving</tspan></text>
<g filter="url(#shadow)"><rect x="36" y="760" width="370" height="120" rx="3" fill="#C7E4FF"/></g><text x="50" y="784" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="start"><tspan>Call </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.555">accept</tspan><tspan> from a worker thread: it blocks</tspan></text><text x="50" y="802.9" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="start">until everything arrived and returns the</text><text x="50" y="821.8" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="start">received paths. Ask the question on the UI</text><text x="50" y="840.7" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="start">thread.</text>
<g filter="url(#shadow)"><rect x="430" y="760" width="370" height="120" rx="3" fill="#FFCCE5"/></g><text x="444" y="784" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="start">Names are cleaned and never overwrite: a taken</text><text x="444" y="802.9" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="start"><tspan>name becomes </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.555">photo (2).jpg</tspan><tspan>. Start </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.555">LanShare</tspan></text><text x="444" y="821.8" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="start"><tspan>only when the user turns sharing on; </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.555">close()</tspan></text><text x="444" y="840.7" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="start">stops it.</text>
<text x="36" y="52" font-size="26" font-weight="800" fill="#1E1E1E">Sharing nearby: two computers on the same network</text><text x="36" y="80" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start">No internet and no cloud: the receiver announces itself, the sender picks it, and the person who receives says yes or no.</text><g transform="translate(1076,30)"><rect width="128" height="28" rx="14" fill="#FFFFFF" stroke="#E0E0E0"/><circle cx="16" cy="14" r="6" fill="#F08C00"/><text x="30" y="19" font-size="12.5" font-weight="700" fill="#1E1E1E">OctopusFile</text></g>
</svg>
