<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 620" width="1240" height="620" role="img" aria-label="Finding duplicates in three steps" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title>Finding duplicates in three steps</title>
<defs><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#D4D4D4"/></pattern><filter id="shadow" x="-10%" y="-10%" width="130%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#000000" flood-opacity="0.18"/></filter><marker id="arrow-1E1E1E" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1.5,1.5 L10,6 L1.5,10.5" fill="none" stroke="#1E1E1E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-30A46C" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1.5,1.5 L10,6 L1.5,10.5" fill="none" stroke="#30A46C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-E5484D" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1.5,1.5 L10,6 L1.5,10.5" fill="none" stroke="#E5484D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="1240" height="620" rx="18" fill="#F7F7F5"/><rect width="1240" height="620" rx="18" fill="url(#dots)"/><rect x="0.75" y="0.75" width="1238.5" height="618.5" rx="18" fill="none" stroke="#E0E0E0" stroke-width="1.5"/>

<path d="M335,290 L335,338" fill="none" stroke="#E5484D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#arrow-E5484D)"/>
<path d="M186,225 L228,225" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
<path d="M585,290 L585,338" fill="none" stroke="#E5484D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#arrow-E5484D)"/>
<path d="M436,225 L478,225" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
<path d="M835,290 L835,338" fill="none" stroke="#E5484D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#arrow-E5484D)"/>
<path d="M686,225 L728,225" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
<path d="M940,225 L980,225" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
<path d="M1093,300 L1093,328" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
<path d="M585,158 L585,126 L1093,126 L1093,148" fill="none" stroke="#30A46C" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#arrow-30A46C)"/>
<path d="M36,180 v90 a75,10 0 0 0 150,0 v-90" fill="#EBEBEB" stroke="#8F8F8F" stroke-width="2.5"/><ellipse cx="111" cy="180" rx="75" ry="10" fill="#EBEBEB" stroke="#8F8F8F" stroke-width="2.5"/><text x="111" y="216.9" font-size="14" font-weight="700" fill="#1E1E1E" text-anchor="middle">folder</text><text x="111" y="239.1" font-size="11" font-weight="400" fill="#5C5C5C" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="10.23">find(folder,</tspan></text><text x="111" y="253.4" font-size="11" font-weight="400" fill="#5C5C5C" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="10.23">progress, cancel)</tspan></text>
<rect x="230" y="160" width="210" height="130" rx="12" fill="#FFE88A" stroke="#E0B400" stroke-width="2.5"/><text x="335" y="211.9" font-size="15" font-weight="700" fill="#1E1E1E" text-anchor="middle">Group by size</text><text x="335" y="235.4" font-size="12" font-weight="400" fill="#5C5C5C" text-anchor="middle">one walk, sizes from the</text><text x="335" y="251" font-size="12" font-weight="400" fill="#5C5C5C" text-anchor="middle">listing</text>
<g><circle cx="236" cy="166" r="13" fill="#1E1E1E" stroke="#1E1E1E" stroke-width="2"/><text x="236" y="170" font-size="13" font-weight="800" text-anchor="middle" fill="#FFFFFF">1</text></g>
<rect x="245" y="340" width="180" height="56" rx="12" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2.5"/><text x="335" y="363.8" font-size="12" font-weight="400" fill="#1E1E1E" text-anchor="middle">out: a size with one</text><text x="335" y="379.4" font-size="12" font-weight="400" fill="#1E1E1E" text-anchor="middle">file</text>
<rect x="480" y="160" width="210" height="130" rx="12" fill="#FFD7AD" stroke="#F08C00" stroke-width="2.5"/><text x="585" y="211.9" font-size="15" font-weight="700" fill="#1E1E1E" text-anchor="middle">Partial hash</text><text x="585" y="235.4" font-size="12" font-weight="400" fill="#5C5C5C" text-anchor="middle">first 16 KiB + last 16 KiB +</text><text x="585" y="251" font-size="12" font-weight="400" fill="#5C5C5C" text-anchor="middle">size, in parallel</text>
<g><circle cx="486" cy="166" r="13" fill="#1E1E1E" stroke="#1E1E1E" stroke-width="2"/><text x="486" y="170" font-size="13" font-weight="800" text-anchor="middle" fill="#FFFFFF">2</text></g>
<rect x="495" y="340" width="180" height="56" rx="12" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2.5"/><text x="585" y="363.8" font-size="12" font-weight="400" fill="#1E1E1E" text-anchor="middle">out: a partial hash</text><text x="585" y="379.4" font-size="12" font-weight="400" fill="#1E1E1E" text-anchor="middle">with one file</text>
<rect x="730" y="160" width="210" height="130" rx="12" fill="#E1D3FF" stroke="#8E4EC6" stroke-width="2.5"/><text x="835" y="211.9" font-size="15" font-weight="700" fill="#1E1E1E" text-anchor="middle">Full hash</text><text x="835" y="235.4" font-size="12" font-weight="400" fill="#5C5C5C" text-anchor="middle">SHA-256 of the whole file,</text><text x="835" y="251" font-size="12" font-weight="400" fill="#5C5C5C" text-anchor="middle">in parallel</text>
<g><circle cx="736" cy="166" r="13" fill="#1E1E1E" stroke="#1E1E1E" stroke-width="2"/><text x="736" y="170" font-size="13" font-weight="800" text-anchor="middle" fill="#FFFFFF">3</text></g>
<rect x="745" y="340" width="180" height="56" rx="12" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2.5"/><text x="835" y="363.8" font-size="12" font-weight="400" fill="#1E1E1E" text-anchor="middle">out: a full hash with</text><text x="835" y="379.4" font-size="12" font-weight="400" fill="#1E1E1E" text-anchor="middle">one file</text>
<rect x="982" y="150" width="222" height="150" rx="12" fill="#CDF3C9" stroke="#30A46C" stroke-width="2.5"/><text x="1093" y="204.1" font-size="15" font-weight="700" fill="#1E1E1E" text-anchor="middle">DuplicateGroup</text><text x="1093" y="227.6" font-size="12" font-weight="400" fill="#5C5C5C" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.16">getHash()</tspan><tspan> · </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.16">getFiles()</tspan></text><text x="1093" y="243.2" font-size="12" font-weight="400" fill="#5C5C5C" text-anchor="middle">(sorted by path) ·</text><text x="1093" y="258.8" font-size="12" font-weight="400" fill="#5C5C5C" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.16">getFileSizeBytes()</tspan></text>
<rect x="982" y="330" width="222" height="76" rx="12" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2.5"/><text x="1093" y="363.225" font-size="13.5" font-weight="700" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.555">getWastedBytes()</tspan></text><text x="1093" y="384.775" font-size="10.5" font-weight="400" fill="#5C5C5C" text-anchor="middle">size × (copies − 1)</text>
<rect x="670" y="114" width="340" height="24" rx="9" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/><text x="840" y="131" font-size="12.5" font-weight="600" fill="#1E1E1E" text-anchor="middle">≤ 32 KiB: the partial hash already read it all</text>
<g filter="url(#shadow)"><rect x="36" y="440" width="280" height="150" rx="3" fill="#FFE88A"/></g><text x="50" y="464" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.09">minSize(bytes)</tspan><tspan> — default 1, so</tspan></text><text x="50" y="482.2" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start">empty files are never duplicates.</text><text x="50" y="500.4" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.09">skipHidden(true)</tspan><tspan> — dot names,</tspan></text><text x="50" y="518.6" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.09">$RECYCLE.BIN</tspan><tspan>, </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.09">System Volume</tspan></text><text x="50" y="536.8" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.09">Information</tspan><tspan>.</tspan></text>
<g filter="url(#shadow)"><rect x="336" y="440" width="280" height="150" rx="3" fill="#C7E4FF"/></g><text x="350" y="464" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start">Progress messages: &quot;Scanning: N</text><text x="350" y="482.2" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start">files&quot; every 5 000 files, then the</text><text x="350" y="500.4" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start">candidates by size, then the groups</text><text x="350" y="518.6" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start">being confirmed.</text>
<g filter="url(#shadow)"><rect x="636" y="440" width="280" height="150" rx="3" fill="#FFCCE5"/></g><text x="650" y="464" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start"><tspan>Setting </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.09">cancel</tspan><tspan> stops the work;</tspan></text><text x="650" y="482.2" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start">the groups confirmed so far are</text><text x="650" y="500.4" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start">returned. Unreadable files are</text><text x="650" y="518.6" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start">skipped.</text>
<g filter="url(#shadow)"><rect x="936" y="440" width="268" height="150" rx="3" fill="#CDF3C9"/></g><text x="950" y="464" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start">The list comes sorted by wasted</text><text x="950" y="482.2" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start">space, largest first.</text>
<text x="36" y="52" font-size="26" font-weight="800" fill="#1E1E1E">Finding duplicates in three steps</text><text x="36" y="80" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start">Each step only looks at what survived the one before, so most files are never read in full.</text><g transform="translate(1076,30)"><rect width="128" height="28" rx="14" fill="#FFFFFF" stroke="#E0E0E0"/><circle cx="16" cy="14" r="6" fill="#F08C00"/><text x="30" y="19" font-size="12.5" font-weight="700" fill="#1E1E1E">OctopusFile</text></g>
</svg>
