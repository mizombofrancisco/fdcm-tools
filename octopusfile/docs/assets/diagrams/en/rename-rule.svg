<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 720" width="1240" height="720" role="img" aria-label="How the rule builds a new name" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title>How the rule builds a new name</title>
<defs><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#D4D4D4"/></pattern><filter id="shadow" x="-10%" y="-10%" width="130%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#000000" flood-opacity="0.18"/></filter><marker id="arrow-1E1E1E" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1.5,1.5 L10,6 L1.5,10.5" fill="none" stroke="#1E1E1E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-8F8F8F" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1.5,1.5 L10,6 L1.5,10.5" fill="none" stroke="#8F8F8F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="1240" height="720" rx="18" fill="#F7F7F5"/><rect width="1240" height="720" rx="18" fill="url(#dots)"/><rect x="0.75" y="0.75" width="1238.5" height="718.5" rx="18" fill="none" stroke="#E0E0E0" stroke-width="1.5"/>

<path d="M420,185 L468,185" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
<path d="M650,210 L650,246" fill="none" stroke="#8F8F8F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#arrow-8F8F8F)"/>
<path d="M420,273 L468,273" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
<path d="M650,298 L650,334" fill="none" stroke="#8F8F8F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#arrow-8F8F8F)"/>
<path d="M420,361 L468,361" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
<path d="M650,386 L650,422" fill="none" stroke="#8F8F8F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#arrow-8F8F8F)"/>
<path d="M420,449 L468,449" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
<path d="M650,474 L650,510" fill="none" stroke="#8F8F8F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#arrow-8F8F8F)"/>
<path d="M420,537 L468,537" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
<path d="M650,562 L650,598" fill="none" stroke="#8F8F8F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#arrow-8F8F8F)"/>
<path d="M420,625 L468,625" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
<text x="80" y="132" font-size="12.5" font-weight="800" fill="#5C5C5C" text-anchor="start">STEP</text>
<text x="470" y="132" font-size="12.5" font-weight="800" fill="#5C5C5C" text-anchor="start">EXAMPLE: 1ST FILE &quot;IMG_0042.JPG&quot;, CHANGED ON 2026-07-14</text>
<g><circle cx="54" cy="184" r="13" fill="#1E1E1E" stroke="#1E1E1E" stroke-width="2"/><text x="54" y="188" font-size="13" font-weight="800" text-anchor="middle" fill="#FFFFFF">0</text></g>
<rect x="80" y="150" width="340" height="70" rx="12" fill="#EBEBEB" stroke="#8F8F8F" stroke-width="2.5"/><text x="250" y="180.05" font-size="14" font-weight="700" fill="#1E1E1E" text-anchor="middle">Split off the extension</text><text x="250" y="202.25" font-size="11" font-weight="400" fill="#5C5C5C" text-anchor="middle"><tspan>not with </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="10.23">includeExtension</tspan><tspan>, nor for a folder</tspan></text>
<rect x="470" y="160" width="360" height="50" rx="25" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2.5"/><text x="650" y="189.05" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.555">IMG_0042</tspan><tspan> + </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.555">.JPG</tspan></text>
<g><circle cx="54" cy="272" r="13" fill="#1E1E1E" stroke="#1E1E1E" stroke-width="2"/><text x="54" y="276" font-size="13" font-weight="800" text-anchor="middle" fill="#FFFFFF">1</text></g>
<rect x="80" y="238" width="340" height="70" rx="12" fill="#C7E4FF" stroke="#0D8BF2" stroke-width="2.5"/><text x="250" y="268.05" font-size="14" font-weight="700" fill="#1E1E1E" text-anchor="middle">Template</text><text x="250" y="290.25" font-size="11" font-weight="400" fill="#5C5C5C" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="10.23">template = &quot;Trip {n} {date}&quot;</tspan><tspan>, </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="10.23">digits = 3</tspan></text>
<rect x="470" y="248" width="360" height="50" rx="25" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2.5"/><text x="650" y="277.05" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.555">Trip 001 2026-07-14</tspan></text>
<g><circle cx="54" cy="360" r="13" fill="#1E1E1E" stroke="#1E1E1E" stroke-width="2"/><text x="54" y="364" font-size="13" font-weight="800" text-anchor="middle" fill="#FFFFFF">2</text></g>
<rect x="80" y="326" width="340" height="70" rx="12" fill="#C2F0E6" stroke="#12A594" stroke-width="2.5"/><text x="250" y="356.05" font-size="14" font-weight="700" fill="#1E1E1E" text-anchor="middle">Find and replace</text><text x="250" y="378.25" font-size="11" font-weight="400" fill="#5C5C5C" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="10.23">find = &quot;Trip&quot;</tspan><tspan>, </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="10.23">replace = &quot;Lisbon&quot;</tspan></text>
<rect x="470" y="336" width="360" height="50" rx="25" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2.5"/><text x="650" y="365.05" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.555">Lisbon 001 2026-07-14</tspan></text>
<g><circle cx="54" cy="448" r="13" fill="#1E1E1E" stroke="#1E1E1E" stroke-width="2"/><text x="54" y="452" font-size="13" font-weight="800" text-anchor="middle" fill="#FFFFFF">3</text></g>
<rect x="80" y="414" width="340" height="70" rx="12" fill="#FFE88A" stroke="#E0B400" stroke-width="2.5"/><text x="250" y="444.05" font-size="14" font-weight="700" fill="#1E1E1E" text-anchor="middle">Prefix and suffix</text><text x="250" y="466.25" font-size="11" font-weight="400" fill="#5C5C5C" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="10.23">suffix = &quot;_final&quot;</tspan></text>
<rect x="470" y="424" width="360" height="50" rx="25" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2.5"/><text x="650" y="453.05" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.555">Lisbon 001 2026-07-14_final</tspan></text>
<g><circle cx="54" cy="536" r="13" fill="#1E1E1E" stroke="#1E1E1E" stroke-width="2"/><text x="54" y="540" font-size="13" font-weight="800" text-anchor="middle" fill="#FFFFFF">4</text></g>
<rect x="80" y="502" width="340" height="70" rx="12" fill="#FFD7AD" stroke="#F08C00" stroke-width="2.5"/><text x="250" y="532.05" font-size="14" font-weight="700" fill="#1E1E1E" text-anchor="middle">Letter case</text><text x="250" y="554.25" font-size="11" font-weight="400" fill="#5C5C5C" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="10.23">letterCase = LOWER</tspan></text>
<rect x="470" y="512" width="360" height="50" rx="25" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2.5"/><text x="650" y="541.05" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.555">lisbon 001 2026-07-14_final</tspan></text>
<g><circle cx="54" cy="624" r="13" fill="#1E1E1E" stroke="#1E1E1E" stroke-width="2"/><text x="54" y="628" font-size="13" font-weight="800" text-anchor="middle" fill="#FFFFFF">5</text></g>
<rect x="80" y="590" width="340" height="70" rx="12" fill="#CDF3C9" stroke="#30A46C" stroke-width="2.5"/><text x="250" y="620.05" font-size="14" font-weight="700" fill="#1E1E1E" text-anchor="middle">Trim spaces, add the extension</text><text x="250" y="642.25" font-size="11" font-weight="400" fill="#5C5C5C" text-anchor="middle">the extension is kept as it was</text>
<rect x="470" y="600" width="360" height="50" rx="25" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2.5"/><text x="650" y="629.05" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.555">lisbon 001 2026-07-14_final.JPG</tspan></text>
<g filter="url(#shadow)"><rect x="870" y="150" width="334" height="150" rx="3" fill="#C7E4FF"/></g><text x="884" y="174" font-size="14" font-weight="700" fill="#1E1E1E">Template placeholders</text><text x="884" y="195.575" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="start"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.555">{name}</tspan><tspan> the original name</tspan></text><text x="884" y="214.475" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="start"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.555">{n}</tspan><tspan> </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.555">start</tspan><tspan> + position, zero-padded to</tspan></text><text x="884" y="233.375" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="start"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.555">digits</tspan></text><text x="884" y="252.275" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="start"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.555">{date}</tspan><tspan> modified date </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.555">yyyy-MM-dd</tspan></text><text x="884" y="271.175" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="start"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.555">{ext}</tspan><tspan> the extension, without the dot</tspan></text>
<g filter="url(#shadow)"><rect x="870" y="320" width="334" height="110" rx="3" fill="#C2F0E6"/></g><text x="884" y="344" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="start"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.555">find</tspan><tspan> is plain text, or a regular</tspan></text><text x="884" y="362.9" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="start"><tspan>expression with </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.555">regex</tspan><tspan> (</tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.555">$1</tspan><tspan> groups);</tspan></text><text x="884" y="381.8" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="start"><tspan>any case unless </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.555">matchCase</tspan><tspan>.</tspan></text>
<g filter="url(#shadow)"><rect x="870" y="570" width="334" height="92" rx="3" fill="#EBEBEB"/></g><text x="884" y="594" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="start">The counter follows the order of the</text><text x="884" y="612.9" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="start"><tspan>files: the 1st gets </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.555">start</tspan><tspan> (1 by</tspan></text><text x="884" y="631.8" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="start">default).</text>
<g filter="url(#shadow)"><rect x="870" y="450" width="334" height="100" rx="3" fill="#FFD7AD"/></g><text x="884" y="474" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="start"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.555">KEEP</tspan><tspan>, </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.555">LOWER</tspan><tspan>, </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.555">UPPER</tspan><tspan>, </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.555">TITLE</tspan><tspan> —</tspan></text><text x="884" y="492.9" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="start"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.555">TITLE</tspan><tspan> capitalizes after a space, </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.555">-</tspan><tspan>,</tspan></text><text x="884" y="511.8" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="start"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.555">_</tspan><tspan> or </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.555">.</tspan><tspan>.</tspan></text>
<text x="80" y="690" font-size="13" font-weight="400" fill="#5C5C5C" text-anchor="start">The template is expanded in one pass: a name that contains &quot;{n}&quot; is not expanded again.</text>
<text x="36" y="52" font-size="26" font-weight="800" fill="#1E1E1E">How the rule builds a new name</text><text x="36" y="80" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start">The steps run in this order on the name without its extension; an empty field skips its step.</text><g transform="translate(1076,30)"><rect width="128" height="28" rx="14" fill="#FFFFFF" stroke="#E0E0E0"/><circle cx="16" cy="14" r="6" fill="#F08C00"/><text x="30" y="19" font-size="12.5" font-weight="700" fill="#1E1E1E">OctopusFile</text></g>
</svg>
