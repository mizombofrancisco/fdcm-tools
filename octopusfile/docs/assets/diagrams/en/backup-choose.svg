<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 620" width="1240" height="620" role="img" aria-label="Three ways to keep a copy — which one?" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title>Three ways to keep a copy — which one?</title>
<defs><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#D4D4D4"/></pattern><filter id="shadow" x="-10%" y="-10%" width="130%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#000000" flood-opacity="0.18"/></filter><marker id="arrow-1E1E1E" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1.5,1.5 L10,6 L1.5,10.5" fill="none" stroke="#1E1E1E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="1240" height="620" rx="18" fill="#F7F7F5"/><rect width="1240" height="620" rx="18" fill="url(#dots)"/><rect x="0.75" y="0.75" width="1238.5" height="618.5" rx="18" fill="none" stroke="#E0E0E0" stroke-width="1.5"/>
<g><rect x="290" y="130" width="292" height="440" rx="14" fill="#FFD7AD" fill-opacity="0.38" stroke="#F08C00" stroke-width="1.5" stroke-dasharray="0"/><rect x="302" y="117" width="126" height="26" rx="8" fill="#F08C00"/><text x="316" y="134" font-size="13" font-weight="700" fill="#FFFFFF">BackupService</text></g>
<g><rect x="602" y="130" width="292" height="440" rx="14" fill="#E1D3FF" fill-opacity="0.38" stroke="#8E4EC6" stroke-width="1.5" stroke-dasharray="0"/><rect x="614" y="117" width="164" height="26" rx="8" fill="#8E4EC6"/><text x="628" y="134" font-size="13" font-weight="700" fill="#FFFFFF">SnapshotRepository</text></g>
<g><rect x="914" y="130" width="292" height="440" rx="14" fill="#C2F0E6" fill-opacity="0.38" stroke="#12A594" stroke-width="1.5" stroke-dasharray="0"/><rect x="926" y="117" width="187" height="26" rx="8" fill="#12A594"/><text x="940" y="134" font-size="13" font-weight="700" fill="#FFFFFF">DirectorySynchronizer</text></g>
<path d="M226,290 L284,290" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
<polygon points="131,230 226,290 131,350 36,290" fill="#FFE88A" stroke="#E0B400" stroke-width="2.5" stroke-linejoin="round"/><text x="131" y="285.275" font-size="13.5" font-weight="700" fill="#1E1E1E" text-anchor="middle">What do you need</text><text x="131" y="302.825" font-size="13.5" font-weight="700" fill="#1E1E1E" text-anchor="middle">later?</text>
<text x="310" y="172" font-size="16" font-weight="800" fill="#1E1E1E" text-anchor="start">One file per backup</text>
<rect x="306" y="190" width="260" height="50" rx="12" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2.5"/><text x="436" y="210.625" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="middle">a dated ZIP:</text><text x="436" y="226.875" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">Documents-yyyyMMdd-HHmmssSSS.zip</tspan></text>
<rect x="306" y="252" width="260" height="50" rx="12" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2.5"/><text x="436" y="280.75" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="middle">every run stores everything again</text>
<rect x="306" y="314" width="260" height="50" rx="12" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2.5"/><text x="436" y="342.75" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="middle">open it with any ZIP program</text>
<rect x="306" y="376" width="260" height="50" rx="12" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2.5"/><text x="436" y="404.75" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">restoreTo</tspan><tspan> replaces same names</tspan></text>
<g filter="url(#shadow)"><rect x="306" y="456" width="260" height="78" rx="3" fill="#FFE88A"/></g><text x="320" y="480" font-size="14" font-weight="400" fill="#1E1E1E" text-anchor="start">&quot;a file I can send or keep&quot;</text>
<text x="622" y="172" font-size="16" font-weight="800" fill="#1E1E1E" text-anchor="start">A history of versions</text>
<rect x="618" y="190" width="260" height="50" rx="12" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2.5"/><text x="748" y="218.75" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="middle">only new content is stored</text>
<rect x="618" y="252" width="260" height="50" rx="12" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2.5"/><text x="748" y="280.75" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="middle">identical files stored once</text>
<rect x="618" y="314" width="260" height="50" rx="12" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2.5"/><text x="748" y="342.75" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="middle">optional AES-256-GCM password</text>
<rect x="618" y="376" width="260" height="50" rx="12" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2.5"/><text x="748" y="404.75" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">push</tspan><tspan> / </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">pull</tspan><tspan> to a WebDAV cloud</tspan></text>
<g filter="url(#shadow)"><rect x="618" y="456" width="260" height="78" rx="3" fill="#FFE88A"/></g><text x="632" y="480" font-size="14" font-weight="400" fill="#1E1E1E" text-anchor="start">&quot;go back to last Tuesday&quot;</text>
<text x="934" y="172" font-size="16" font-weight="800" fill="#1E1E1E" text-anchor="start">The same folder elsewhere</text>
<rect x="930" y="190" width="260" height="50" rx="12" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2.5"/><text x="1060" y="218.75" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="middle">plain files, ready to open</text>
<rect x="930" y="252" width="260" height="50" rx="12" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2.5"/><text x="1060" y="280.75" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="middle">copies only new and changed files</text>
<rect x="930" y="314" width="260" height="50" rx="12" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2.5"/><text x="1060" y="342.75" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">mirror = true</tspan><tspan> also deletes</tspan></text>
<rect x="930" y="376" width="260" height="50" rx="12" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2.5"/><text x="1060" y="404.75" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="middle">no history: only the last state</text>
<g filter="url(#shadow)"><rect x="930" y="456" width="260" height="78" rx="3" fill="#FFE88A"/></g><text x="944" y="480" font-size="14" font-weight="400" fill="#1E1E1E" text-anchor="start">&quot;my folder, also on the USB</text><text x="944" y="499.6" font-size="14" font-weight="400" fill="#1E1E1E" text-anchor="start">drive&quot;</text>
<text x="36" y="400" font-size="12.5" font-weight="400" fill="#5C5C5C" text-anchor="start">Each column is one class; the facade</text>
<text x="36" y="418" font-size="12.5" font-weight="400" fill="#5C5C5C" text-anchor="start"><tspan>offers </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">backup(…)</tspan><tspan> and </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">sync(…)</tspan><tspan>.</tspan></text>
<text x="36" y="52" font-size="26" font-weight="800" fill="#1E1E1E">Three ways to keep a copy — which one?</text><text x="36" y="80" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start">Same goal, different results on the disk: pick by what you need to get back later.</text><g transform="translate(1076,30)"><rect width="128" height="28" rx="14" fill="#FFFFFF" stroke="#E0E0E0"/><circle cx="16" cy="14" r="6" fill="#F08C00"/><text x="30" y="19" font-size="12.5" font-weight="700" fill="#1E1E1E">OctopusFile</text></g>
</svg>
