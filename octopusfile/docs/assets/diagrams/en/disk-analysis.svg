<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 730" width="1240" height="730" role="img" aria-label="Disk analysis in a single walk" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title>Disk analysis in a single walk</title>
<defs><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#D4D4D4"/></pattern><filter id="shadow" x="-10%" y="-10%" width="130%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#000000" flood-opacity="0.18"/></filter><marker id="arrow-1E1E1E" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1.5,1.5 L10,6 L1.5,10.5" fill="none" stroke="#1E1E1E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="1240" height="730" rx="18" fill="#F7F7F5"/><rect width="1240" height="730" rx="18" fill="url(#dots)"/><rect x="0.75" y="0.75" width="1238.5" height="728.5" rx="18" fill="none" stroke="#E0E0E0" stroke-width="1.5"/>
<g><rect x="250" y="140" width="480" height="380" rx="14" fill="#FFE88A" fill-opacity="0.38" stroke="#E0B400" stroke-width="1.5" stroke-dasharray="0"/><rect x="262" y="127" width="88" height="26" rx="8" fill="#E0B400"/><text x="276" y="144" font-size="13" font-weight="700" fill="#FFFFFF">The walk</text></g>
<g><rect x="780" y="140" width="424" height="520" rx="14" fill="#CDF3C9" fill-opacity="0.38" stroke="#30A46C" stroke-width="1.5" stroke-dasharray="0"/><rect x="792" y="127" width="172" height="26" rx="8" fill="#30A46C"/><text x="806" y="144" font-size="13" font-weight="700" fill="#FFFFFF">DiskAnalyzer.Result</text></g>
<path d="M206,205 L248,205" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
<path d="M490,256 L490,270" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
<path d="M490,390 L490,404" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
<path d="M730,330 L778,330" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
<path d="M36,160 v90 a85,10 0 0 0 170,0 v-90" fill="#EBEBEB" stroke="#8F8F8F" stroke-width="2.5"/><ellipse cx="121" cy="160" rx="85" ry="10" fill="#EBEBEB" stroke="#8F8F8F" stroke-width="2.5"/><text x="121" y="213.5" font-size="15" font-weight="700" fill="#1E1E1E" text-anchor="middle">folder</text>
<rect x="274" y="170" width="432" height="86" rx="12" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2.5"/><text x="490" y="200.9" font-size="14" font-weight="700" fill="#1E1E1E" text-anchor="middle">Entering a folder</text><text x="490" y="223.1" font-size="11" font-weight="400" fill="#5C5C5C" text-anchor="middle"><tspan>skip </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="10.23">node_modules</tspan><tspan>, </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="10.23">$RECYCLE.BIN</tspan><tspan>, </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="10.23">System Volume Information</tspan><tspan>,</tspan></text><text x="490" y="237.4" font-size="11" font-weight="400" fill="#5C5C5C" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="10.23">AppData</tspan><tspan>, </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="10.23">.git</tspan><tspan> and names starting with </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="10.23">.</tspan><tspan> (not the root)</tspan></text>
<rect x="274" y="272" width="432" height="118" rx="12" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2.5"/><text x="490" y="318.9" font-size="14" font-weight="700" fill="#1E1E1E" text-anchor="middle">Each file</text><text x="490" y="341.1" font-size="11" font-weight="400" fill="#5C5C5C" text-anchor="middle">adds its size to its folder · may enter the N largest · old and</text><text x="490" y="355.4" font-size="11" font-weight="400" fill="#5C5C5C" text-anchor="middle">large? · counts in its category (by extension)</text>
<rect x="274" y="406" width="432" height="92" rx="12" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2.5"/><text x="490" y="439.9" font-size="14" font-weight="700" fill="#1E1E1E" text-anchor="middle">Leaving a folder</text><text x="490" y="462.1" font-size="11" font-weight="400" fill="#5C5C5C" text-anchor="middle">size = own files + subfolders · subfolders sorted, largest first ·</text><text x="490" y="476.4" font-size="11" font-weight="400" fill="#5C5C5C" text-anchor="middle">no files and no subfolders: empty</text>
<rect x="800" y="170" width="384" height="66" rx="12" fill="#C2F0E6" stroke="#12A594" stroke-width="2.5"/><text x="992" y="191.4" font-size="13.5" font-weight="700" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.555">root</tspan></text><text x="992" y="212.95" font-size="10.5" font-weight="400" fill="#5C5C5C" text-anchor="middle"><tspan>folder tree: </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="9.765">size()</tspan><tspan>, </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="9.765">ownFilesSize()</tspan><tspan>, </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="9.765">fileCount()</tspan><tspan>,</tspan></text><text x="992" y="226.6" font-size="10.5" font-weight="400" fill="#5C5C5C" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="9.765">children()</tspan></text>
<rect x="800" y="250" width="384" height="66" rx="12" fill="#C7E4FF" stroke="#0D8BF2" stroke-width="2.5"/><text x="992" y="278.225" font-size="13.5" font-weight="700" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.555">largest</tspan></text><text x="992" y="299.775" font-size="10.5" font-weight="400" fill="#5C5C5C" text-anchor="middle"><tspan>the N largest files (</tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="9.765">top(n)</tspan><tspan>, 60 by default)</tspan></text>
<rect x="800" y="330" width="384" height="66" rx="12" fill="#FFD7AD" stroke="#F08C00" stroke-width="2.5"/><text x="992" y="358.225" font-size="13.5" font-weight="700" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.555">oldLarge</tspan></text><text x="992" y="379.775" font-size="10.5" font-weight="400" fill="#5C5C5C" text-anchor="middle"><tspan>≥ 50 MiB and unchanged for 180 days (</tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="9.765">old(age, size)</tspan><tspan>)</tspan></text>
<rect x="800" y="410" width="384" height="66" rx="12" fill="#EBEBEB" stroke="#8F8F8F" stroke-width="2.5"/><text x="992" y="438.225" font-size="13.5" font-weight="700" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.555">emptyFolders</tspan></text><text x="992" y="459.775" font-size="10.5" font-weight="400" fill="#5C5C5C" text-anchor="middle">folders below the root with nothing analyzed inside</text>
<rect x="800" y="490" width="384" height="66" rx="12" fill="#E1D3FF" stroke="#8E4EC6" stroke-width="2.5"/><text x="992" y="518.225" font-size="13.5" font-weight="700" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.555">categories</tspan></text><text x="992" y="539.775" font-size="10.5" font-weight="400" fill="#5C5C5C" text-anchor="middle">bytes and files per kind, largest first; empty kinds left out</text>
<rect x="800" y="570" width="384" height="66" rx="12" fill="#FFCCE5" stroke="#E93D82" stroke-width="2.5"/><text x="992" y="598.225" font-size="13.5" font-weight="700" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.555">cancelled</tspan><tspan> · </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.555">elapsedMillis</tspan></text><text x="992" y="619.775" font-size="10.5" font-weight="400" fill="#5C5C5C" text-anchor="middle">stopped early? · how long it took</text>
<g filter="url(#shadow)"><rect x="36" y="300" width="190" height="200" rx="3" fill="#E1D3FF"/></g><text x="50" y="324" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start">Categories: images,</text><text x="50" y="342.2" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start">videos, music,</text><text x="50" y="360.4" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start">documents, archives,</text><text x="50" y="378.6" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start">apps, code — and</text><text x="50" y="396.8" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start">other. — see</text><text x="50" y="415" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.09">category(name)</tspan><tspan>.</tspan></text>
<g filter="url(#shadow)"><rect x="250" y="560" width="230" height="140" rx="3" fill="#C7E4FF"/></g><text x="264" y="584" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="start"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.555">progress</tspan><tspan> gets the number</tspan></text><text x="264" y="602.9" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="start">of files seen, every 2 000</text><text x="264" y="621.8" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="start">files and at the end.</text>
<g filter="url(#shadow)"><rect x="500" y="560" width="230" height="140" rx="3" fill="#FFCCE5"/></g><text x="514" y="584" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="start"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.555">cancel</tspan><tspan> stops the walk:</tspan></text><text x="514" y="602.9" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="start">the folders still open are</text><text x="514" y="621.8" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="start"><tspan>closed and </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.555">cancelled</tspan><tspan> is</tspan></text><text x="514" y="640.7" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="start">true — a partial result.</text>
<g filter="url(#shadow)"><rect x="36" y="560" width="190" height="140" rx="3" fill="#FFE88A"/></g><text x="50" y="584" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.09">skipHidden(false)</tspan></text><text x="50" y="602.2" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start"><tspan>and </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.09">skipNames(set)</tspan></text><text x="50" y="620.4" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start">change what is</text><text x="50" y="638.6" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start">skipped. Unreadable</text><text x="50" y="656.8" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start">entries are skipped.</text>
<text x="780" y="692" font-size="13.5" font-weight="600" fill="#5C5C5C" text-anchor="start">Only one object per folder is kept, never one per file.</text>
<text x="36" y="52" font-size="26" font-weight="800" fill="#1E1E1E">Disk analysis in a single walk</text><text x="36" y="80" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13.95">new DiskAnalyzer().analyze(folder, progress, cancel)</tspan><tspan> visits every file once and keeps only the folders.</tspan></text><g transform="translate(1076,30)"><rect width="128" height="28" rx="14" fill="#FFFFFF" stroke="#E0E0E0"/><circle cx="16" cy="14" r="6" fill="#F08C00"/><text x="30" y="19" font-size="12.5" font-weight="700" fill="#1E1E1E">OctopusFile</text></g>
</svg>
