<rect x="300" y="120" width="300" height="90" rx="12" fill="#FFD7AD" stroke="#F08C00" stroke-width="2.5"/><text x="450" y="159.7" font-size="15" font-weight="700" fill="#1E1E1E" text-anchor="middle">OctopusFile facade</text><text x="450" y="183.2" font-size="12" font-weight="400" fill="#5C5C5C" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.16">octo.copy(a).to(b)</tspan></text>
<rect x="700" y="120" width="500" height="90" rx="12" fill="#FFC9C2" stroke="#E5484D" stroke-width="2.5"/><text x="950" y="159.7" font-size="15" font-weight="700" fill="#1E1E1E" text-anchor="middle">OctopusFileException (unchecked)</text><text x="950" y="183.2" font-size="12" font-weight="400" fill="#5C5C5C" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.16">errorCode()</tspan><tspan> · </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.16">path()</tspan><tspan> · </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.16">getCause()</tspan></text>
<rect x="300" y="360" width="300" height="90" rx="12" fill="#C7E4FF" stroke="#0D8BF2" stroke-width="2.5"/><text x="450" y="399.7" font-size="15" font-weight="700" fill="#1E1E1E" text-anchor="middle">Module class</text><text x="450" y="423.2" font-size="12" font-weight="400" fill="#5C5C5C" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.16">new FileMover().move(a, b)</tspan></text>
<polygon points="750,300 850,375 750,450 650,375" fill="#FFE88A" stroke="#E0B400" stroke-width="2.5" stroke-linejoin="round"/><text x="750" y="370.1" font-size="14" font-weight="700" fill="#1E1E1E" text-anchor="middle">Is there a JDK</text><text x="750" y="388.3" font-size="14" font-weight="700" fill="#1E1E1E" text-anchor="middle">exception for it?</text>
<g filter="url(#shadow)"><rect x="900" y="300" width="300" height="150" rx="3" fill="#CDF3C9"/></g><text x="914" y="324" font-size="14" font-weight="700" fill="#1E1E1E">Yes: the JDK type</text><text x="914" y="345.575" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="start">NoSuchFileException</text><text x="914" y="364.475" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="start">FileAlreadyExistsException</text><text x="914" y="383.375" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="start">NotDirectoryException</text><text x="914" y="402.275" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="start">DirectoryNotEmptyException</text><text x="914" y="421.175" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="start">AccessDeniedException</text>
<rect x="900" y="490" width="300" height="80" rx="12" fill="#E1D3FF" stroke="#8E4EC6" stroke-width="2.5"/><text x="1050" y="516.9" font-size="15" font-weight="700" fill="#1E1E1E" text-anchor="middle">FileOperationException</text><text x="1050" y="540.4" font-size="12" font-weight="400" fill="#5C5C5C" text-anchor="middle"><tspan>extends </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.16">IOException</tspan><tspan> · </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.16">errorCode()</tspan><tspan> ·</tspan></text><text x="1050" y="556" font-size="12" font-weight="400" fill="#5C5C5C" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.16">path()</tspan></text>
<rect x="619" y="153" width="60" height="24" rx="9" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/><text x="649" y="170" font-size="12.5" font-weight="600" fill="#1E1E1E" text-anchor="middle">throws</text>
<rect x="592" y="418" width="60" height="24" rx="9" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/><text x="622" y="435" font-size="12.5" font-weight="600" fill="#1E1E1E" text-anchor="middle">throws</text>
<rect x="854.5" y="363" width="39" height="24" rx="9" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/><text x="874" y="380" font-size="12.5" font-weight="600" fill="#1E1E1E" text-anchor="middle">yes</text>
<rect x="808" y="518" width="32" height="24" rx="9" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/><text x="824" y="535" font-size="12.5" font-weight="600" fill="#1E1E1E" text-anchor="middle">no</text>
<rect x="423.5" y="272" width="53" height="24" rx="9" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/><text x="450" y="289" font-size="12.5" font-weight="600" fill="#1E1E1E" text-anchor="middle">calls</text>
<g filter="url(#shadow)"><rect x="36" y="400" width="240" height="200" rx="3" fill="#FFE88A"/></g><text x="50" y="424" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start">The facade wraps a module&#x27;s</text><text x="50" y="442.2" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.09">IOException</tspan><tspan> in</tspan></text><text x="50" y="460.4" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.09">OctopusFileException</tspan><tspan> with</tspan></text><text x="50" y="478.6" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start">the code of the operation</text><text x="50" y="496.8" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start"><tspan>(</tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.09">COPY_ERROR</tspan><tspan>,</tspan></text><text x="50" y="515" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.09">READ_ERROR</tspan><tspan>…); the module&#x27;s</tspan></text><text x="50" y="533.2" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start">exception is the cause.</text>
<g filter="url(#shadow)"><rect x="300" y="490" width="330" height="130" rx="3" fill="#FFCCE5"/></g><text x="314" y="514" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="start"><tspan>Watch out: </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.555">catch (OctopusFileException</tspan></text><text x="314" y="532.9" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="start"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.555">e)</tspan><tspan> around a module class compiles but</tspan></text><text x="314" y="551.8" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="start"><tspan>catches nothing. Catch </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.555">IOException</tspan><tspan>.</tspan></text>
<text x="36" y="52" font-size="26" font-weight="800" fill="#1E1E1E">One rule for errors (the whole 2.x line)</text><text x="36" y="80" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start"><tspan>The facade throws unchecked exceptions; the modules declare </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13.95">IOException</tspan><tspan>, like </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13.95">java.nio.file.Files</tspan><tspan>.</tspan></text><g transform="translate(1076,30)"><rect width="128" height="28" rx="14" fill="#FFFFFF" stroke="#E0E0E0"/><circle cx="16" cy="14" r="6" fill="#F08C00"/><text x="30" y="19" font-size="12.5" font-weight="700" fill="#1E1E1E">OctopusFile</text></g>
</svg>
