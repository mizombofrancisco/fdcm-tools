<g><rect x="36" y="130" width="330" height="470" rx="14" fill="#FFE88A" fill-opacity="0.38" stroke="#E0B400" stroke-width="1.5" stroke-dasharray="0"/><rect x="48" y="117" width="256" height="26" rx="8" fill="#E0B400"/><text x="62" y="134" font-size="13" font-weight="700" fill="#FFFFFF">Base64 that comes from outside</text></g>
<g><rect x="410" y="130" width="794" height="210" rx="14" fill="#FFC9C2" fill-opacity="0.38" stroke="#E5484D" stroke-width="1.5" stroke-dasharray="0"/><rect x="422" y="117" width="172" height="26" rx="8" fill="#E5484D"/><text x="436" y="134" font-size="13" font-weight="700" fill="#FFFFFF">Until 2.0.5 / 2.1.1</text></g>
<g><rect x="410" y="390" width="794" height="210" rx="14" fill="#CDF3C9" fill-opacity="0.38" stroke="#30A46C" stroke-width="1.5" stroke-dasharray="0"/><rect x="422" y="377" width="172" height="26" rx="8" fill="#30A46C"/><text x="436" y="394" font-size="13" font-weight="700" fill="#FFFFFF">Since 2.0.6 / 2.1.2</text></g>
<g><rect x="36" y="650" width="1168" height="220" rx="14" fill="#C7E4FF" fill-opacity="0.38" stroke="#0D8BF2" stroke-width="1.5" stroke-dasharray="0"/><rect x="48" y="637" width="271" height="26" rx="8" fill="#0D8BF2"/><text x="62" y="654" font-size="13" font-weight="700" fill="#FFFFFF">What it means for an application</text></g>
<path d="M694,211 L742,211" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
<path d="M694,471 L742,471" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
<path d="M346,222 L432,211" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#arrow-1E1E1E)"/>
<path d="M346,222 L432,471" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
<path d="M346,362 L432,471" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
<path d="M346,502 L432,471" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
<rect x="56" y="166" width="290" height="112" rx="12" fill="#FFC9C2" stroke="#E5484D" stroke-width="2.5"/><text x="201" y="217.05" font-size="14" font-weight="700" fill="#1E1E1E" text-anchor="middle">Share nearby announcement</text><text x="201" y="239.25" font-size="11" font-weight="400" fill="#5C5C5C" text-anchor="middle">UDP, from any computer, before any key</text>
<rect x="56" y="306" width="290" height="112" rx="12" fill="#FFD7AD" stroke="#F08C00" stroke-width="2.5"/><text x="201" y="357.05" font-size="14" font-weight="700" fill="#1E1E1E" text-anchor="middle">Names in an offer or a folder sync</text><text x="201" y="379.25" font-size="11" font-weight="400" fill="#5C5C5C" text-anchor="middle">before the person accepts</text>
<rect x="56" y="446" width="290" height="112" rx="12" fill="#FFE88A" stroke="#E0B400" stroke-width="2.5"/><text x="201" y="497.05" font-size="14" font-weight="700" fill="#1E1E1E" text-anchor="middle">Vault, saved passwords, snapshots</text><text x="201" y="519.25" font-size="11" font-weight="400" fill="#5C5C5C" text-anchor="middle"><tspan>files that may come from a cloud (</tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="10.23">pull</tspan><tspan>)</tspan></text>
<rect x="434" y="176" width="260" height="70" rx="12" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2.5"/><text x="564" y="214.75" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">Base64.getDecoder().decode(…)</tspan></text>
<rect x="744" y="166" width="436" height="90" rx="12" fill="#FFC9C2" stroke="#E5484D" stroke-width="2.5"/><text x="962" y="206.05" font-size="14" font-weight="700" fill="#1E1E1E" text-anchor="middle">HotSpot decode intrinsic (AVX-512 VBMI)</text><text x="962" y="228.25" font-size="11" font-weight="400" fill="#5C5C5C" text-anchor="middle">JDK 17.0.6–17.0.21.0.3: out-of-bounds write on crafted input</text>
<text x="434" y="300" font-size="13" font-weight="600" fill="#5C5C5C" text-anchor="start">Only a fixed JVM (17.0.21.1 or later) protected the library.</text>
<rect x="434" y="436" width="260" height="70" rx="12" fill="#CDF3C9" stroke="#30A46C" stroke-width="2.5"/><text x="564" y="474.9" font-size="13" font-weight="700" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.09">SafeBase64.decode(…)</tspan></text>
<rect x="744" y="426" width="436" height="90" rx="12" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2.5"/><text x="962" y="466.4" font-size="13" font-weight="700" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.09">Base64.getDecoder().wrap(…)</tspan></text><text x="962" y="487.3" font-size="10" font-weight="400" fill="#5C5C5C" text-anchor="middle">the JDK streaming decoder: it never uses the intrinsic</text>
<text x="434" y="560" font-size="13" font-weight="600" fill="#5C5C5C" text-anchor="start"><tspan>Same bytes, same refusals (</tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.09">IllegalArgumentException</tspan><tspan>), same formats on disk and on the network.</tspan></text>
<g filter="url(#shadow)"><rect x="60" y="686" width="360" height="160" rx="3" fill="#FFE88A"/></g><text x="74" y="710" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start">Update the JVM anyway: the fix is in Java</text><text x="74" y="728.2" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start">(17.0.21.1, 21.0.13.1, 25.0.5.1…).</text><text x="74" y="746.4" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.09">SafeBase64</tspan><tspan> only keeps OctopusFile&#x27;s own</tspan></text><text x="74" y="764.6" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start">decoding off the faulty path.</text>
<g filter="url(#shadow)"><rect x="444" y="686" width="360" height="160" rx="3" fill="#FFCCE5"/></g><text x="458" y="710" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start">Applications that bundle a runtime (jlink,</text><text x="458" y="728.2" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start">jpackage) must be rebuilt on a fixed JDK, as</text><text x="458" y="746.4" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start">FileExp 3.11.1 was.</text>
<g filter="url(#shadow)"><rect x="828" y="686" width="360" height="160" rx="3" fill="#CDF3C9"/></g><text x="842" y="710" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.09">ant selftest</tspan><tspan>: 40 000+ inputs compared with</tspan></text><text x="842" y="728.2" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start">the JDK decoder, and a check that no source</text><text x="842" y="746.4" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start">file calls it.</text>
<text x="36" y="52" font-size="26" font-weight="800" fill="#1E1E1E">Java4Shell (CVE-2026-114938): Base64 decoding without the faulty code</text><text x="36" y="80" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start"><tspan>Since 2.0.6 / 2.1.2 every Base64 decode of OctopusFile goes through </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13.95">SafeBase64</tspan><tspan>: same result, safe even on a JVM that was not updated.</tspan></text><g transform="translate(1076,30)"><rect width="128" height="28" rx="14" fill="#FFFFFF" stroke="#E0E0E0"/><circle cx="16" cy="14" r="6" fill="#F08C00"/><text x="30" y="19" font-size="12.5" font-weight="700" fill="#1E1E1E">OctopusFile</text></g>
</svg>
