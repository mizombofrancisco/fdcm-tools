<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1010" width="1240" height="1010" role="img" aria-label="Folder sync between two computers (since 2.1)" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title>Folder sync between two computers (since 2.1)</title>
<defs><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#D4D4D4"/></pattern><filter id="shadow" x="-10%" y="-10%" width="130%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#000000" flood-opacity="0.18"/></filter><marker id="arrow-1E1E1E" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1.5,1.5 L10,6 L1.5,10.5" fill="none" stroke="#1E1E1E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="1240" height="1010" rx="18" fill="#F7F7F5"/><rect width="1240" height="1010" rx="18" fill="url(#dots)"/><rect x="0.75" y="0.75" width="1238.5" height="1008.5" rx="18" fill="none" stroke="#E0E0E0" stroke-width="1.5"/>
<g><rect x="36" y="130" width="370" height="610" rx="14" fill="#C7E4FF" fill-opacity="0.38" stroke="#0D8BF2" stroke-width="1.5" stroke-dasharray="0"/><rect x="48" y="117" width="157" height="26" rx="8" fill="#0D8BF2"/><text x="62" y="134" font-size="13" font-weight="700" fill="#FFFFFF">Office PC — syncs</text></g>
<g><rect x="834" y="130" width="370" height="610" rx="14" fill="#CDF3C9" fill-opacity="0.38" stroke="#30A46C" stroke-width="1.5" stroke-dasharray="0"/><rect x="846" y="117" width="202" height="26" rx="8" fill="#30A46C"/><text x="860" y="134" font-size="13" font-weight="700" fill="#FFFFFF">Ana&#x27;s laptop — receives</text></g>
<g><rect x="36" y="790" width="760" height="190" rx="14" fill="#FFE88A" fill-opacity="0.38" stroke="#E0B400" stroke-width="1.5" stroke-dasharray="0"/><rect x="48" y="777" width="301" height="26" rx="8" fill="#E0B400"/><text x="62" y="794" font-size="13" font-weight="700" fill="#FFFFFF">The receiving folder after accepting</text></g>
<path d="M830,200 L410,200" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#arrow-1E1E1E)"/>
<path d="M408,300 L832,300" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
<path d="M408,400 L832,400" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
<path d="M830,500 L410,500" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
<path d="M408,580 L832,580" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
<path d="M830,690 L410,690" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
<rect x="56" y="160" width="330" height="64" rx="12" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2.5"/><text x="221" y="187.4" font-size="13" font-weight="700" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.09">LanShare.canSync(peer)</tspan></text><text x="221" y="208.3" font-size="10" font-weight="400" fill="#5C5C5C" text-anchor="middle">false → fails before connecting</text>
<rect x="56" y="250" width="330" height="84" rx="12" fill="#C7E4FF" stroke="#0D8BF2" stroke-width="2.5"/><text x="221" y="287.625" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">LanShare.sync(peer, &quot;Office PC&quot;, docs,</tspan></text><text x="221" y="303.875" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">mirror, code -&gt; …, progress, cancel)</tspan></text>
<rect x="56" y="362" width="330" height="70" rx="12" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2.5"/><text x="221" y="384.9" font-size="14" font-weight="700" fill="#1E1E1E" text-anchor="middle">lists its folder</text><text x="221" y="407.1" font-size="11" font-weight="400" fill="#5C5C5C" text-anchor="middle">relative name, size, modification time; never</text><text x="221" y="421.4" font-size="11" font-weight="400" fill="#5C5C5C" text-anchor="middle">through a link</text>
<rect x="56" y="456" width="330" height="60" rx="12" fill="#E1D3FF" stroke="#8E4EC6" stroke-width="2.5"/><text x="221" y="481.05" font-size="14" font-weight="700" fill="#1E1E1E" text-anchor="middle">shows the code</text><text x="221" y="503.25" font-size="11" font-weight="400" fill="#5C5C5C" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="10.23">CodeListener</tspan></text>
<rect x="56" y="640" width="330" height="80" rx="12" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2.5"/><text x="221" y="668.9" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.09">sync</tspan><tspan> returns the </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.09">SyncReport</tspan></text><text x="221" y="689.8" font-size="10" font-weight="400" fill="#5C5C5C" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="9.3">added()</tspan><tspan> · </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="9.3">updated()</tspan><tspan> · </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="9.3">unchanged()</tspan><tspan> · </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="9.3">deleted()</tspan><tspan> ·</tspan></text><text x="221" y="702.8" font-size="10" font-weight="400" fill="#5C5C5C" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="9.3">skipped()</tspan><tspan> · </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="9.3">bytes()</tspan></text>
<rect x="854" y="160" width="330" height="64" rx="12" fill="#2B2B2B" stroke="#1E1E1E" stroke-width="2.5"/><text x="1019" y="187.625" font-size="12.5" font-weight="400" fill="#FFFFFF" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">new LanShare(&quot;Ana&#x27;s laptop&quot;, handler, null,</tspan></text><text x="1019" y="203.875" font-size="12.5" font-weight="400" fill="#FFFFFF" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">true)</tspan></text>
<text x="854" y="248" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.09">true</tspan><tspan> = sync on: announces </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.09">+sync</tspan></text>
<text x="854" y="268" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start">after its id (still 4 fields).</text>
<rect x="854" y="400" width="330" height="104" rx="12" fill="#CDF3C9" stroke="#30A46C" stroke-width="2.5"/><text x="1019" y="440.9" font-size="13" font-weight="700" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.09">handler.incoming(in)</tspan><tspan> · </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.09">in.isSync()</tspan></text><text x="1019" y="461.8" font-size="10" font-weight="400" fill="#5C5C5C" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="9.3">sender()</tspan><tspan>, </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="9.3">folderName()</tspan><tspan>, </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="9.3">mirror()</tspan><tspan>, </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="9.3">code()</tspan><tspan> — show</tspan></text><text x="1019" y="474.8" font-size="10" font-weight="400" fill="#5C5C5C" text-anchor="middle">them before the answer</text>
<rect x="854" y="522" width="190" height="50" rx="25" fill="#CDF3C9" stroke="#30A46C" stroke-width="2.5"/><text x="949" y="550.75" font-size="12.5" font-weight="700" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">acceptSync(folder, …)</tspan></text>
<rect x="1054" y="522" width="130" height="50" rx="25" fill="#FFC9C2" stroke="#E5484D" stroke-width="2.5"/><text x="1119" y="550.75" font-size="12.5" font-weight="700" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">decline()</tspan></text>
<rect x="854" y="590" width="330" height="62" rx="12" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2.5"/><text x="1019" y="616.4" font-size="13" font-weight="700" fill="#1E1E1E" text-anchor="middle">compares each name with its folder</text><text x="1019" y="637.3" font-size="10" font-weight="400" fill="#5C5C5C" text-anchor="middle">same size and time (±2 s) → not needed</text>
<rect x="467.5" y="166" width="305" height="24" rx="9" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/><text x="620" y="183" font-size="12.5" font-weight="600" fill="#1E1E1E" text-anchor="middle">UDP: FILEEXP-LAN2 | id+sync | port | name</text>
<g><circle cx="447" cy="178" r="13" fill="#1E1E1E" stroke="#1E1E1E" stroke-width="2"/><text x="447" y="182" font-size="13" font-weight="800" text-anchor="middle" fill="#FFFFFF">1</text></g>
<rect x="460.5" y="266" width="319" height="24" rx="9" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/><text x="620" y="283" font-size="12.5" font-weight="600" fill="#1E1E1E" text-anchor="middle">TCP: keys exchanged → the same 6-digit code</text>
<g><circle cx="440" cy="278" r="13" fill="#1E1E1E" stroke="#1E1E1E" stroke-width="2"/><text x="440" y="282" font-size="13" font-weight="800" text-anchor="middle" fill="#FFFFFF">2</text></g>
<rect x="474.5" y="366" width="291" height="24" rx="9" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/><text x="620" y="383" font-size="12.5" font-weight="600" fill="#1E1E1E" text-anchor="middle">#SYNC 1: folder name, mirror?, the list</text>
<g><circle cx="454" cy="378" r="13" fill="#1E1E1E" stroke="#1E1E1E" stroke-width="2"/><text x="454" y="382" font-size="13" font-weight="800" text-anchor="middle" fill="#FFFFFF">3</text></g>
<rect x="471" y="466" width="298" height="24" rx="9" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/><text x="620" y="483" font-size="12.5" font-weight="600" fill="#1E1E1E" text-anchor="middle">ACCEPT + the names it needs (or DECLINE)</text>
<g><circle cx="451" cy="478" r="13" fill="#1E1E1E" stroke="#1E1E1E" stroke-width="2"/><text x="451" y="482" font-size="13" font-weight="800" text-anchor="middle" fill="#FFFFFF">4</text></g>
<rect x="516.5" y="546" width="207" height="24" rx="9" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/><text x="620" y="563" font-size="12.5" font-weight="600" fill="#1E1E1E" text-anchor="middle">only those files, encrypted</text>
<g><circle cx="496" cy="558" r="13" fill="#1E1E1E" stroke="#1E1E1E" stroke-width="2"/><text x="496" y="562" font-size="13" font-weight="800" text-anchor="middle" fill="#FFFFFF">5</text></g>
<rect x="551.5" y="656" width="137" height="24" rx="9" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/><text x="620" y="673" font-size="12.5" font-weight="600" fill="#1E1E1E" text-anchor="middle">DONE + the report</text>
<g><circle cx="531" cy="668" r="13" fill="#1E1E1E" stroke="#1E1E1E" stroke-width="2"/><text x="531" y="672" font-size="13" font-weight="800" text-anchor="middle" fill="#FFFFFF">6</text></g>
<rect x="60" y="820" width="712" height="32" rx="12" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2.5"/><text x="416" y="839.75" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">a.txt</tspan><tspan> — same size and time — not sent</tspan></text>
<rect x="60" y="858" width="712" height="32" rx="12" fill="#C7E4FF" stroke="#0D8BF2" stroke-width="2.5"/><text x="416" y="877.75" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">b.txt</tspan><tspan> — another size or time — replaced</tspan></text>
<rect x="60" y="896" width="712" height="32" rx="12" fill="#CDF3C9" stroke="#30A46C" stroke-width="2.5"/><text x="416" y="915.75" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">c.txt</tspan><tspan> — new — written to </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">.part</tspan><tspan>, then moved</tspan></text>
<rect x="60" y="934" width="712" height="32" rx="12" fill="#FFC9C2" stroke="#E5484D" stroke-width="2.5"/><text x="416" y="953.75" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">old.txt</tspan><tspan> — not at the sender — kept; with mirror: deleted permanently</tspan></text>
<g filter="url(#shadow)"><rect x="834" y="790" width="370" height="190" rx="3" fill="#FFCCE5"/></g><text x="848" y="814" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start">Compatible: ordinary sends are unchanged.</text><text x="848" y="832.2" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start">FileExp 3.9 or older refuses the offer at once;</text><text x="848" y="850.4" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start">a receiver with sync off answers that it does</text><text x="848" y="868.6" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start">not accept folder sync, without asking the</text><text x="848" y="886.8" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start"><tspan>person. </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.09">accept</tspan><tspan> on a sync declines it: use</tspan></text><text x="848" y="905" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.09">acceptSync</tspan><tspan>.</tspan></text>
<text x="36" y="52" font-size="26" font-weight="800" fill="#1E1E1E">Folder sync between two computers (since 2.1)</text><text x="36" y="80" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start">Only the files that are new or changed on the other side are sent; the person who receives says yes or no.</text><g transform="translate(1076,30)"><rect width="128" height="28" rx="14" fill="#FFFFFF" stroke="#E0E0E0"/><circle cx="16" cy="14" r="6" fill="#F08C00"/><text x="30" y="19" font-size="12.5" font-weight="700" fill="#1E1E1E">OctopusFile</text></g>
</svg>
