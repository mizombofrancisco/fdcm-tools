<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 900" width="1240" height="900" role="img" aria-label="Sharing nearby: how two computers agree" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title>Sharing nearby: how two computers agree</title>
<defs><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#D4D4D4"/></pattern><filter id="shadow" x="-10%" y="-10%" width="130%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#000000" flood-opacity="0.18"/></filter><marker id="arrow-1E1E1E" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1.5,1.5 L10,6 L1.5,10.5" fill="none" stroke="#1E1E1E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="1240" height="900" rx="18" fill="#F7F7F5"/><rect width="1240" height="900" rx="18" fill="url(#dots)"/><rect x="0.75" y="0.75" width="1238.5" height="898.5" rx="18" fill="none" stroke="#E0E0E0" stroke-width="1.5"/>

<path d="M330,162 V870 M880,162 V870" stroke="#9E9E9E" stroke-width="2" stroke-dasharray="6 7"/>
<path d="M880,212 L338,212" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#arrow-1E1E1E)"/>
<path d="M330,292 L872,292" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
<path d="M880,372 L338,372" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
<path d="M330,452 L872,452" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
<path d="M330,622 L872,622" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
<path d="M880,702 L338,702" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
<path d="M330,782 L872,782" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
<rect x="230" y="112" width="200" height="50" rx="25" fill="#C7E4FF" stroke="#0D8BF2" stroke-width="2.5"/><text x="330" y="141.5" font-size="15" font-weight="700" fill="#1E1E1E" text-anchor="middle">Sender</text>
<rect x="780" y="112" width="200" height="50" rx="25" fill="#CDF3C9" stroke="#30A46C" stroke-width="2.5"/><text x="880" y="141.5" font-size="15" font-weight="700" fill="#1E1E1E" text-anchor="middle">Receiver</text>
<rect x="365" y="178" width="480" height="24" rx="9" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/><text x="605" y="195" font-size="12.5" font-weight="600" fill="#1E1E1E" text-anchor="middle">UDP broadcast, port 47821, every 3 s: FILEEXP-LAN2, name, TCP port</text>
<g><circle cx="300" cy="212" r="13" fill="#1E1E1E" stroke="#1E1E1E" stroke-width="2"/><text x="300" y="216" font-size="13" font-weight="800" text-anchor="middle" fill="#FFFFFF">1</text></g>
<rect x="410.5" y="258" width="389" height="24" rx="9" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/><text x="605" y="275" font-size="12.5" font-weight="600" fill="#1E1E1E" text-anchor="middle">TCP: FXL2 + commitment = SHA-256(sender&#x27;s public key)</text>
<g><circle cx="300" cy="292" r="13" fill="#1E1E1E" stroke="#1E1E1E" stroke-width="2"/><text x="300" y="296" font-size="13" font-weight="800" text-anchor="middle" fill="#FFFFFF">2</text></g>
<rect x="473.5" y="338" width="263" height="24" rx="9" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/><text x="605" y="355" font-size="12.5" font-weight="600" fill="#1E1E1E" text-anchor="middle">FXL2 + receiver&#x27;s X25519 public key</text>
<g><circle cx="300" cy="372" r="13" fill="#1E1E1E" stroke="#1E1E1E" stroke-width="2"/><text x="300" y="376" font-size="13" font-weight="800" text-anchor="middle" fill="#FFFFFF">3</text></g>
<rect x="400" y="418" width="410" height="24" rx="9" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/><text x="605" y="435" font-size="12.5" font-weight="600" fill="#1E1E1E" text-anchor="middle">sender&#x27;s public key — the receiver checks the commitment</text>
<g><circle cx="300" cy="452" r="13" fill="#1E1E1E" stroke="#1E1E1E" stroke-width="2"/><text x="300" y="456" font-size="13" font-weight="800" text-anchor="middle" fill="#FFFFFF">4</text></g>
<rect x="210" y="500" width="240" height="70" rx="12" fill="#E1D3FF" stroke="#8E4EC6" stroke-width="2.5"/><text x="330" y="529.7" font-size="15" font-weight="700" fill="#1E1E1E" text-anchor="middle">code 481 207</text><text x="330" y="553.2" font-size="12" font-weight="400" fill="#5C5C5C" text-anchor="middle">from the shared secret</text>
<rect x="760" y="500" width="240" height="70" rx="12" fill="#E1D3FF" stroke="#8E4EC6" stroke-width="2.5"/><text x="880" y="529.7" font-size="15" font-weight="700" fill="#1E1E1E" text-anchor="middle">code 481 207</text><text x="880" y="553.2" font-size="12" font-weight="400" fill="#5C5C5C" text-anchor="middle">from the shared secret</text>
<g><circle cx="170" cy="535" r="13" fill="#1E1E1E" stroke="#1E1E1E" stroke-width="2"/><text x="170" y="539" font-size="13" font-weight="800" text-anchor="middle" fill="#FFFFFF">5</text></g>
<text x="605" y="531" font-size="13.5" font-weight="700" fill="#1E1E1E" text-anchor="middle">both screens show the same code</text>
<rect x="435" y="588" width="340" height="24" rx="9" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/><text x="605" y="605" font-size="12.5" font-weight="600" fill="#1E1E1E" text-anchor="middle">encrypted: sender&#x27;s name, file names and sizes</text>
<g><circle cx="300" cy="622" r="13" fill="#1E1E1E" stroke="#1E1E1E" stroke-width="2"/><text x="300" y="626" font-size="13" font-weight="800" text-anchor="middle" fill="#FFFFFF">6</text></g>
<rect x="414" y="668" width="382" height="24" rx="9" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/><text x="605" y="685" font-size="12.5" font-weight="600" fill="#1E1E1E" text-anchor="middle">ACCEPT or DECLINE — after comparing the code (2 min)</text>
<g><circle cx="300" cy="702" r="13" fill="#1E1E1E" stroke="#1E1E1E" stroke-width="2"/><text x="300" y="706" font-size="13" font-weight="800" text-anchor="middle" fill="#FFFFFF">7</text></g>
<rect x="389.5" y="748" width="431" height="24" rx="9" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/><text x="605" y="765" font-size="12.5" font-weight="600" fill="#1E1E1E" text-anchor="middle">the files, in encrypted 64 KiB frames → .part, then renamed</text>
<g><circle cx="300" cy="782" r="13" fill="#1E1E1E" stroke="#1E1E1E" stroke-width="2"/><text x="300" y="786" font-size="13" font-weight="800" text-anchor="middle" fill="#FFFFFF">8</text></g>
<g filter="url(#shadow)"><rect x="36" y="600" width="170" height="230" rx="3" fill="#C7E4FF"/></g><text x="50" y="624" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start">A computer in the</text><text x="50" y="642.2" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start">middle has one</text><text x="50" y="660.4" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start">chance in a</text><text x="50" y="678.6" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start">million: the sender</text><text x="50" y="696.8" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start">committed to its</text><text x="50" y="715" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start">key before seeing</text><text x="50" y="733.2" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start">the other one.</text>
<g filter="url(#shadow)"><rect x="1024" y="250" width="180" height="200" rx="3" fill="#FFE88A"/></g><text x="1038" y="274" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start">Limits: 15 s to</text><text x="1038" y="292.2" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start">finish the handshake,</text><text x="1038" y="310.4" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start">4 connections at a</text><text x="1038" y="328.6" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start">time, the files must</text><text x="1038" y="346.8" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start">fit the free space.</text>
<g filter="url(#shadow)"><rect x="1024" y="620" width="180" height="200" rx="3" fill="#FFCCE5"/></g><text x="1038" y="644" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start">Names are cleaned</text><text x="1038" y="662.2" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start"><tspan>(</tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.09">..</tspan><tspan>, absolute</tspan></text><text x="1038" y="680.4" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start">paths) and stay in</text><text x="1038" y="698.6" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start">the inbox; nothing is</text><text x="1038" y="716.8" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start">overwritten.</text>
<text x="36" y="52" font-size="26" font-weight="800" fill="#1E1E1E">Sharing nearby: how two computers agree</text><text x="36" y="80" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start">Protocol 2: X25519 and AES-256-GCM, a 6-digit code and the consent of the person who receives.</text><g transform="translate(1076,30)"><rect width="128" height="28" rx="14" fill="#FFFFFF" stroke="#E0E0E0"/><circle cx="16" cy="14" r="6" fill="#F08C00"/><text x="30" y="19" font-size="12.5" font-weight="700" fill="#1E1E1E">OctopusFile</text></g>
</svg>
