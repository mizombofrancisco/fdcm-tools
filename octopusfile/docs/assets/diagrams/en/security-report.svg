<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 500" width="1240" height="500" role="img" aria-label="Reporting a security problem" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title>Reporting a security problem</title>
<defs><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#D4D4D4"/></pattern><filter id="shadow" x="-10%" y="-10%" width="130%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#000000" flood-opacity="0.18"/></filter><marker id="arrow-1E1E1E" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1.5,1.5 L10,6 L1.5,10.5" fill="none" stroke="#1E1E1E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="1240" height="500" rx="18" fill="#F7F7F5"/><rect width="1240" height="500" rx="18" fill="url(#dots)"/><rect x="0.75" y="0.75" width="1238.5" height="498.5" rx="18" fill="none" stroke="#E0E0E0" stroke-width="1.5"/>

<path d="M236,225 L268,225 L268,162 L298,162" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
<path d="M236,255 L268,255 L268,325 L298,325" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
<path d="M560,162 L608,162" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
<path d="M840,162 L870,162 L870,220 L898,220" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
<path d="M840,325 L870,325 L870,250 L898,250" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
<path d="M1052,280 L1052,378" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#arrow-1E1E1E)"/>
<rect x="36" y="200" width="200" height="80" rx="12" fill="#FFC9C2" stroke="#E5484D" stroke-width="2.5"/><text x="136" y="234.75" font-size="15" font-weight="700" fill="#1E1E1E" text-anchor="middle">You found a</text><text x="136" y="254.25" font-size="15" font-weight="700" fill="#1E1E1E" text-anchor="middle">vulnerability</text>
<rect x="300" y="120" width="260" height="84" rx="12" fill="#C7E4FF" stroke="#0D8BF2" stroke-width="2.5"/><text x="430" y="147.45" font-size="14.5" font-weight="700" fill="#1E1E1E" text-anchor="middle">Open an issue on the</text><text x="430" y="166.3" font-size="14.5" font-weight="700" fill="#1E1E1E" text-anchor="middle">repository</text><text x="430" y="189.15" font-size="11.5" font-weight="400" fill="#5C5C5C" text-anchor="middle">WITHOUT the details</text>
<g><circle cx="304" cy="124" r="13" fill="#1E1E1E" stroke="#1E1E1E" stroke-width="2"/><text x="304" y="128" font-size="13" font-weight="800" text-anchor="middle" fill="#FFFFFF">1</text></g>
<rect x="610" y="120" width="230" height="84" rx="12" fill="#C7E4FF" stroke="#0D8BF2" stroke-width="2.5"/><text x="725" y="166.35" font-size="14.5" font-weight="700" fill="#1E1E1E" text-anchor="middle">Ask for a private contact</text>
<g><circle cx="614" cy="124" r="13" fill="#1E1E1E" stroke="#1E1E1E" stroke-width="2"/><text x="614" y="128" font-size="13" font-weight="800" text-anchor="middle" fill="#FFFFFF">2</text></g>
<rect x="300" y="290" width="540" height="70" rx="12" fill="#C2F0E6" stroke="#12A594" stroke-width="2.5"/><text x="570" y="329.35" font-size="14.5" font-weight="700" fill="#1E1E1E" text-anchor="middle">or write to the author directly</text>
<rect x="900" y="190" width="304" height="90" rx="12" fill="#CDF3C9" stroke="#30A46C" stroke-width="2.5"/><text x="1052" y="229.7" font-size="15" font-weight="700" fill="#1E1E1E" text-anchor="middle">The details, in private</text><text x="1052" y="253.2" font-size="12" font-weight="400" fill="#5C5C5C" text-anchor="middle">to the author</text>
<rect x="900" y="380" width="304" height="80" rx="12" fill="#FFD7AD" stroke="#F08C00" stroke-width="2.5"/><text x="1052" y="414.7" font-size="15" font-weight="700" fill="#1E1E1E" text-anchor="middle">A fix in a 2.0.x version</text><text x="1052" y="438.2" font-size="12" font-weight="400" fill="#5C5C5C" text-anchor="middle">LTS: security fixes until 21 Nov 2028</text>
<g filter="url(#shadow)"><rect x="36" y="396" width="804" height="70" rx="3" fill="#FFCCE5"/></g><text x="50" y="420" font-size="14.5" font-weight="400" fill="#1E1E1E" text-anchor="start">Never put the details of the vulnerability in a public issue: the issue only asks for a way to</text><text x="50" y="440.3" font-size="14.5" font-weight="400" fill="#1E1E1E" text-anchor="start">talk in private.</text>
<text x="36" y="52" font-size="26" font-weight="800" fill="#1E1E1E">Reporting a security problem</text><text x="36" y="80" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start">Keep the details private until there is a fix.</text><g transform="translate(1076,30)"><rect width="128" height="28" rx="14" fill="#FFFFFF" stroke="#E0E0E0"/><circle cx="16" cy="14" r="6" fill="#F08C00"/><text x="30" y="19" font-size="12.5" font-weight="700" fill="#1E1E1E">OctopusFile</text></g>
</svg>
