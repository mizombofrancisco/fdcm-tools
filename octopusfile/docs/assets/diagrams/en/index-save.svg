<path d="M36,150 v90 a95,10 0 0 0 190,0 v-90" fill="#C2F0E6" stroke="#12A594" stroke-width="2.5"/><ellipse cx="131" cy="150" rx="95" ry="10" fill="#C2F0E6" stroke="#12A594" stroke-width="2.5"/><text x="131" y="203.2" font-size="14" font-weight="700" fill="#1E1E1E" text-anchor="middle">Index in memory</text>
<rect x="270" y="150" width="200" height="90" rx="12" fill="#C7E4FF" stroke="#0D8BF2" stroke-width="2.5"/><text x="370" y="189.7" font-size="15" font-weight="700" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13.95">save(file)</tspan></text><text x="370" y="213.2" font-size="12" font-weight="400" fill="#5C5C5C" text-anchor="middle">searches go on meanwhile</text>
<rect x="514" y="150" width="230" height="90" rx="12" fill="#EBEBEB" stroke="#8F8F8F" stroke-width="2.5"/><text x="629" y="190.4" font-size="13" font-weight="700" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.09">.octopus-index-*.part</tspan></text><text x="629" y="211.3" font-size="10" font-weight="400" fill="#5C5C5C" text-anchor="middle">temporary file, same folder, GZIP</text>
<rect x="788" y="150" width="150" height="90" rx="12" fill="#FFD7AD" stroke="#F08C00" stroke-width="2.5"/><text x="863" y="190.05" font-size="14" font-weight="700" fill="#1E1E1E" text-anchor="middle">rename</text><text x="863" y="212.25" font-size="11" font-weight="400" fill="#5C5C5C" text-anchor="middle">atomic when possible</text>
<path d="M982,150 v90 a111,10 0 0 0 222,0 v-90" fill="#FFE88A" stroke="#E0B400" stroke-width="2.5"/><ellipse cx="1093" cy="150" rx="111" ry="10" fill="#FFE88A" stroke="#E0B400" stroke-width="2.5"/><text x="1093" y="203.5" font-size="15" font-weight="700" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13.95">home.index</tspan></text>
<rect x="60" y="340" width="130" height="50" rx="12" fill="#FFC9C2" stroke="#E5484D" stroke-width="2.5"/><text x="125" y="369.5" font-size="15" font-weight="700" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13.95">OFXI</tspan></text>
<rect x="200" y="340" width="110" height="50" rx="12" fill="#FFC9C2" stroke="#E5484D" stroke-width="2.5"/><text x="255" y="369.5" font-size="15" font-weight="700" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13.95">1</tspan></text>
<text x="320" y="362" font-size="13" font-weight="700" fill="#E5484D" text-anchor="start">magic number + format</text>
<rect x="60" y="404" width="512" height="52" rx="12" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2.5"/><text x="316" y="434.05" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="middle">root folder · saved at · excluded names</text>
<rect x="60" y="466" width="512" height="52" rx="12" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2.5"/><text x="316" y="496.05" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="middle">folders that hold items (relative paths)</text>
<rect x="60" y="528" width="512" height="52" rx="12" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2.5"/><text x="316" y="549.275" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="middle">each item: folder no. · name · flags (folder, hidden) · size ·</text><text x="316" y="566.825" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="middle">modified</text>
<g filter="url(#shadow)"><rect x="60" y="600" width="512" height="70" rx="3" fill="#EBEBEB"/></g><text x="74" y="624" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="start">Not stored: the trigram lists (rebuilt while loading) and any</text><text x="74" y="642.9" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="start">file content.</text>
<polygon points="1080,334 1184,390 1080,446 976,390" fill="#FFE88A" stroke="#E0B400" stroke-width="2.5" stroke-linejoin="round"/><text x="1080" y="385.45" font-size="13" font-weight="700" fill="#1E1E1E" text-anchor="middle">starts with OFXI,</text><text x="1080" y="402.35" font-size="13" font-weight="700" fill="#1E1E1E" text-anchor="middle">format 1?</text>
<rect x="664" y="344" width="250" height="92" rx="12" fill="#CDF3C9" stroke="#30A46C" stroke-width="2.5"/><text x="789" y="385.05" font-size="14" font-weight="700" fill="#1E1E1E" text-anchor="middle">ready to search</text><text x="789" y="407.25" font-size="11" font-weight="400" fill="#5C5C5C" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="10.23">isBuilt()</tspan><tspan> · </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="10.23">savedAt()</tspan></text>
<text x="664" y="466" font-size="12.5" font-weight="600" fill="#0D8BF2" text-anchor="start"><tspan>then </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">build</tspan><tspan> in the background to</tspan></text><text x="664" y="482.875" font-size="12.5" font-weight="600" fill="#0D8BF2" text-anchor="start">catch up with the disk</text>
<rect x="970" y="500" width="220" height="96" rx="12" fill="#FFC9C2" stroke="#E5484D" stroke-width="2.5"/><text x="1080" y="535.9" font-size="14" font-weight="700" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13.02">IOException</tspan></text><text x="1080" y="558.1" font-size="11" font-weight="400" fill="#5C5C5C" text-anchor="middle">not an index, unknown format or</text><text x="1080" y="572.4" font-size="11" font-weight="400" fill="#5C5C5C" text-anchor="middle">damaged</text>
<rect x="664" y="500" width="250" height="120" rx="12" fill="#FFD7AD" stroke="#F08C00" stroke-width="2.5"/><text x="789" y="540.75" font-size="14" font-weight="700" fill="#1E1E1E" text-anchor="middle">build a new one</text><text x="789" y="562.95" font-size="11" font-weight="400" fill="#5C5C5C" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="10.23">new FileIndex(root).build(…)</tspan><tspan>, then</tspan></text><text x="789" y="577.25" font-size="11" font-weight="400" fill="#5C5C5C" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="10.23">save</tspan><tspan> again — also after a format</tspan></text><text x="789" y="591.55" font-size="11" font-weight="400" fill="#5C5C5C" text-anchor="middle">change</text>
<rect x="926.5" y="378" width="39" height="24" rx="9" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/><text x="946" y="395" font-size="12.5" font-weight="600" fill="#1E1E1E" text-anchor="middle">yes</text>
<rect x="1064" y="460" width="32" height="24" rx="9" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/><text x="1080" y="477" font-size="12.5" font-weight="600" fill="#1E1E1E" text-anchor="middle">no</text>
<text x="664" y="662" font-size="13" font-weight="600" fill="#5C5C5C" text-anchor="start"><tspan>A crash during </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.09">save</tspan><tspan> never leaves half a file.</tspan></text>
<rect x="1057" y="268" width="46" height="24" rx="9" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/><text x="1080" y="285" font-size="12.5" font-weight="600" fill="#1E1E1E" text-anchor="middle">load</text>
<text x="36" y="52" font-size="26" font-weight="800" fill="#1E1E1E">Saving and loading the name index</text><text x="36" y="80" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13.95">save(file)</tspan><tspan> writes a GZIP file through a temporary file; </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13.95">FileIndex.load(file)</tspan><tspan> is ready to search at once.</tspan></text><g transform="translate(1076,30)"><rect width="128" height="28" rx="14" fill="#FFFFFF" stroke="#E0E0E0"/><circle cx="16" cy="14" r="6" fill="#F08C00"/><text x="30" y="19" font-size="12.5" font-weight="700" fill="#1E1E1E">OctopusFile</text></g>
</svg>
