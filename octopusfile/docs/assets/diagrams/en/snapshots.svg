<polygon points="420,400 540,465 420,530 300,465" fill="#FFE88A" stroke="#E0B400" stroke-width="2.5" stroke-linejoin="round"/><text x="420" y="469.05" font-size="13.5" font-weight="700" fill="#1E1E1E" text-anchor="middle">Content already stored?</text>
<rect x="590" y="435" width="180" height="60" rx="30" fill="#CDF3C9" stroke="#30A46C" stroke-width="2.5"/><text x="680" y="469.05" font-size="13.5" font-weight="700" fill="#1E1E1E" text-anchor="middle">Skip — stored once</text>
<rect x="320" y="570" width="200" height="80" rx="12" fill="#FFD7AD" stroke="#F08C00" stroke-width="2.5"/><text x="420" y="605.05" font-size="14" font-weight="700" fill="#1E1E1E" text-anchor="middle">Compress</text><text x="420" y="627.25" font-size="11" font-weight="400" fill="#5C5C5C" text-anchor="middle">Deflate; not JPEG, MP4, ZIP…</text>
<rect x="570" y="570" width="200" height="80" rx="12" fill="#E1D3FF" stroke="#8E4EC6" stroke-width="2.5"/><text x="670" y="597.9" font-size="14" font-weight="700" fill="#1E1E1E" text-anchor="middle">Encrypt</text><text x="670" y="620.1" font-size="11" font-weight="400" fill="#5C5C5C" text-anchor="middle">AES-256-GCM, 1 MiB blocks</text><text x="670" y="634.4" font-size="11" font-weight="400" fill="#5C5C5C" text-anchor="middle">(with a password)</text>
