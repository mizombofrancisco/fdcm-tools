<rect x="842" y="160" width="340" height="58" rx="12" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2.5"/><text x="1012" y="184.225" font-size="13.5" font-weight="700" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.555">octopus-backup.properties</tspan></text><text x="1012" y="205.775" font-size="10.5" font-weight="400" fill="#5C5C5C" text-anchor="middle">settings, salt</text>
<rect x="842" y="232" width="340" height="58" rx="12" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2.5"/><text x="1012" y="256.225" font-size="13.5" font-weight="700" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.555">objects/ab/&lt;id&gt;</tspan></text><text x="1012" y="277.775" font-size="10.5" font-weight="400" fill="#5C5C5C" text-anchor="middle">each content once</text>
<rect x="842" y="304" width="340" height="58" rx="12" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2.5"/><text x="1012" y="328.225" font-size="13.5" font-weight="700" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.555">snapshots/&lt;time&gt;-&lt;id&gt;.snap</tspan></text><text x="1012" y="349.775" font-size="10.5" font-weight="400" fill="#5C5C5C" text-anchor="middle">names, sizes, dates</text>
<rect x="842" y="376" width="340" height="58" rx="12" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2.5"/><text x="1012" y="400.225" font-size="13.5" font-weight="700" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.555">lock</tspan></text><text x="1012" y="421.775" font-size="10.5" font-weight="400" fill="#5C5C5C" text-anchor="middle">one writer at a time</text>
<text x="590" y="252" font-size="12.5" font-weight="600" fill="#5C5C5C" text-anchor="start">both: listed in the new</text><text x="590" y="268.875" font-size="12.5" font-weight="600" fill="#5C5C5C" text-anchor="start">snapshot</text>
<text x="842" y="546" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="start"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.555">push</tspan><tspan>: objects first, snapshots last,</tspan></text>
<text x="842" y="567" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="start">temporary names, then rename;</text>
<text x="842" y="588" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="start"><tspan>mirrors </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.555">prune</tspan></text>
<text x="842" y="619" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="start"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.555">pull</tspan><tspan>: brings a repository to another</tspan></text>
<text x="842" y="640" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="start">computer — still encrypted</text>
<rect x="964.5" y="473" width="95" height="24" rx="9" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/><text x="1012" y="490" font-size="12.5" font-weight="600" fill="#1E1E1E" text-anchor="middle">push / pull</text>
<text x="36" y="52" font-size="26" font-weight="800" fill="#1E1E1E">Snapshot backups: incremental, deduplicated, encrypted</text><text x="36" y="80" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13.95">SnapshotRepository.backup</tspan><tspan> records the whole folder but stores only content the repository does not have.</tspan></text><g transform="translate(1076,30)"><rect width="128" height="28" rx="14" fill="#FFFFFF" stroke="#E0E0E0"/><circle cx="16" cy="14" r="6" fill="#F08C00"/><text x="30" y="19" font-size="12.5" font-weight="700" fill="#1E1E1E">OctopusFile</text></g>
</svg>
