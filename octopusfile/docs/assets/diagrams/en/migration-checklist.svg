<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 580" width="1240" height="580" role="img" aria-label="Migration checklist" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title>Migration checklist</title>
<defs><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#D4D4D4"/></pattern><filter id="shadow" x="-10%" y="-10%" width="130%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#000000" flood-opacity="0.18"/></filter><marker id="arrow-1E1E1E" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1.5,1.5 L10,6 L1.5,10.5" fill="none" stroke="#1E1E1E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="1240" height="580" rx="18" fill="#F7F7F5"/><rect width="1240" height="580" rx="18" fill="url(#dots)"/><rect x="0.75" y="0.75" width="1238.5" height="578.5" rx="18" fill="none" stroke="#E0E0E0" stroke-width="1.5"/>

<path d="M366,190 L453,190" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
<path d="M785,190 L872,190" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
<path d="M1039,250 L1039,318" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
<path d="M874,380 L787,380" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
<path d="M455,380 L300,380" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
<rect x="36" y="130" width="330" height="120" rx="12" fill="#FFE88A" stroke="#E0B400" stroke-width="2.5"/><text x="201" y="176.4" font-size="15.5" font-weight="700" fill="#1E1E1E" text-anchor="middle">Compile against 1.4.1</text><text x="201" y="200.55" font-size="12.5" font-weight="400" fill="#5C5C5C" text-anchor="middle"><tspan>with </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">-Xlint:removal</tspan><tspan>; replace every use it</tspan></text><text x="201" y="216.8" font-size="12.5" font-weight="400" fill="#5C5C5C" text-anchor="middle">reports</text>
<g><circle cx="40" cy="134" r="13" fill="#1E1E1E" stroke="#1E1E1E" stroke-width="2"/><text x="40" y="138" font-size="13" font-weight="800" text-anchor="middle" fill="#FFFFFF">1</text></g>
<rect x="455" y="130" width="330" height="120" rx="12" fill="#C7E4FF" stroke="#0D8BF2" stroke-width="2.5"/><text x="620" y="184.525" font-size="15.5" font-weight="700" fill="#1E1E1E" text-anchor="middle">Java 17 and the 2.0 JAR</text><text x="620" y="208.675" font-size="12.5" font-weight="400" fill="#5C5C5C" text-anchor="middle">Java 17 or newer</text>
<g><circle cx="459" cy="134" r="13" fill="#1E1E1E" stroke="#1E1E1E" stroke-width="2"/><text x="459" y="138" font-size="13" font-weight="800" text-anchor="middle" fill="#FFFFFF">2</text></g>
<rect x="874" y="130" width="330" height="120" rx="12" fill="#E1D3FF" stroke="#8E4EC6" stroke-width="2.5"/><text x="1039" y="176.4" font-size="15.5" font-weight="700" fill="#1E1E1E" text-anchor="middle">Rename four classes</text><text x="1039" y="200.55" font-size="12.5" font-weight="400" fill="#5C5C5C" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">FileReader</tspan><tspan>, </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">BufferedReader</tspan><tspan>,</tspan></text><text x="1039" y="216.8" font-size="12.5" font-weight="400" fill="#5C5C5C" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">FileWriter</tspan><tspan>, </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">BufferedWriter</tspan><tspan>: imports only</tspan></text>
<g><circle cx="878" cy="134" r="13" fill="#1E1E1E" stroke="#1E1E1E" stroke-width="2"/><text x="878" y="138" font-size="13" font-weight="800" text-anchor="middle" fill="#FFFFFF">3</text></g>
<rect x="874" y="320" width="330" height="120" rx="12" fill="#FFD7AD" stroke="#F08C00" stroke-width="2.5"/><text x="1039" y="366.4" font-size="15.5" font-weight="700" fill="#1E1E1E" text-anchor="middle">Catch or declare IOException</text><text x="1039" y="390.55" font-size="12.5" font-weight="400" fill="#5C5C5C" text-anchor="middle">around module classes; keep</text><text x="1039" y="406.8" font-size="12.5" font-weight="400" fill="#5C5C5C" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">OctopusFileException</tspan><tspan> around the facade</tspan></text>
<g><circle cx="878" cy="324" r="13" fill="#1E1E1E" stroke="#1E1E1E" stroke-width="2"/><text x="878" y="328" font-size="13" font-weight="800" text-anchor="middle" fill="#FFFFFF">4</text></g>
<rect x="455" y="320" width="330" height="120" rx="12" fill="#C2F0E6" stroke="#12A594" stroke-width="2.5"/><text x="620" y="366.4" font-size="15.5" font-weight="700" fill="#1E1E1E" text-anchor="middle">Nothing to do for your data</text><text x="620" y="390.55" font-size="12.5" font-weight="400" fill="#5C5C5C" text-anchor="middle">vaults, encrypted files, snapshots, indexes,</text><text x="620" y="406.8" font-size="12.5" font-weight="400" fill="#5C5C5C" text-anchor="middle">secrets, trash of 1.x open as they are</text>
<g><circle cx="459" cy="324" r="13" fill="#1E1E1E" stroke="#1E1E1E" stroke-width="2"/><text x="459" y="328" font-size="13" font-weight="800" text-anchor="middle" fill="#FFFFFF">5</text></g>
<rect x="60" y="345" width="238" height="70" rx="35" fill="#CDF3C9" stroke="#30A46C" stroke-width="2.5"/><text x="179" y="384.8" font-size="16" font-weight="700" fill="#1E1E1E" text-anchor="middle">Your code on 2.0</text>
<g filter="url(#shadow)"><rect x="874" y="470" width="330" height="84" rx="3" fill="#FFCCE5"/></g><text x="888" y="494" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="start"><tspan>It still compiles: a </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.555">catch</tspan></text><text x="888" y="512.9" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="start"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.555">(OctopusFileException e)</tspan><tspan> around a</tspan></text><text x="888" y="531.8" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="start">module class catches nothing now.</text>
<g filter="url(#shadow)"><rect x="455" y="470" width="390" height="84" rx="3" fill="#C2F0E6"/></g><text x="469" y="494" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="start">Tested with files written by the real 1.2.0 and</text><text x="469" y="512.9" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="start"><tspan>1.4.1 JARs (</tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.555">FormatCompatibilityTest</tspan><tspan>).</tspan></text>
<text x="36" y="52" font-size="26" font-weight="800" fill="#1E1E1E">Migration checklist</text><text x="36" y="80" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start">Five steps from a 1.x project to 2.0, in this order.</text><g transform="translate(1076,30)"><rect width="128" height="28" rx="14" fill="#FFFFFF" stroke="#E0E0E0"/><circle cx="16" cy="14" r="6" fill="#F08C00"/><text x="30" y="19" font-size="12.5" font-weight="700" fill="#1E1E1E">OctopusFile</text></g>
</svg>
