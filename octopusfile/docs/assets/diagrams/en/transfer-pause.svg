<path d="M720,232 L958,263" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
<path d="M720,250 L958,339" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
<path d="M120,268 L120,466 L328,466" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
<path d="M328,424 L210,424 L210,270" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#arrow-1E1E1E)"/>
<path d="M690,268 L690,466 L612,466" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
<path d="M612,424 L560,424 L560,270" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#arrow-1E1E1E)"/>
<path d="M470,488 L470,536 L1065,536 L1065,368" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
<rect x="70" y="196" width="200" height="72" rx="12" fill="#EBEBEB" stroke="#8F8F8F" stroke-width="2.5"/><text x="170" y="218.9" font-size="15" font-weight="700" fill="#1E1E1E" text-anchor="middle">QUEUED</text><text x="170" y="242.4" font-size="12" font-weight="400" fill="#5C5C5C" text-anchor="middle">waits for one of the 2</text><text x="170" y="258" font-size="12" font-weight="400" fill="#5C5C5C" text-anchor="middle">workers</text>
<rect x="500" y="196" width="220" height="72" rx="12" fill="#C7E4FF" stroke="#0D8BF2" stroke-width="2.5"/><text x="610" y="226.7" font-size="15" font-weight="700" fill="#1E1E1E" text-anchor="middle">RUNNING</text><text x="610" y="250.2" font-size="12" font-weight="400" fill="#5C5C5C" text-anchor="middle">a worker runs it</text>
<rect x="960" y="160" width="210" height="54" rx="12" fill="#CDF3C9" stroke="#30A46C" stroke-width="2.5"/><text x="1065" y="182.05" font-size="14" font-weight="700" fill="#1E1E1E" text-anchor="middle">DONE</text><text x="1065" y="204.25" font-size="11" font-weight="400" fill="#5C5C5C" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="10.23">getResult()</tspan></text>
<rect x="960" y="236" width="210" height="54" rx="12" fill="#FFC9C2" stroke="#E5484D" stroke-width="2.5"/><text x="1065" y="258.05" font-size="14" font-weight="700" fill="#1E1E1E" text-anchor="middle">FAILED</text><text x="1065" y="280.25" font-size="11" font-weight="400" fill="#5C5C5C" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="10.23">getError()</tspan></text>
<rect x="960" y="312" width="210" height="54" rx="12" fill="#FFD7AD" stroke="#F08C00" stroke-width="2.5"/><text x="1065" y="334.05" font-size="14" font-weight="700" fill="#1E1E1E" text-anchor="middle">CANCELLED</text><text x="1065" y="356.25" font-size="11" font-weight="400" fill="#5C5C5C" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="10.23">cancel()</tspan></text>
<rect x="319" y="200" width="130" height="24" rx="9" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/><text x="384" y="217" font-size="12.5" font-weight="600" fill="#1E1E1E" text-anchor="middle">a worker is free</text>
<text x="1052" y="392" font-size="12.5" font-weight="700" fill="#5C5C5C" text-anchor="end"><tspan>finished: </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">isFinished()</tspan></text>
<rect x="330" y="404" width="280" height="84" rx="12" fill="#E1D3FF" stroke="#8E4EC6" stroke-width="2.5"/><text x="470" y="440.35" font-size="16" font-weight="700" fill="#1E1E1E" text-anchor="middle">PAUSED</text><text x="470" y="465.15" font-size="13" font-weight="400" fill="#5C5C5C" text-anchor="middle">new in 2.1 · speed 0, time left -1</text>
<rect x="138.5" y="434" width="151" height="24" rx="9" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/><text x="214" y="451" font-size="12.5" font-weight="600" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">pause()</tspan><tspan> — at once</tspan></text>
<rect x="172.5" y="288" width="179" height="24" rx="9" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/><text x="262" y="305" font-size="12.5" font-weight="600" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">resume()</tspan><tspan> — same place</tspan></text>
<rect x="696.5" y="368" width="207" height="24" rx="9" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/><text x="800" y="385" font-size="12.5" font-weight="600" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">pause()</tspan><tspan> — next safe point</tspan></text>
<rect x="561" y="288" width="158" height="24" rx="9" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/><text x="640" y="305" font-size="12.5" font-weight="600" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">resume()</tspan><tspan> — goes on</tspan></text>
<rect x="686" y="506" width="228" height="24" rx="9" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/><text x="800" y="523" font-size="12.5" font-weight="600" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">cancel()</tspan><tspan> — also while paused</tspan></text>
<g filter="url(#shadow)"><rect x="850" y="410" width="190" height="96" rx="3" fill="#FFE88A"/></g><text x="864" y="434" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="start"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">isPauseRequested()</tspan><tspan>:</tspan></text><text x="864" y="451.5" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="start"><tspan>true from </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">pause()</tspan><tspan> to</tspan></text><text x="864" y="469" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="start"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">resume()</tspan></text>
<g filter="url(#shadow)"><rect x="60" y="652" width="266" height="132" rx="3" fill="#CDF3C9"/></g><text x="74" y="676" font-size="13" font-weight="700" fill="#1E1E1E">copy</text><text x="74" y="696.225" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="start">before the next item and after</text><text x="74" y="713.725" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="start">every 1 MB block: the half-written</text><text x="74" y="731.225" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="start">file goes on from the same byte</text>
<g filter="url(#shadow)"><rect x="344" y="652" width="266" height="132" rx="3" fill="#FFE88A"/></g><text x="358" y="676" font-size="13" font-weight="700" fill="#1E1E1E">upload</text><text x="358" y="696.225" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="start">between files only: a request</text><text x="358" y="713.725" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="start">never waits half way</text>
<g filter="url(#shadow)"><rect x="628" y="652" width="266" height="132" rx="3" fill="#FFCCE5"/></g><text x="642" y="676" font-size="13" font-weight="700" fill="#1E1E1E">pushSnapshots</text><text x="642" y="696.225" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="start">only while queued; once running,</text><text x="642" y="713.725" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="start">the pause stays requested</text>
<g filter="url(#shadow)"><rect x="912" y="652" width="266" height="132" rx="3" fill="#FFD7AD"/></g><text x="926" y="676" font-size="13" font-weight="700" fill="#1E1E1E">downloads, pullSnapshots</text><text x="926" y="696.225" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="start">after the next block; the</text><text x="926" y="713.725" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="start">connection stays open (a server</text><text x="926" y="731.225" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="start">may close it)</text>
<g filter="url(#shadow)"><rect x="60" y="800" width="266" height="132" rx="3" fill="#C7E4FF"/></g><text x="74" y="824" font-size="13" font-weight="700" fill="#1E1E1E">snapshot, restore,</text><text x="74" y="842" font-size="13" font-weight="700" fill="#1E1E1E">restoreVersion</text><text x="74" y="862.45" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="start">at the next progress report; the</text><text x="74" y="879.95" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="start">repository stays busy</text>
<g filter="url(#shadow)"><rect x="344" y="800" width="266" height="132" rx="3" fill="#C2F0E6"/></g><text x="358" y="824" font-size="13" font-weight="700" fill="#1E1E1E">searchContent</text><text x="358" y="844.225" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="start">only when it reports a match</text>
<g filter="url(#shadow)"><rect x="628" y="800" width="266" height="132" rx="3" fill="#C2F0E6"/></g><text x="642" y="824" font-size="13" font-weight="700" fill="#1E1E1E">buildIndex, findDuplicates</text><text x="642" y="844.225" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="start">at the next progress report (every</text><text x="642" y="861.725" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="start">few thousand names)</text>
<g filter="url(#shadow)"><rect x="912" y="800" width="266" height="132" rx="3" fill="#EBEBEB"/></g><text x="926" y="824" font-size="13" font-weight="700" fill="#1E1E1E">task(...)</text><text x="926" y="844.225" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="start"><tspan>in </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">checkCancel()</tspan><tspan> and</tspan></text><text x="926" y="861.725" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="start"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">cancelled()</tspan><tspan>; never called → only</tspan></text><text x="926" y="879.225" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="start">while queued</text>
<text x="36" y="52" font-size="26" font-weight="800" fill="#1E1E1E">Pause and resume: the states of a Transfer since 2.1</text><text x="36" y="80" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13.95">pause()</tspan><tspan>, </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13.95">resume()</tspan><tspan>, </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13.95">TransferManager.pauseAll()</tspan><tspan> / </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13.95">resumeAll()</tspan><tspan> — </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13.95">PAUSED</tspan><tspan> is not a finished state.</tspan></text><g transform="translate(1076,30)"><rect width="128" height="28" rx="14" fill="#FFFFFF" stroke="#E0E0E0"/><circle cx="16" cy="14" r="6" fill="#F08C00"/><text x="30" y="19" font-size="12.5" font-weight="700" fill="#1E1E1E">OctopusFile</text></g>
</svg>
