<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 990" width="1240" height="990" role="img" aria-label="Pause and resume: the states of a Transfer since 2.1" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title>Pause and resume: the states of a Transfer since 2.1</title>
<defs><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#D4D4D4"/></pattern><filter id="shadow" x="-10%" y="-10%" width="130%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#000000" flood-opacity="0.18"/></filter><marker id="arrow-1E1E1E" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1.5,1.5 L10,6 L1.5,10.5" fill="none" stroke="#1E1E1E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="1240" height="990" rx="18" fill="#F7F7F5"/><rect width="1240" height="990" rx="18" fill="url(#dots)"/><rect x="0.75" y="0.75" width="1238.5" height="988.5" rx="18" fill="none" stroke="#E0E0E0" stroke-width="1.5"/>
<g><rect x="36" y="130" width="1168" height="440" rx="14" fill="#C7E4FF" fill-opacity="0.38" stroke="#0D8BF2" stroke-width="1.5" stroke-dasharray="0"/><rect x="48" y="117" width="73" height="26" rx="8" fill="#0D8BF2"/><text x="62" y="134" font-size="13" font-weight="700" fill="#FFFFFF">States</text></g>
<g><rect x="36" y="620" width="1168" height="340" rx="14" fill="#E1D3FF" fill-opacity="0.38" stroke="#8E4EC6" stroke-width="1.5" stroke-dasharray="0"/><rect x="48" y="607" width="362" height="26" rx="8" fill="#8E4EC6"/><text x="62" y="624" font-size="13" font-weight="700" fill="#FFFFFF">Where a running job pauses (its safe points)</text></g>
<path d="M270,232 L498,232" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
