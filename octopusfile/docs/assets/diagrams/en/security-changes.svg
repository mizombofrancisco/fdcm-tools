<path d="M620,656 L620,698" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
<path d="M1016,656 L1016,698" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
<rect x="52" y="160" width="236" height="72" rx="12" fill="#FFC9C2" stroke="#E5484D" stroke-width="2.5"/><text x="170" y="183.5" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="middle">both keys sent at once: a</text><text x="170" y="199.75" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="middle">computer in the middle could</text><text x="170" y="216" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="middle">try millions of keys</text>
<rect x="328" y="160" width="268" height="72" rx="12" fill="#CDF3C9" stroke="#30A46C" stroke-width="2.5"/><text x="462" y="183.5" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="middle">commitment: hash of the key first,</text><text x="462" y="199.75" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="middle">reveal after; one chance in a</text><text x="462" y="216" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="middle">million</text>
<rect x="52" y="244" width="236" height="72" rx="12" fill="#FFC9C2" stroke="#E5484D" stroke-width="2.5"/><text x="170" y="275.625" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="middle">a silent connection held a</text><text x="170" y="291.875" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="middle">thread forever</text>
<rect x="328" y="244" width="268" height="72" rx="12" fill="#CDF3C9" stroke="#30A46C" stroke-width="2.5"/><text x="462" y="275.625" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="middle">15 s for the handshake, at most 4</text><text x="462" y="291.875" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="middle">connections, socket always closed</text>
<rect x="52" y="328" width="236" height="72" rx="12" fill="#FFC9C2" stroke="#E5484D" stroke-width="2.5"/><text x="170" y="351.5" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="middle"><tspan>received into </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">name.part</tspan><tspan>:</tspan></text><text x="170" y="367.75" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="middle">truncated a user&#x27;s file of</text><text x="170" y="384" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="middle">that name</text>
<rect x="328" y="328" width="268" height="72" rx="12" fill="#CDF3C9" stroke="#30A46C" stroke-width="2.5"/><text x="462" y="351.5" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="middle"><tspan>a new hidden </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">.part</tspan><tspan>; must fit the</tspan></text><text x="462" y="367.75" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="middle"><tspan>free space; </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">CON</tspan><tspan>, </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">NUL</tspan><tspan>, </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">COM1</tspan><tspan>…</tspan></text><text x="462" y="384" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="middle">cleaned</text>
<g filter="url(#shadow)"><rect x="52" y="410" width="552" height="70" rx="3" fill="#FFE88A"/></g><text x="66" y="434" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start"><tspan>This is protocol 2 (</tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.09">FILEEXP-LAN2</tspan><tspan>, </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.09">FXL2</tspan><tspan>). Computers with version 1 are</tspan></text><text x="66" y="452.2" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start">refused with a clear message.</text>
<rect x="652" y="160" width="226" height="72" rx="12" fill="#FFC9C2" stroke="#E5484D" stroke-width="2.5"/><text x="765" y="183.5" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="middle">password change: files moved</text><text x="765" y="199.75" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="middle">one by one; a crash could</text><text x="765" y="216" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="middle">lose them</text>
<rect x="918" y="160" width="262" height="72" rx="12" fill="#CDF3C9" stroke="#30A46C" stroke-width="2.5"/><text x="1049" y="183.5" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="middle">one commit point:</text><text x="1049" y="199.75" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">vault.properties</tspan><tspan> replaced;</tspan></text><text x="1049" y="216" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">unlock</tspan><tspan> finishes or undoes</tspan></text>
<rect x="652" y="244" width="226" height="72" rx="12" fill="#FFC9C2" stroke="#E5484D" stroke-width="2.5"/><text x="765" y="275.625" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="middle">decrypted copies written to a</text><text x="765" y="291.875" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="middle">temporary folder</text>
<rect x="918" y="244" width="262" height="72" rx="12" fill="#CDF3C9" stroke="#30A46C" stroke-width="2.5"/><text x="1049" y="275.625" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="middle">re-encrypted block by block in</text><text x="1049" y="291.875" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="middle"><tspan>memory (</tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">id.new</tspan><tspan>)</tspan></text>
<rect x="652" y="328" width="226" height="72" rx="12" fill="#FFC9C2" stroke="#E5484D" stroke-width="2.5"/><text x="765" y="359.625" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="middle">an absurd number of</text><text x="765" y="375.875" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="middle"><tspan>iterations hung </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">unlock</tspan></text>
<rect x="918" y="328" width="262" height="72" rx="12" fill="#CDF3C9" stroke="#30A46C" stroke-width="2.5"/><text x="1049" y="359.625" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="middle">outside 100 000 – 10 000 000:</text><text x="1049" y="375.875" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="middle">refused as damage</text>
<rect x="652" y="412" width="226" height="72" rx="12" fill="#FFC9C2" stroke="#E5484D" stroke-width="2.5"/><text x="765" y="443.625" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">extract</tspan><tspan> wrote to</tspan></text><text x="765" y="459.875" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">name.part</tspan></text>
<rect x="918" y="412" width="262" height="72" rx="12" fill="#CDF3C9" stroke="#30A46C" stroke-width="2.5"/><text x="1049" y="443.625" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="middle">a new temporary file, renamed</text><text x="1049" y="459.875" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="middle">after every block was verified</text>
<rect x="52" y="588" width="344" height="66" rx="12" fill="#FFC9C2" stroke="#E5484D" stroke-width="2.5"/><text x="224" y="616.625" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="middle">the whole file in memory (one GCM message);</text><text x="224" y="632.875" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="middle">wrong password: partial or empty target</text>
<rect x="52" y="700" width="344" height="84" rx="12" fill="#CDF3C9" stroke="#30A46C" stroke-width="2.5"/><text x="224" y="729.5" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="middle">format 2 in 1 MiB blocks; the target appears</text><text x="224" y="745.75" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="middle">only after everything was verified; format 1</text><text x="224" y="762" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="middle">still opens</text>
<rect x="448" y="588" width="344" height="66" rx="12" fill="#FFC9C2" stroke="#E5484D" stroke-width="2.5"/><text x="620" y="616.625" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="middle">a damaged key file was silently replaced:</text><text x="620" y="632.875" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="middle">every saved secret lost</text>
<rect x="448" y="700" width="344" height="84" rx="12" fill="#CDF3C9" stroke="#30A46C" stroke-width="2.5"/><text x="620" y="737.625" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="middle">an error, and the file is kept; a new key file</text><text x="620" y="753.875" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="middle">is private from the first byte</text>
<rect x="844" y="588" width="344" height="66" rx="12" fill="#FFC9C2" stroke="#E5484D" stroke-width="2.5"/><text x="1016" y="616.625" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="middle">macOS: the password in the arguments of</text><text x="1016" y="632.875" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">osascript</tspan><tspan>, visible in </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">ps</tspan></text>
<rect x="844" y="700" width="344" height="84" rx="12" fill="#CDF3C9" stroke="#30A46C" stroke-width="2.5"/><text x="1016" y="729.5" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="middle">the script goes through standard input; output</text><text x="1016" y="745.75" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="middle">read while running; password removed from</text><text x="1016" y="762" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="middle">errors</text>
<text x="36" y="52" font-size="26" font-weight="800" fill="#1E1E1E">Changes in 1.3: before → after</text><text x="36" y="80" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start">Red: how it was before the review. Green: how the code works since 1.3.</text><g transform="translate(1076,30)"><rect width="128" height="28" rx="14" fill="#FFFFFF" stroke="#E0E0E0"/><circle cx="16" cy="14" r="6" fill="#F08C00"/><text x="30" y="19" font-size="12.5" font-weight="700" fill="#1E1E1E">OctopusFile</text></g>
</svg>
