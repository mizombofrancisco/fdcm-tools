<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 480" width="1240" height="480" role="img" aria-label="The road to 2.0.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title>The road to 2.0.0</title>
<defs><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#D4D4D4"/></pattern><filter id="shadow" x="-10%" y="-10%" width="130%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#000000" flood-opacity="0.18"/></filter><marker id="arrow-1E1E1E" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1.5,1.5 L10,6 L1.5,10.5" fill="none" stroke="#1E1E1E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="1240" height="480" rx="18" fill="#F7F7F5"/><rect width="1240" height="480" rx="18" fill="url(#dots)"/><rect x="0.75" y="0.75" width="1238.5" height="478.5" rx="18" fill="none" stroke="#E0E0E0" stroke-width="1.5"/>

<path d="M306,160 L334,160" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
<path d="M606,160 L634,160" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
<path d="M906,160 L934,160" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
<rect x="36" y="130" width="268" height="60" rx="30" fill="#FFE88A" stroke="#E0B400" stroke-width="2.5"/><text x="170" y="165.1" font-size="17" font-weight="700" fill="#1E1E1E" text-anchor="middle">2.0.0-alpha</text>
<g><rect x="46" y="206" width="108" height="24" rx="12" fill="#EBEBEB" stroke="#8F8F8F" stroke-width="1.5"/><text x="100.2" y="222" font-size="12" font-weight="700" text-anchor="middle" fill="#1E1E1E">alpha.1 done</text></g>
<g filter="url(#shadow)"><rect x="36" y="250" width="268" height="196" rx="3" fill="#FFE88A"/></g><text x="50" y="274" font-size="14" font-weight="400" fill="#1E1E1E" text-anchor="start">API cleanup:</text><text x="50" y="293.6" font-size="14" font-weight="400" fill="#1E1E1E" text-anchor="start">• removed classes</text><text x="50" y="313.2" font-size="14" font-weight="400" fill="#1E1E1E" text-anchor="start"><tspan>(</tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13.02">FileManager</tspan><tspan>,</tspan></text><text x="50" y="332.8" font-size="14" font-weight="400" fill="#1E1E1E" text-anchor="start"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13.02">DirectoryManager</tspan><tspan>…)</tspan></text><text x="50" y="352.4" font-size="14" font-weight="400" fill="#1E1E1E" text-anchor="start"><tspan>• new names: </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13.02">FileReader</tspan><tspan> →</tspan></text><text x="50" y="372" font-size="14" font-weight="400" fill="#1E1E1E" text-anchor="start"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13.02">WholeFileReader</tspan><tspan>…</tspan></text><text x="50" y="391.6" font-size="14" font-weight="400" fill="#1E1E1E" text-anchor="start">• internal types out of the</text><text x="50" y="411.2" font-size="14" font-weight="400" fill="#1E1E1E" text-anchor="start">public API</text>
<rect x="336" y="130" width="268" height="60" rx="30" fill="#C7E4FF" stroke="#0D8BF2" stroke-width="2.5"/><text x="470" y="165.1" font-size="17" font-weight="700" fill="#1E1E1E" text-anchor="middle">2.0.0-beta</text>
<g><rect x="346" y="206" width="101" height="24" rx="12" fill="#EBEBEB" stroke="#8F8F8F" stroke-width="1.5"/><text x="396.6" y="222" font-size="12" font-weight="700" text-anchor="middle" fill="#1E1E1E">beta.1 done</text></g>
<g filter="url(#shadow)"><rect x="336" y="250" width="268" height="196" rx="3" fill="#C7E4FF"/></g><text x="350" y="274" font-size="14" font-weight="400" fill="#1E1E1E" text-anchor="start"><tspan>• </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13.02">Transfer</tspan><tspan> (progress, cancel)</tspan></text><text x="350" y="293.6" font-size="14" font-weight="400" fill="#1E1E1E" text-anchor="start">for every long operation</text><text x="350" y="313.2" font-size="14" font-weight="400" fill="#1E1E1E" text-anchor="start">• snapshot repositories on</text><text x="350" y="332.8" font-size="14" font-weight="400" fill="#1E1E1E" text-anchor="start">WebDAV</text><text x="350" y="352.4" font-size="14" font-weight="400" fill="#1E1E1E" text-anchor="start">• one rule for errors</text>
<rect x="636" y="130" width="268" height="60" rx="30" fill="#E1D3FF" stroke="#8E4EC6" stroke-width="2.5"/><text x="770" y="165.1" font-size="17" font-weight="700" fill="#1E1E1E" text-anchor="middle">2.0.0-rc</text>
<g><rect x="646" y="206" width="86" height="24" rx="12" fill="#EBEBEB" stroke="#8F8F8F" stroke-width="1.5"/><text x="689.4" y="222" font-size="12" font-weight="700" text-anchor="middle" fill="#1E1E1E">rc.1 done</text></g>
<g filter="url(#shadow)"><rect x="636" y="250" width="268" height="196" rx="3" fill="#E1D3FF"/></g><text x="650" y="274" font-size="14" font-weight="400" fill="#1E1E1E" text-anchor="start">• API frozen</text><text x="650" y="293.6" font-size="14" font-weight="400" fill="#1E1E1E" text-anchor="start">• every file format tested with</text><text x="650" y="313.2" font-size="14" font-weight="400" fill="#1E1E1E" text-anchor="start">files written by 1.x</text><text x="650" y="332.8" font-size="14" font-weight="400" fill="#1E1E1E" text-anchor="start">• complete Javadoc</text><text x="650" y="352.4" font-size="14" font-weight="400" fill="#1E1E1E" text-anchor="start">• final migration guide</text>
<rect x="936" y="130" width="268" height="60" rx="30" fill="#CDF3C9" stroke="#30A46C" stroke-width="2.5"/><text x="1070" y="165.1" font-size="17" font-weight="700" fill="#1E1E1E" text-anchor="middle">2.0.0</text>
<g><rect x="946" y="206" width="166" height="24" rx="12" fill="#CDF3C9" stroke="#30A46C" stroke-width="1.5"/><text x="1029" y="222" font-size="12" font-weight="700" text-anchor="middle" fill="#1E1E1E">released 21 Nov 2026</text></g>
<g filter="url(#shadow)"><rect x="936" y="250" width="268" height="196" rx="3" fill="#CDF3C9"/></g><text x="950" y="274" font-size="14" font-weight="400" fill="#1E1E1E" text-anchor="start">• the release</text><text x="950" y="293.6" font-size="14" font-weight="400" fill="#1E1E1E" text-anchor="start">• start of the 2 years of</text><text x="950" y="313.2" font-size="14" font-weight="400" fill="#1E1E1E" text-anchor="start">support</text><text x="950" y="332.8" font-size="14" font-weight="400" fill="#1E1E1E" text-anchor="start"><tspan>• the </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13.02">lts/2.0</tspan><tspan> branch begins</tspan></text>
<text x="36" y="52" font-size="26" font-weight="800" fill="#1E1E1E">The road to 2.0.0</text><text x="36" y="80" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start">Four phases; each one has a single published version, and all four are done.</text><g transform="translate(1076,30)"><rect width="128" height="28" rx="14" fill="#FFFFFF" stroke="#E0E0E0"/><circle cx="16" cy="14" r="6" fill="#F08C00"/><text x="30" y="19" font-size="12.5" font-weight="700" fill="#1E1E1E">OctopusFile</text></g>
</svg>
