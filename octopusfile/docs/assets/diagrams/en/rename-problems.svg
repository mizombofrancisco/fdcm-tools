<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 720" width="1240" height="720" role="img" aria-label="The problems the plan finds" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title>The problems the plan finds</title>
<defs><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#D4D4D4"/></pattern><filter id="shadow" x="-10%" y="-10%" width="130%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#000000" flood-opacity="0.18"/></filter><marker id="arrow-1E1E1E" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1.5,1.5 L10,6 L1.5,10.5" fill="none" stroke="#1E1E1E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="1240" height="720" rx="18" fill="#F7F7F5"/><rect width="1240" height="720" rx="18" fill="url(#dots)"/><rect x="0.75" y="0.75" width="1238.5" height="718.5" rx="18" fill="none" stroke="#E0E0E0" stroke-width="1.5"/>

<path d="M376,153 L428,153" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
<path d="M226,210 L226,232" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
<path d="M376,257 L428,257" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
<path d="M226,314 L226,336" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
<path d="M376,361 L428,361" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
<path d="M226,418 L226,440" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
<path d="M376,465 L428,465" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
<path d="M226,522 L226,544" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
<path d="M376,569 L428,569" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
<path d="M226,626 L226,654" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
<g><circle cx="50" cy="170" r="13" fill="#1E1E1E" stroke="#1E1E1E" stroke-width="2"/><text x="50" y="174" font-size="13" font-weight="800" text-anchor="middle" fill="#FFFFFF">1</text></g>
<rect x="76" y="130" width="300" height="80" rx="12" fill="#E1D3FF" stroke="#8E4EC6" stroke-width="2.5"/><text x="226" y="174.2" font-size="14" font-weight="700" fill="#1E1E1E" text-anchor="middle">The find pattern compiles?</text>
<rect x="430" y="136" width="201" height="34" rx="17" fill="#FFC9C2" stroke="#E5484D" stroke-width="2.5"/><text x="530.8" y="156.6" font-size="12" font-weight="400" fill="#1E1E1E" text-anchor="middle">Invalid regular expression</text>
<text x="430" y="196" font-size="12.5" font-weight="400" fill="#5C5C5C" text-anchor="start">if not, every entry gets it</text>
<g><circle cx="50" cy="274" r="13" fill="#1E1E1E" stroke="#1E1E1E" stroke-width="2"/><text x="50" y="278" font-size="13" font-weight="800" text-anchor="middle" fill="#FFFFFF">2</text></g>
<rect x="76" y="234" width="300" height="80" rx="12" fill="#FFE88A" stroke="#E0B400" stroke-width="2.5"/><text x="226" y="278.2" font-size="14" font-weight="700" fill="#1E1E1E" text-anchor="middle">The name itself</text>
<rect x="430" y="240" width="96" height="34" rx="17" fill="#FFC9C2" stroke="#E5484D" stroke-width="2.5"/><text x="478" y="260.6" font-size="12" font-weight="400" fill="#1E1E1E" text-anchor="middle">Empty name</text>
<rect x="534" y="240" width="109" height="34" rx="17" fill="#FFC9C2" stroke="#E5484D" stroke-width="2.5"/><text x="588.6" y="260.6" font-size="12" font-weight="400" fill="#1E1E1E" text-anchor="middle">Invalid name</text>
<rect x="651" y="240" width="148" height="34" rx="17" fill="#FFC9C2" stroke="#E5484D" stroke-width="2.5"/><text x="725.6" y="260.6" font-size="12" font-weight="400" fill="#1E1E1E" text-anchor="middle">Invalid characters</text>
<rect x="808" y="240" width="115" height="34" rx="17" fill="#FFC9C2" stroke="#E5484D" stroke-width="2.5"/><text x="865.9" y="260.6" font-size="12" font-weight="400" fill="#1E1E1E" text-anchor="middle">Name too long</text>
<text x="430" y="300" font-size="12.5" font-weight="400" fill="#5C5C5C" text-anchor="start">blank · &quot;.&quot; or &quot;..&quot; · \ / : * ? &quot; &lt; &gt; | or control characters · over 255 characters</text>
<g><circle cx="50" cy="378" r="13" fill="#1E1E1E" stroke="#1E1E1E" stroke-width="2"/><text x="50" y="382" font-size="13" font-weight="800" text-anchor="middle" fill="#FFFFFF">3</text></g>
<rect x="76" y="338" width="300" height="80" rx="12" fill="#C7E4FF" stroke="#0D8BF2" stroke-width="2.5"/><text x="226" y="382.2" font-size="14" font-weight="700" fill="#1E1E1E" text-anchor="middle">Your own check</text>
<rect x="430" y="344" width="109" height="34" rx="17" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2.5"/><text x="484.6" y="364.6" font-size="12" font-weight="400" fill="#1E1E1E" text-anchor="middle">your message</text>
<text x="430" y="404" font-size="12.5" font-weight="400" fill="#5C5C5C" text-anchor="start"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">plan(files, rule, check)</tspan><tspan>: a </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">Function&lt;String, String&gt;</tspan><tspan>, null = fine</tspan></text>
<g><circle cx="50" cy="482" r="13" fill="#1E1E1E" stroke="#1E1E1E" stroke-width="2"/><text x="50" y="486" font-size="13" font-weight="800" text-anchor="middle" fill="#FFFFFF">4</text></g>
<rect x="76" y="442" width="300" height="80" rx="12" fill="#FFD7AD" stroke="#F08C00" stroke-width="2.5"/><text x="226" y="486.2" font-size="14" font-weight="700" fill="#1E1E1E" text-anchor="middle">Twice in the selection?</text>
<rect x="430" y="448" width="122" height="34" rx="17" fill="#FFC9C2" stroke="#E5484D" stroke-width="2.5"/><text x="491.2" y="468.6" font-size="12" font-weight="400" fill="#1E1E1E" text-anchor="middle">Duplicate name</text>
<text x="430" y="508" font-size="12.5" font-weight="400" fill="#5C5C5C" text-anchor="start">two files of the same folder would get the same name</text>
<g><circle cx="50" cy="586" r="13" fill="#1E1E1E" stroke="#1E1E1E" stroke-width="2"/><text x="50" y="590" font-size="13" font-weight="800" text-anchor="middle" fill="#FFFFFF">5</text></g>
<rect x="76" y="546" width="300" height="80" rx="12" fill="#FFC9C2" stroke="#E5484D" stroke-width="2.5"/><text x="226" y="590.2" font-size="14" font-weight="700" fill="#1E1E1E" text-anchor="middle">Taken in the folder?</text>
<rect x="430" y="552" width="122" height="34" rx="17" fill="#FFC9C2" stroke="#E5484D" stroke-width="2.5"/><text x="491.2" y="572.6" font-size="12" font-weight="400" fill="#1E1E1E" text-anchor="middle">Already exists</text>
<text x="430" y="612" font-size="12.5" font-weight="400" fill="#5C5C5C" text-anchor="start">by a file that is not being renamed</text>
<rect x="76" y="656" width="300" height="40" rx="20" fill="#CDF3C9" stroke="#30A46C" stroke-width="2.5"/><text x="226" y="680.05" font-size="13.5" font-weight="700" fill="#1E1E1E" text-anchor="middle">no problem</text>
<g filter="url(#shadow)"><rect x="960" y="130" width="244" height="170" rx="3" fill="#FFE88A"/></g><text x="974" y="154" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start">Windows and macOS: names</text><text x="974" y="172.2" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start">compare without case. A change</text><text x="974" y="190.4" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start">only in letter case (photo.JPG</text><text x="974" y="208.6" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start">→ photo.jpg) is not &quot;Already</text><text x="974" y="226.8" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start">exists&quot;.</text>
<g filter="url(#shadow)"><rect x="960" y="318" width="244" height="110" rx="3" fill="#CDF3C9"/></g><text x="974" y="342" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start">A name that another file of</text><text x="974" y="360.2" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start">the selection is leaving is</text><text x="974" y="378.4" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start">free: swaps are allowed.</text>
<g filter="url(#shadow)"><rect x="960" y="446" width="244" height="110" rx="3" fill="#C7E4FF"/></g><text x="974" y="470" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start">No problem: the file is</text><text x="974" y="488.2" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start">renamed only if the name</text><text x="974" y="506.4" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start"><tspan>really changes (</tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.09">changed()</tspan><tspan>).</tspan></text>
<g filter="url(#shadow)"><rect x="960" y="574" width="244" height="76" rx="3" fill="#FFCCE5"/></g><text x="974" y="598" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="start"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.555">plan.hasProblems()</tspan><tspan>: do not</tspan></text><text x="974" y="616.9" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="start">apply.</text>
<text x="36" y="52" font-size="26" font-weight="800" fill="#1E1E1E">The problems the plan finds</text><text x="36" y="80" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start"><tspan>Each new name goes through these checks in order; the first problem found goes into </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13.95">Entry.problem</tspan><tspan>.</tspan></text><g transform="translate(1076,30)"><rect width="128" height="28" rx="14" fill="#FFFFFF" stroke="#E0E0E0"/><circle cx="16" cy="14" r="6" fill="#F08C00"/><text x="30" y="19" font-size="12.5" font-weight="700" fill="#1E1E1E">OctopusFile</text></g>
</svg>
