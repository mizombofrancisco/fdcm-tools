<g filter="url(#shadow)"><rect x="1000" y="168" width="204" height="150" rx="3" fill="#FFCCE5"/></g><text x="1014" y="192" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="start"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.555">cancel()</tspan><tspan> works on</tspan></text><text x="1014" y="210.9" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="start">every job: it stops at</text><text x="1014" y="229.8" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="start">the next file or block</text><text x="1014" y="248.7" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="start">and the state becomes</text><text x="1014" y="267.6" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="start">CANCELLED.</text>
<g filter="url(#shadow)"><rect x="1000" y="340" width="204" height="130" rx="3" fill="#FFE88A"/></g><text x="1014" y="364" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="start"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.555">copy</tspan><tspan> never</tspan></text><text x="1014" y="382.9" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="start">overwrites: a name</text><text x="1014" y="401.8" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="start">already taken becomes</text><text x="1014" y="420.7" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="start">&quot;name (2)&quot;, &quot;name (3)&quot;…</text>
<g filter="url(#shadow)"><rect x="1000" y="492" width="204" height="230" rx="3" fill="#C7E4FF"/></g><text x="1014" y="516" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="start">The jobs since 2.0 call</text><text x="1014" y="534.9" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="start">the module with a</text><text x="1014" y="553.8" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="start">cancel flag and report</text><text x="1014" y="572.7" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="start">each file (a match, a</text><text x="1014" y="591.6" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="start">step, the items</text><text x="1014" y="610.5" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="start">counted) as progress.</text>
<g filter="url(#shadow)"><rect x="1000" y="744" width="204" height="80" rx="3" fill="#CDF3C9"/></g><text x="1014" y="768" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="start"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.555">getResult()</tspan><tspan> is </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.555">null</tspan></text><text x="1014" y="786.9" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="start">before DONE.</text>
<text x="36" y="52" font-size="26" font-weight="800" fill="#1E1E1E">The built-in jobs of TransferManager</text><text x="36" y="80" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start"><tspan>Each method queues one </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13.95">Transfer</tspan><tspan> and returns it at once; its </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13.95">Kind</tspan><tspan> is only a label for the UI.</tspan></text><g transform="translate(1076,30)"><rect width="128" height="28" rx="14" fill="#FFFFFF" stroke="#E0E0E0"/><circle cx="16" cy="14" r="6" fill="#F08C00"/><text x="30" y="19" font-size="12.5" font-weight="700" fill="#1E1E1E">OctopusFile</text></g>
</svg>
