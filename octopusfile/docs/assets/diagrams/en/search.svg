<g filter="url(#shadow)"><rect x="820" y="412" width="360" height="126" rx="3" fill="#FFE88A"/></g><text x="834" y="436" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.09">cancel</tspan><tspan> and </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.09">maxResults</tspan><tspan>; the first match per</tspan></text><text x="834" y="454.2" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start">file or all of them; the excerpt is cut around</text><text x="834" y="472.4" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start">the match.</text>
<text x="36" y="52" font-size="26" font-weight="800" fill="#1E1E1E">Search: an instant name index and search inside files</text><text x="36" y="80" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13.95">FileIndex</tspan><tspan> answers in milliseconds; </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13.95">ContentSearcher</tspan><tspan> reads the files when you ask.</tspan></text><g transform="translate(1076,30)"><rect width="128" height="28" rx="14" fill="#FFFFFF" stroke="#E0E0E0"/><circle cx="16" cy="14" r="6" fill="#F08C00"/><text x="30" y="19" font-size="12.5" font-weight="700" fill="#1E1E1E">OctopusFile</text></g>
