<rect x="290" y="126" width="206" height="72" rx="12" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2.5"/><text x="393" y="157.225" font-size="13.5" font-weight="700" fill="#1E1E1E" text-anchor="middle">password</text><text x="393" y="178.775" font-size="10.5" font-weight="400" fill="#5C5C5C" text-anchor="middle">at least 6 characters</text>
<rect x="522" y="126" width="206" height="72" rx="12" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2.5"/><text x="625" y="150.4" font-size="13.5" font-weight="700" fill="#1E1E1E" text-anchor="middle">PBKDF2-HMAC-SHA256</text><text x="625" y="171.95" font-size="10.5" font-weight="400" fill="#5C5C5C" text-anchor="middle">310 000 iterations · salt 16</text><text x="625" y="185.6" font-size="10.5" font-weight="400" fill="#5C5C5C" text-anchor="middle">bytes</text>
<rect x="754" y="126" width="206" height="72" rx="12" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2.5"/><text x="857" y="150.4" font-size="13.5" font-weight="700" fill="#1E1E1E" text-anchor="middle">AES-256-GCM</text><text x="857" y="171.95" font-size="10.5" font-weight="400" fill="#5C5C5C" text-anchor="middle">1 MiB blocks · nonce 12 · tag</text><text x="857" y="185.6" font-size="10.5" font-weight="400" fill="#5C5C5C" text-anchor="middle">128 bits</text>
<rect x="986" y="126" width="206" height="72" rx="12" fill="#E1D3FF" stroke="#8E4EC6" stroke-width="2.5"/><text x="1089" y="143.575" font-size="13.5" font-weight="700" fill="#1E1E1E" text-anchor="middle">change is detected</text><text x="1089" y="165.125" font-size="10.5" font-weight="400" fill="#5C5C5C" text-anchor="middle">block number + &quot;last&quot; flag</text><text x="1089" y="178.775" font-size="10.5" font-weight="400" fill="#5C5C5C" text-anchor="middle"><tspan>authenticated; </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="9.765">index.bin</tspan></text><text x="1089" y="192.425" font-size="10.5" font-weight="400" fill="#5C5C5C" text-anchor="middle">encrypted</text>
<rect x="36" y="222" width="210" height="80" rx="12" fill="#FFCCE5" stroke="#E93D82" stroke-width="2.5"/><text x="141" y="256.7" font-size="15" font-weight="700" fill="#1E1E1E" text-anchor="middle">Encrypted file</text><text x="141" y="280.2" font-size="12" font-weight="400" fill="#5C5C5C" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.16">EncryptionEngine</tspan></text>
<rect x="290" y="226" width="206" height="72" rx="12" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2.5"/><text x="393" y="266.05" font-size="13.5" font-weight="700" fill="#1E1E1E" text-anchor="middle">password</text>
<rect x="522" y="226" width="206" height="72" rx="12" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2.5"/><text x="625" y="250.4" font-size="13.5" font-weight="700" fill="#1E1E1E" text-anchor="middle">PBKDF2-HMAC-SHA256</text><text x="625" y="271.95" font-size="10.5" font-weight="400" fill="#5C5C5C" text-anchor="middle">210 000 iterations · salt 16</text><text x="625" y="285.6" font-size="10.5" font-weight="400" fill="#5C5C5C" text-anchor="middle">bytes</text>
<rect x="754" y="226" width="206" height="72" rx="12" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2.5"/><text x="857" y="250.4" font-size="13.5" font-weight="700" fill="#1E1E1E" text-anchor="middle"><tspan>format </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.555">OFE2</tspan></text><text x="857" y="271.95" font-size="10.5" font-weight="400" fill="#5C5C5C" text-anchor="middle">1 MiB blocks: length, nonce 12,</text><text x="857" y="285.6" font-size="10.5" font-weight="400" fill="#5C5C5C" text-anchor="middle">data + tag 16</text>
<rect x="986" y="226" width="206" height="72" rx="12" fill="#FFCCE5" stroke="#E93D82" stroke-width="2.5"/><text x="1089" y="250.4" font-size="13.5" font-weight="700" fill="#1E1E1E" text-anchor="middle">temporary file</text><text x="1089" y="271.95" font-size="10.5" font-weight="400" fill="#5C5C5C" text-anchor="middle">the target appears only when</text><text x="1089" y="285.6" font-size="10.5" font-weight="400" fill="#5C5C5C" text-anchor="middle">all is verified</text>
<rect x="36" y="322" width="210" height="80" rx="12" fill="#C7E4FF" stroke="#0D8BF2" stroke-width="2.5"/><text x="141" y="356.7" font-size="15" font-weight="700" fill="#1E1E1E" text-anchor="middle">Saved secrets</text><text x="141" y="380.2" font-size="12" font-weight="400" fill="#5C5C5C" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.16">CredentialVault</tspan></text>
<rect x="290" y="326" width="206" height="72" rx="12" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2.5"/><text x="393" y="357.225" font-size="13.5" font-weight="700" fill="#1E1E1E" text-anchor="middle">random 256-bit key</text><text x="393" y="378.775" font-size="10.5" font-weight="400" fill="#5C5C5C" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="9.765">vault.key</tspan></text>
<rect x="522" y="326" width="206" height="72" rx="12" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2.5"/><text x="625" y="350.4" font-size="13.5" font-weight="700" fill="#1E1E1E" text-anchor="middle">AES-256-GCM</text><text x="625" y="371.95" font-size="10.5" font-weight="400" fill="#5C5C5C" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="9.765">seal</tspan><tspan>: Base64 of iv 12 + data</tspan></text><text x="625" y="385.6" font-size="10.5" font-weight="400" fill="#5C5C5C" text-anchor="middle">+ tag</text>
<rect x="754" y="326" width="206" height="72" rx="12" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2.5"/><text x="857" y="357.225" font-size="13.5" font-weight="700" fill="#1E1E1E" text-anchor="middle">owner-only file</text><text x="857" y="378.775" font-size="10.5" font-weight="400" fill="#5C5C5C" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="9.765">rw-------</tspan><tspan> on Linux and macOS</tspan></text>
<rect x="986" y="326" width="206" height="72" rx="12" fill="#C7E4FF" stroke="#0D8BF2" stroke-width="2.5"/><text x="1089" y="357.225" font-size="13.5" font-weight="700" fill="#1E1E1E" text-anchor="middle">damaged key: error</text><text x="1089" y="378.775" font-size="10.5" font-weight="400" fill="#5C5C5C" text-anchor="middle">never replaced by a new key</text>
<rect x="36" y="422" width="210" height="80" rx="12" fill="#C2F0E6" stroke="#12A594" stroke-width="2.5"/><text x="141" y="456.7" font-size="15" font-weight="700" fill="#1E1E1E" text-anchor="middle">Sharing nearby</text><text x="141" y="480.2" font-size="12" font-weight="400" fill="#5C5C5C" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.16">LanShare</tspan></text>
<rect x="290" y="426" width="206" height="72" rx="12" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2.5"/><text x="393" y="450.4" font-size="13.5" font-weight="700" fill="#1E1E1E" text-anchor="middle">X25519</text><text x="393" y="471.95" font-size="10.5" font-weight="400" fill="#5C5C5C" text-anchor="middle">the sender commits first:</text><text x="393" y="485.6" font-size="10.5" font-weight="400" fill="#5C5C5C" text-anchor="middle">SHA-256 of its key</text>
<rect x="522" y="426" width="206" height="72" rx="12" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2.5"/><text x="625" y="450.4" font-size="13.5" font-weight="700" fill="#1E1E1E" text-anchor="middle">6-digit code</text><text x="625" y="471.95" font-size="10.5" font-weight="400" fill="#5C5C5C" text-anchor="middle">from the shared secret, on both</text><text x="625" y="485.6" font-size="10.5" font-weight="400" fill="#5C5C5C" text-anchor="middle">screens</text>
<rect x="754" y="426" width="206" height="72" rx="12" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2.5"/><text x="857" y="450.4" font-size="13.5" font-weight="700" fill="#1E1E1E" text-anchor="middle">consent</text><text x="857" y="471.95" font-size="10.5" font-weight="400" fill="#5C5C5C" text-anchor="middle">ACCEPT or DECLINE, for every</text><text x="857" y="485.6" font-size="10.5" font-weight="400" fill="#5C5C5C" text-anchor="middle">transfer</text>
<rect x="986" y="426" width="206" height="72" rx="12" fill="#C2F0E6" stroke="#12A594" stroke-width="2.5"/><text x="1089" y="457.225" font-size="13.5" font-weight="700" fill="#1E1E1E" text-anchor="middle">AES-256-GCM</text><text x="1089" y="478.775" font-size="10.5" font-weight="400" fill="#5C5C5C" text-anchor="middle">64 KiB frames</text>
<rect x="36" y="522" width="210" height="80" rx="12" fill="#CDF3C9" stroke="#30A46C" stroke-width="2.5"/><text x="141" y="556.7" font-size="15" font-weight="700" fill="#1E1E1E" text-anchor="middle">ZIP extraction</text><text x="141" y="580.2" font-size="12" font-weight="400" fill="#5C5C5C" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.16">ZipCompressionEngine</tspan></text>
<rect x="290" y="526" width="206" height="72" rx="12" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2.5"/><text x="393" y="557.225" font-size="13.5" font-weight="700" fill="#1E1E1E" text-anchor="middle">entry name</text><text x="393" y="578.775" font-size="10.5" font-weight="400" fill="#5C5C5C" text-anchor="middle"><tspan>for example </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="9.765">../../x</tspan></text>
<rect x="522" y="526" width="206" height="72" rx="12" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2.5"/><text x="625" y="557.225" font-size="13.5" font-weight="700" fill="#1E1E1E" text-anchor="middle">resolve + normalize</text><text x="625" y="578.775" font-size="10.5" font-weight="400" fill="#5C5C5C" text-anchor="middle">inside the destination folder</text>
<rect x="754" y="526" width="206" height="72" rx="12" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2.5"/><text x="857" y="550.4" font-size="13.5" font-weight="700" fill="#1E1E1E" text-anchor="middle">outside?</text><text x="857" y="571.95" font-size="10.5" font-weight="400" fill="#5C5C5C" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="9.765">startsWith(destination)</tspan><tspan> is</tspan></text><text x="857" y="585.6" font-size="10.5" font-weight="400" fill="#5C5C5C" text-anchor="middle">false</text>
<rect x="986" y="526" width="206" height="72" rx="12" fill="#CDF3C9" stroke="#30A46C" stroke-width="2.5"/><text x="1089" y="557.225" font-size="13.5" font-weight="700" fill="#1E1E1E" text-anchor="middle">refused</text><text x="1089" y="578.775" font-size="10.5" font-weight="400" fill="#5C5C5C" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="9.765">IOException</tspan><tspan>: zip slip</tspan></text>
<rect x="36" y="622" width="210" height="80" rx="12" fill="#FFD7AD" stroke="#F08C00" stroke-width="2.5"/><text x="141" y="656.7" font-size="15" font-weight="700" fill="#1E1E1E" text-anchor="middle">Trash and copies</text><text x="141" y="680.2" font-size="12" font-weight="400" fill="#5C5C5C" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.16">TrashManager</tspan></text>
<rect x="290" y="626" width="206" height="72" rx="12" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2.5"/><text x="393" y="666.05" font-size="13.5" font-weight="700" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.555">restore(id)</tspan></text>
<rect x="522" y="626" width="206" height="72" rx="12" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2.5"/><text x="625" y="666.05" font-size="13.5" font-weight="700" fill="#1E1E1E" text-anchor="middle">target exists?</text>
<rect x="754" y="626" width="206" height="72" rx="12" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2.5"/><text x="857" y="657.225" font-size="13.5" font-weight="700" fill="#1E1E1E" text-anchor="middle">refused</text><text x="857" y="678.775" font-size="10.5" font-weight="400" fill="#5C5C5C" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="9.765">FileAlreadyExistsException</tspan></text>
<rect x="986" y="626" width="206" height="72" rx="12" fill="#FFD7AD" stroke="#F08C00" stroke-width="2.5"/><text x="1089" y="657.225" font-size="13.5" font-weight="700" fill="#1E1E1E" text-anchor="middle">nothing overwritten</text><text x="1089" y="678.775" font-size="10.5" font-weight="400" fill="#5C5C5C" text-anchor="middle">by surprise, anywhere</text>
<text x="36" y="52" font-size="26" font-weight="800" fill="#1E1E1E">What is protected, and how</text><text x="36" y="80" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start">Each area and the steps the code takes; the numbers are the constants in the classes.</text><g transform="translate(1076,30)"><rect width="128" height="28" rx="14" fill="#FFFFFF" stroke="#E0E0E0"/><circle cx="16" cy="14" r="6" fill="#F08C00"/><text x="30" y="19" font-size="12.5" font-weight="700" fill="#1E1E1E">OctopusFile</text></g>
</svg>
