<g filter="url(#shadow)"><rect x="60" y="774" width="510" height="104" rx="3" fill="#C7E4FF"/></g><text x="74" y="798" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start">Other labels are never mixed in. The path is relative to the</text><text x="74" y="816.2" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start"><tspan>backed-up folder (</tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.09">/</tspan><tspan>, or </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.09">\</tspan><tspan>); a folder has no versions; an</tspan></text><text x="74" y="834.4" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start">unknown label gives an empty list.</text>
<rect x="668" y="548" width="512" height="64" rx="12" fill="#FFE88A" stroke="#E0B400" stroke-width="2.5"/><text x="924" y="575.05" font-size="14" font-weight="700" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13.02">target</tspan><tspan> must not exist</tspan></text><text x="924" y="597.25" font-size="11" font-weight="400" fill="#5C5C5C" text-anchor="middle"><tspan>otherwise </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="10.23">FileAlreadyExistsException</tspan><tspan>: nothing is ever replaced</tspan></text>
<rect x="668" y="630" width="512" height="64" rx="12" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2.5"/><text x="924" y="657.05" font-size="14" font-weight="700" fill="#1E1E1E" text-anchor="middle">written to a temporary file</text><text x="924" y="679.25" font-size="11" font-weight="400" fill="#5C5C5C" text-anchor="middle">read from the content store; cancel at any block</text>
<rect x="668" y="712" width="512" height="64" rx="12" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2.5"/><text x="924" y="739.05" font-size="14" font-weight="700" fill="#1E1E1E" text-anchor="middle">checked against its hash</text><text x="924" y="761.25" font-size="11" font-weight="400" fill="#5C5C5C" text-anchor="middle"><tspan>damaged content: </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="10.23">IOException</tspan><tspan>, the temporary file is removed</tspan></text>
<rect x="668" y="794" width="512" height="64" rx="12" fill="#CDF3C9" stroke="#30A46C" stroke-width="2.5"/><text x="924" y="821.05" font-size="14" font-weight="700" fill="#1E1E1E" text-anchor="middle">moved into place</text><text x="924" y="843.25" font-size="11" font-weight="400" fill="#5C5C5C" text-anchor="middle">with the date of the version (10:00)</text>
<text x="668" y="880" font-size="12.5" font-weight="600" fill="#5C5C5C" text-anchor="start">A snapshot pruned or deleted since the list was made:</text><text x="668" y="896.875" font-size="12.5" font-weight="600" fill="#5C5C5C" text-anchor="start"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">NoSuchFileException</tspan><tspan>.</tspan></text>
<text x="36" y="52" font-size="26" font-weight="800" fill="#1E1E1E">Versions of one file: what the snapshots of a series keep</text><text x="36" y="80" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13.95">SnapshotRepository.versions(label, path)</tspan><tspan> and </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13.95">restoreVersion(version, target, …)</tspan><tspan> — since 2.1.</tspan></text><g transform="translate(1076,30)"><rect width="128" height="28" rx="14" fill="#FFFFFF" stroke="#E0E0E0"/><circle cx="16" cy="14" r="6" fill="#F08C00"/><text x="30" y="19" font-size="12.5" font-weight="700" fill="#1E1E1E">OctopusFile</text></g>
</svg>
