<rect x="436" y="346" width="166" height="40" rx="20" fill="#FFD7AD" stroke="#F08C00" stroke-width="2.5"/><text x="519" y="369.75" font-size="12.5" font-weight="700" fill="#1E1E1E" text-anchor="middle">version 2 — s3</text>
<rect x="812" y="346" width="354" height="40" rx="20" fill="#FFD7AD" stroke="#F08C00" stroke-width="2.5"/><text x="989" y="369.75" font-size="12.5" font-weight="700" fill="#1E1E1E" text-anchor="middle">version 1 (newest) — s6</text>
<text x="707" y="340" font-size="12" font-weight="700" fill="#5C5C5C" text-anchor="middle">ends the run</text>
<text x="60" y="420" font-size="13" font-weight="400" fill="#5C5C5C" text-anchor="start">Same content in a row = one version, whatever its date. s5 has the same content as s3, but s4 came between: a new version.</text>
<text x="60" y="554" font-size="13" font-weight="700" fill="#1E1E1E" text-anchor="start"><tspan>newest first: </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.09">Version(snapshot, entry)</tspan></text>
