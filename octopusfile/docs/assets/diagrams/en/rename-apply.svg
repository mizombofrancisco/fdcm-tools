<text x="54" y="172" font-size="12.5" font-weight="400" fill="#5C5C5C" text-anchor="start">every source still exists</text>
<text x="350" y="172" font-size="12.5" font-weight="400" fill="#5C5C5C" text-anchor="start">only where the target is the name</text><text x="350" y="188.875" font-size="12.5" font-weight="400" fill="#5C5C5C" text-anchor="start">of another source</text>
<text x="646" y="172" font-size="12.5" font-weight="400" fill="#5C5C5C" text-anchor="start">the target must not exist</text>
<text x="942" y="172" font-size="12.5" font-weight="400" fill="#5C5C5C" text-anchor="start">temporary → target, same check</text>
