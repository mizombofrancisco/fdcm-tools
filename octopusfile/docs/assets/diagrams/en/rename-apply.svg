<rect x="56" y="306" width="240" height="48" rx="12" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2.5"/><text x="176" y="334.05" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.555">b.txt → a.txt</tspan></text>
