<rect x="352" y="306" width="240" height="48" rx="12" fill="#E1D3FF" stroke="#8E4EC6" stroke-width="2.5"/><text x="472" y="333.75" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">b.txt</tspan><tspan> → </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">.~ren-7be0d413</tspan></text>
<rect x="352" y="376" width="240" height="48" rx="12" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2.5"/><text x="472" y="403.75" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="middle">c.txt: not needed</text>
<rect x="648" y="376" width="240" height="48" rx="12" fill="#C7E4FF" stroke="#0D8BF2" stroke-width="2.5"/><text x="768" y="403.9" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.09">c.txt</tspan><tspan> → </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.09">d.txt</tspan></text>
<rect x="944" y="236" width="240" height="48" rx="12" fill="#CDF3C9" stroke="#30A46C" stroke-width="2.5"/><text x="1064" y="263.75" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">.~ren-1f3a9c20</tspan><tspan> → </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">b.txt</tspan></text>
<rect x="944" y="306" width="240" height="48" rx="12" fill="#CDF3C9" stroke="#30A46C" stroke-width="2.5"/><text x="1064" y="333.75" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">.~ren-7be0d413</tspan><tspan> → </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">a.txt</tspan></text>
<rect x="36" y="520" width="250" height="120" rx="12" fill="#FFC9C2" stroke="#E5484D" stroke-width="2.5"/><text x="161" y="559.1" font-size="15" font-weight="700" fill="#1E1E1E" text-anchor="middle">Something fails</text><text x="161" y="582.6" font-size="12" font-weight="400" fill="#5C5C5C" text-anchor="middle">source gone, target exists</text><text x="161" y="598.2" font-size="12" font-weight="400" fill="#5C5C5C" text-anchor="middle"><tspan>(</tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.16">FileAlreadyExistsException</tspan><tspan>),</tspan></text><text x="161" y="613.8" font-size="12" font-weight="400" fill="#5C5C5C" text-anchor="middle">disk error</text>
<path d="M346,540 v80 a100,10 0 0 0 200,0 v-80" fill="#EBEBEB" stroke="#8F8F8F" stroke-width="2.5"/><ellipse cx="446" cy="540" rx="100" ry="10" fill="#EBEBEB" stroke="#8F8F8F" stroke-width="2.5"/><text x="446" y="588.05" font-size="13.5" font-weight="700" fill="#1E1E1E" text-anchor="middle">log of moves done</text>
<rect x="606" y="520" width="300" height="120" rx="12" fill="#FFD7AD" stroke="#F08C00" stroke-width="2.5"/><text x="756" y="566.9" font-size="15" font-weight="700" fill="#1E1E1E" text-anchor="middle">Undo in reverse order</text><text x="756" y="590.4" font-size="12" font-weight="400" fill="#5C5C5C" text-anchor="middle">each move is moved back; then the</text><text x="756" y="606" font-size="12" font-weight="400" fill="#5C5C5C" text-anchor="middle">exception is thrown again</text>
<rect x="966" y="530" width="238" height="100" rx="50" fill="#FFC9C2" stroke="#E5484D" stroke-width="2.5"/><text x="1085" y="584.2" font-size="14" font-weight="700" fill="#1E1E1E" text-anchor="middle">Everything as before</text>
<text x="620" y="488" font-size="12.5" font-weight="700" fill="#E5484D" text-anchor="middle">a failure in any step</text>
<text x="36" y="690" font-size="13.5" font-weight="400" fill="#5C5C5C" text-anchor="start"><tspan>Success: </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.555">renameAll</tspan><tspan> returns the pairs; pass them back reversed to undo. The temporary names start with </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.555">.~ren-</tspan><tspan> and stay in the same folder.</tspan></text>
<text x="36" y="52" font-size="26" font-weight="800" fill="#1E1E1E">renameAll: all or nothing</text><text x="36" y="80" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start">Example: a swap (a ↔ b) and a plain rename (c → d) in the same folder.</text><g transform="translate(1076,30)"><rect width="128" height="28" rx="14" fill="#FFFFFF" stroke="#E0E0E0"/><circle cx="16" cy="14" r="6" fill="#F08C00"/><text x="30" y="19" font-size="12.5" font-weight="700" fill="#1E1E1E">OctopusFile</text></g>
</svg>
