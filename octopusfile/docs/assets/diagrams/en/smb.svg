<rect width="1240" height="900" rx="18" fill="#F7F7F5"/><rect width="1240" height="900" rx="18" fill="url(#dots)"/><rect x="0.75" y="0.75" width="1238.5" height="898.5" rx="18" fill="none" stroke="#E0E0E0" stroke-width="1.5"/>
<g><rect x="36" y="320" width="372" height="380" rx="14" fill="#C7E4FF" fill-opacity="0.38" stroke="#0D8BF2" stroke-width="1.5" stroke-dasharray="0"/><rect x="48" y="307" width="81" height="26" rx="8" fill="#0D8BF2"/><text x="62" y="324" font-size="13" font-weight="700" fill="#FFFFFF">Windows</text></g>
<g><rect x="434" y="320" width="372" height="380" rx="14" fill="#FFD7AD" fill-opacity="0.38" stroke="#F08C00" stroke-width="1.5" stroke-dasharray="0"/><rect x="446" y="307" width="66" height="26" rx="8" fill="#F08C00"/><text x="460" y="324" font-size="13" font-weight="700" fill="#FFFFFF">Linux</text></g>
<g><rect x="832" y="320" width="372" height="380" rx="14" fill="#EBEBEB" fill-opacity="0.38" stroke="#8F8F8F" stroke-width="1.5" stroke-dasharray="0"/><rect x="844" y="307" width="66" height="26" rx="8" fill="#8F8F8F"/><text x="858" y="324" font-size="13" font-weight="700" fill="#FFFFFF">macOS</text></g>
<path d="M276,138 L300,138 L300,175 L328,175" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
