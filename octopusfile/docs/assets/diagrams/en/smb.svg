<path d="M276,238 L300,238 L300,175 L328,175" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
<path d="M500,175 L548,175" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
<path d="M840,175 L888,175" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
<path d="M1090,175 L1122,175" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
<path d="M990,234 L990,270 L620,270 L620,296" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
<path d="M336,789 L388,789" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
<path d="M186,702 L186,742" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
<path d="M620,789 L650,789 L650,769 L678,769" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
<path d="M505,844 L505,834 L505,852 L678,852" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
<rect x="36" y="118" width="240" height="40" rx="20" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2.5"/><text x="156" y="142.05" font-size="13.5" font-weight="700" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.555">\\nas\photos</tspan></text>
<rect x="36" y="168" width="240" height="40" rx="20" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2.5"/><text x="156" y="192.05" font-size="13.5" font-weight="700" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.555">//nas/photos</tspan></text>
<rect x="36" y="218" width="240" height="40" rx="20" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2.5"/><text x="156" y="242.05" font-size="13.5" font-weight="700" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.555">smb://ana@nas/photos</tspan></text>
<rect x="330" y="140" width="170" height="70" rx="12" fill="#C7E4FF" stroke="#0D8BF2" stroke-width="2.5"/><text x="415" y="170.05" font-size="14" font-weight="700" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13.02">parse(text)</tspan></text><text x="415" y="192.25" font-size="11" font-weight="400" fill="#5C5C5C" text-anchor="middle">null if not valid</text>
<rect x="550" y="130" width="290" height="90" rx="12" fill="#C7E4FF" stroke="#0D8BF2" stroke-width="2.5"/><text x="695" y="162.9" font-size="14" font-weight="700" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13.02">Address</tspan></text><text x="695" y="185.1" font-size="11" font-weight="400" fill="#5C5C5C" text-anchor="middle">host = nas · share = photos · path = &quot;&quot; ·</text><text x="695" y="199.4" font-size="11" font-weight="400" fill="#5C5C5C" text-anchor="middle">user = ana</text>
<polygon points="990,116 1090,175 990,234 890,175" fill="#FFE88A" stroke="#E0B400" stroke-width="2.5" stroke-linejoin="round"/><text x="990" y="170.45" font-size="13" font-weight="700" fill="#1E1E1E" text-anchor="middle">Already a folder at</text><text x="990" y="187.35" font-size="13" font-weight="700" fill="#1E1E1E" text-anchor="middle">the local path?</text>
<text x="990" y="106" font-size="12.5" font-weight="700" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">connect(a, user, password)</tspan></text>
<rect x="1124" y="152" width="80" height="46" rx="23" fill="#CDF3C9" stroke="#30A46C" stroke-width="2.5"/><text x="1164" y="178.6" font-size="12" font-weight="700" fill="#1E1E1E" text-anchor="middle">return</text>
<text x="1106" y="146" font-size="12.5" font-weight="700" fill="#1E1E1E" text-anchor="middle">yes</text>
<rect x="707" y="258" width="186" height="24" rx="9" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/><text x="800" y="275" font-size="12.5" font-weight="600" fill="#1E1E1E" text-anchor="middle">no: run a system program</text>
<text x="56" y="356" font-size="12.5" font-weight="700" fill="#5C5C5C" text-anchor="start">command</text>
<rect x="56" y="366" width="332" height="74" rx="12" fill="#2B2B2B" stroke="#1E1E1E" stroke-width="2.5"/><text x="222" y="398.625" font-size="12.5" font-weight="400" fill="#FFFFFF" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">powershell -NoProfile -NonInteractive</tspan></text><text x="222" y="414.875" font-size="12.5" font-weight="400" fill="#FFFFFF" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">-ExecutionPolicy Bypass -Command -</tspan></text>
<text x="56" y="466" font-size="12.5" font-weight="700" fill="#5C5C5C" text-anchor="start">written to its stdin</text>
<rect x="56" y="476" width="332" height="100" rx="12" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2.5"/><text x="222" y="513.5" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="middle"><tspan>a script that calls </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">WNetAddConnection2</tspan></text><text x="222" y="529.75" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="middle">(mpr.dll); user and password inside, in</text><text x="222" y="546" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="middle">Base64; empty = the current session or guest</text>
<text x="56" y="602" font-size="12.5" font-weight="700" fill="#5C5C5C" text-anchor="start">local path</text>
<rect x="56" y="612" width="332" height="72" rx="12" fill="#CDF3C9" stroke="#30A46C" stroke-width="2.5"/><text x="222" y="643.575" font-size="12.5" font-weight="700" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">\\nas\photos</tspan></text><text x="222" y="663.825" font-size="9.5" font-weight="400" fill="#5C5C5C" text-anchor="middle">UNC path</text>
<text x="454" y="356" font-size="12.5" font-weight="700" fill="#5C5C5C" text-anchor="start">command</text>
<rect x="454" y="366" width="332" height="74" rx="12" fill="#2B2B2B" stroke="#1E1E1E" stroke-width="2.5"/><text x="620" y="406.75" font-size="12.5" font-weight="400" fill="#FFFFFF" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">gio mount smb://nas/photos</tspan></text>
<text x="454" y="466" font-size="12.5" font-weight="700" fill="#5C5C5C" text-anchor="start">written to its stdin</text>
<rect x="454" y="476" width="332" height="100" rx="12" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2.5"/><text x="620" y="521.625" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="middle"><tspan>user, </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">WORKGROUP</tspan><tspan>, password — one per line</tspan></text><text x="620" y="537.875" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="middle">(GVfs asks for them)</text>
<text x="454" y="602" font-size="12.5" font-weight="700" fill="#5C5C5C" text-anchor="start">local path</text>
<rect x="454" y="612" width="332" height="72" rx="12" fill="#CDF3C9" stroke="#30A46C" stroke-width="2.5"/><text x="620" y="635.45" font-size="12.5" font-weight="700" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">/run/user/&lt;uid&gt;/gvfs/</tspan></text><text x="620" y="651.7" font-size="12.5" font-weight="700" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">smb-share:server=nas,share=photos</tspan></text><text x="620" y="671.95" font-size="9.5" font-weight="400" fill="#5C5C5C" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="8.835">,user=ana</tspan><tspan> added when needed</tspan></text>
<text x="852" y="356" font-size="12.5" font-weight="700" fill="#5C5C5C" text-anchor="start">command</text>
<rect x="852" y="366" width="332" height="74" rx="12" fill="#2B2B2B" stroke="#1E1E1E" stroke-width="2.5"/><text x="1018" y="406.75" font-size="12.5" font-weight="400" fill="#FFFFFF" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">osascript -</tspan></text>
<text x="852" y="466" font-size="12.5" font-weight="700" fill="#5C5C5C" text-anchor="start">written to its stdin</text>
<rect x="852" y="476" width="332" height="100" rx="12" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2.5"/><text x="1018" y="521.625" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">mount volume &quot;smb://ana:…@nas/photos&quot;</tspan><tspan> —</tspan></text><text x="1018" y="537.875" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="middle">user and password URL-encoded</text>
<text x="852" y="602" font-size="12.5" font-weight="700" fill="#5C5C5C" text-anchor="start">local path</text>
<rect x="852" y="612" width="332" height="72" rx="12" fill="#CDF3C9" stroke="#30A46C" stroke-width="2.5"/><text x="1018" y="643.575" font-size="12.5" font-weight="700" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">/Volumes/photos</tspan></text><text x="1018" y="663.825" font-size="9.5" font-weight="400" fill="#5C5C5C" text-anchor="middle">under /Volumes</text>
<g><rect x="290" y="307" width="101" height="24" rx="12" fill="#C7E4FF" stroke="#0D8BF2" stroke-width="1.5"/><text x="340.6" y="323" font-size="12" font-weight="700" text-anchor="middle" fill="#1E1E1E">since 2.0.1</text></g>
<rect x="36" y="744" width="300" height="90" rx="12" fill="#EBEBEB" stroke="#8F8F8F" stroke-width="2.5"/><text x="186" y="776.9" font-size="14" font-weight="700" fill="#1E1E1E" text-anchor="middle">Wait up to 40 s</text><text x="186" y="799.1" font-size="11" font-weight="400" fill="#5C5C5C" text-anchor="middle">then the program is stopped: &quot;The server did</text><text x="186" y="813.4" font-size="11" font-weight="400" fill="#5C5C5C" text-anchor="middle">not answer in time&quot;</text>
<polygon points="505,734 620,789 505,844 390,789" fill="#FFE88A" stroke="#E0B400" stroke-width="2.5" stroke-linejoin="round"/><text x="505" y="784.45" font-size="13" font-weight="700" fill="#1E1E1E" text-anchor="middle">Folder at the local</text><text x="505" y="801.35" font-size="13" font-weight="700" fill="#1E1E1E" text-anchor="middle">path now?</text>
<rect x="680" y="744" width="150" height="50" rx="25" fill="#CDF3C9" stroke="#30A46C" stroke-width="2.5"/><text x="755" y="773.2" font-size="14" font-weight="700" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13.02">Path</tspan></text>
<rect x="680" y="806" width="220" height="56" rx="12" fill="#FFC9C2" stroke="#E5484D" stroke-width="2.5"/><text x="790" y="829.4" font-size="13" font-weight="700" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.09">IOException</tspan></text><text x="790" y="850.3" font-size="10" font-weight="400" fill="#5C5C5C" text-anchor="middle">&quot;Cannot connect to photos (nas)&quot;</text>
<rect x="630.5" y="738" width="39" height="24" rx="9" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/><text x="650" y="755" font-size="12.5" font-weight="600" fill="#1E1E1E" text-anchor="middle">yes</text>
<text x="560" y="872" font-size="12.5" font-weight="700" fill="#1E1E1E" text-anchor="start">no</text>
<g filter="url(#shadow)"><rect x="940" y="730" width="264" height="140" rx="3" fill="#FFCCE5"/></g><text x="954" y="754" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="start">The password goes to the program&#x27;s</text><text x="954" y="771.5" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="start">stdin, never on its command line:</text><text x="954" y="789" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="start">other users cannot see it in the</text><text x="954" y="806.5" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="start">process list. In messages it is</text><text x="954" y="824" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="start">replaced by ***.</text>
<text x="36" y="52" font-size="26" font-weight="800" fill="#1E1E1E">Connecting a network share (SMB)</text><text x="36" y="80" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13.95">NetworkShares.connect</tspan><tspan> lets the operating system mount the share and returns the local path it produces.</tspan></text><g transform="translate(1076,30)"><rect width="128" height="28" rx="14" fill="#FFFFFF" stroke="#E0E0E0"/><circle cx="16" cy="14" r="6" fill="#F08C00"/><text x="30" y="19" font-size="12.5" font-weight="700" fill="#1E1E1E">OctopusFile</text></g>
</svg>
