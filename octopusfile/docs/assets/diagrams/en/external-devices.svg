<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 700" width="1240" height="700" role="img" aria-label="Finding USB drives and memory cards" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title>Finding USB drives and memory cards</title>
<defs><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#D4D4D4"/></pattern><filter id="shadow" x="-10%" y="-10%" width="130%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#000000" flood-opacity="0.18"/></filter><marker id="arrow-1E1E1E" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1.5,1.5 L10,6 L1.5,10.5" fill="none" stroke="#1E1E1E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="1240" height="700" rx="18" fill="#F7F7F5"/><rect width="1240" height="700" rx="18" fill="url(#dots)"/><rect x="0.75" y="0.75" width="1238.5" height="698.5" rx="18" fill="none" stroke="#E0E0E0" stroke-width="1.5"/>
<g><rect x="560" y="130" width="644" height="190" rx="14" fill="#C7E4FF" fill-opacity="0.38" stroke="#0D8BF2" stroke-width="1.5" stroke-dasharray="0"/><rect x="572" y="117" width="81" height="26" rx="8" fill="#0D8BF2"/><text x="586" y="134" font-size="13" font-weight="700" fill="#FFFFFF">Windows</text></g>
<g><rect x="560" y="370" width="644" height="200" rx="14" fill="#C2F0E6" fill-opacity="0.38" stroke="#12A594" stroke-width="1.5" stroke-dasharray="0"/><rect x="572" y="357" width="126" height="26" rx="8" fill="#12A594"/><text x="586" y="374" font-size="13" font-weight="700" fill="#FFFFFF">Linux · macOS</text></g>
<g><rect x="36" y="300" width="330" height="270" rx="14" fill="#FFD7AD" fill-opacity="0.38" stroke="#F08C00" stroke-width="1.5" stroke-dasharray="0"/><rect x="48" y="287" width="142" height="26" rx="8" fill="#F08C00"/><text x="62" y="304" font-size="13" font-weight="700" fill="#FFFFFF">For each device</text></g>
<path d="M256,180 L298,180" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
<path d="M734,200 L778,200" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
<path d="M1030,200 L1072,200" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
<path d="M500,180 L558,180" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
<path d="M794,465 L838,465" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
<path d="M1040,468 L1072,468" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
<path d="M400,240 L400,470 L558,470" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
<rect x="36" y="150" width="220" height="60" rx="30" fill="#2B2B2B" stroke="#1E1E1E" stroke-width="2.5"/><text x="146" y="184.2" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13.02">listRemovable()</tspan></text>
<polygon points="400,120 500,180 400,240 300,180" fill="#FFE88A" stroke="#E0B400" stroke-width="2.5" stroke-linejoin="round"/><text x="400" y="184.5" font-size="15" font-weight="700" fill="#1E1E1E" text-anchor="middle">Windows?</text>
<rect x="584" y="168" width="150" height="64" rx="12" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2.5"/><text x="659" y="195.05" font-size="14" font-weight="700" fill="#1E1E1E" text-anchor="middle">C:\ D:\ E:\</text><text x="659" y="217.25" font-size="11" font-weight="400" fill="#5C5C5C" text-anchor="middle">every drive root</text>
<rect x="780" y="158" width="250" height="84" rx="12" fill="#C7E4FF" stroke="#0D8BF2" stroke-width="2.5"/><text x="905" y="188.4" font-size="13.5" font-weight="700" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.555">isRemovable(root)</tspan></text><text x="905" y="209.95" font-size="10.5" font-weight="400" fill="#5C5C5C" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="9.765">volume:isRemovable</tspan><tspan> is true and</tspan></text><text x="905" y="223.6" font-size="10.5" font-weight="400" fill="#5C5C5C" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="9.765">volume:isCdrom</tspan><tspan> is not</tspan></text>
<rect x="1074" y="172" width="110" height="56" rx="28" fill="#CDF3C9" stroke="#30A46C" stroke-width="2.5"/><text x="1129" y="204.2" font-size="14" font-weight="700" fill="#1E1E1E" text-anchor="middle">listed</text>
<rect x="1031.5" y="164" width="39" height="24" rx="9" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/><text x="1051" y="181" font-size="12.5" font-weight="600" fill="#1E1E1E" text-anchor="middle">yes</text>
<text x="584" y="290" font-size="13" font-weight="600" fill="#5C5C5C" text-anchor="start">An optical drive is never listed. The attributes come from the drive&#x27;s FileStore.</text>
<rect x="509.5" y="144" width="39" height="24" rx="9" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/><text x="529" y="161" font-size="12.5" font-weight="600" fill="#1E1E1E" text-anchor="middle">yes</text>
<rect x="584" y="398" width="210" height="42" rx="12" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2.5"/><text x="689" y="422.9" font-size="13" font-weight="700" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.09">/media/&lt;user&gt;</tspan></text>
<rect x="584" y="450" width="210" height="42" rx="12" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2.5"/><text x="689" y="474.9" font-size="13" font-weight="700" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.09">/run/media/&lt;user&gt;</tspan></text>
<rect x="584" y="502" width="210" height="42" rx="12" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2.5"/><text x="689" y="526.9" font-size="13" font-weight="700" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.09">/Volumes</tspan></text>
<rect x="840" y="420" width="200" height="90" rx="12" fill="#C2F0E6" stroke="#12A594" stroke-width="2.5"/><text x="940" y="460.05" font-size="14" font-weight="700" fill="#1E1E1E" text-anchor="middle">each folder inside</text><text x="940" y="482.25" font-size="11" font-weight="400" fill="#5C5C5C" text-anchor="middle"><tspan>except </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="10.23">Macintosh HD</tspan></text>
<rect x="1074" y="440" width="110" height="56" rx="28" fill="#CDF3C9" stroke="#30A46C" stroke-width="2.5"/><text x="1129" y="472.2" font-size="14" font-weight="700" fill="#1E1E1E" text-anchor="middle">listed</text>
<rect x="384" y="348" width="32" height="24" rx="9" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/><text x="400" y="365" font-size="12.5" font-weight="600" fill="#1E1E1E" text-anchor="middle">no</text>
<text x="58" y="336" font-size="13.5" font-weight="700" fill="#1E1E1E" text-anchor="start"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.555">volumeLabel(p)</tspan></text>
<text x="58" y="357" font-size="13" font-weight="400" fill="#5C5C5C" text-anchor="start">the volume name, or the folder name</text>
<text x="58" y="392" font-size="13.5" font-weight="700" fill="#1E1E1E" text-anchor="start"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.555">fileSystemType(p)</tspan></text>
<text x="58" y="413" font-size="13" font-weight="400" fill="#5C5C5C" text-anchor="start">NTFS, FAT32, exFAT, vfat…</text>
<text x="58" y="448" font-size="13.5" font-weight="700" fill="#1E1E1E" text-anchor="start"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.555">listDevices()</tspan></text>
<text x="58" y="469" font-size="13" font-weight="400" fill="#5C5C5C" text-anchor="start">every root, removable or not</text>
<text x="58" y="504" font-size="13.5" font-weight="700" fill="#1E1E1E" text-anchor="start"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.555">new ExternalDevices(p)</tspan></text>
<text x="58" y="525" font-size="13" font-weight="400" fill="#5C5C5C" text-anchor="start"><tspan>a </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.09">StorageProvider</tspan><tspan> on that drive</tspan></text>
<g filter="url(#shadow)"><rect x="36" y="610" width="1168" height="50" rx="3" fill="#FFCCE5"/></g><text x="50" y="634" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.09">isRemovable(root)</tspan><tspan> reads the volume attribute on every system, but only Windows provides it: elsewhere it answers false. Use </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.09">listRemovable()</tspan><tspan>.</tspan></text>
<text x="36" y="52" font-size="26" font-weight="800" fill="#1E1E1E">Finding USB drives and memory cards</text><text x="36" y="80" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13.95">ExternalDevices.listRemovable()</tspan><tspan> asks the system in a different way on Windows and on Linux / macOS.</tspan></text><g transform="translate(1076,30)"><rect width="128" height="28" rx="14" fill="#FFFFFF" stroke="#E0E0E0"/><circle cx="16" cy="14" r="6" fill="#F08C00"/><text x="30" y="19" font-size="12.5" font-weight="700" fill="#1E1E1E">OctopusFile</text></g>
</svg>
