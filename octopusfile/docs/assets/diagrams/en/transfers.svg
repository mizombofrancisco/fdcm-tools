<path d="M1000,184 L1170,184 L1170,370" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
<path d="M740,266 L788,266" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
<g filter="url(#shadow)"><rect x="36" y="120" width="250" height="290" rx="3" fill="#FFE88A"/></g><text x="50" y="144" font-size="15" font-weight="700" fill="#1E1E1E">You call</text><text x="50" y="166.25" font-size="14" font-weight="400" fill="#1E1E1E" text-anchor="start">copy · move</text><text x="50" y="185.85" font-size="14" font-weight="400" fill="#1E1E1E" text-anchor="start">upload · download</text><text x="50" y="205.45" font-size="14" font-weight="400" fill="#1E1E1E" text-anchor="start">snapshot · restore</text><text x="50" y="225.05" font-size="14" font-weight="400" fill="#1E1E1E" text-anchor="start">pushSnapshots</text><text x="50" y="244.65" font-size="14" font-weight="400" fill="#1E1E1E" text-anchor="start">pullSnapshots</text><text x="50" y="264.25" font-size="14" font-weight="400" fill="#1E1E1E" text-anchor="start">searchContent</text><text x="50" y="283.85" font-size="14" font-weight="400" fill="#1E1E1E" text-anchor="start">buildIndex</text><text x="50" y="303.45" font-size="14" font-weight="400" fill="#1E1E1E" text-anchor="start">findDuplicates</text>
<path d="M340,200 v130 a85,10 0 0 0 170,0 v-130" fill="#EBEBEB" stroke="#8F8F8F" stroke-width="2.5"/><ellipse cx="425" cy="200" rx="85" ry="10" fill="#EBEBEB" stroke="#8F8F8F" stroke-width="2.5"/><text x="425" y="263.7" font-size="15" font-weight="700" fill="#1E1E1E" text-anchor="middle">Queue</text><text x="425" y="287.2" font-size="12" font-weight="400" fill="#5C5C5C" text-anchor="middle">in order</text>
<rect x="570" y="190" width="170" height="52" rx="26" fill="#C2F0E6" stroke="#12A594" stroke-width="2.5"/><text x="655" y="220.2" font-size="14" font-weight="700" fill="#1E1E1E" text-anchor="middle">worker 1</text>
<rect x="570" y="290" width="170" height="52" rx="26" fill="#C2F0E6" stroke="#12A594" stroke-width="2.5"/><text x="655" y="320.2" font-size="14" font-weight="700" fill="#1E1E1E" text-anchor="middle">worker 2</text>
<rect x="830" y="160" width="170" height="48" rx="24" fill="#EBEBEB" stroke="#8F8F8F" stroke-width="2.5"/><text x="915" y="188.2" font-size="14" font-weight="700" fill="#1E1E1E" text-anchor="middle">QUEUED</text>
<rect x="830" y="262" width="170" height="48" rx="24" fill="#C7E4FF" stroke="#0D8BF2" stroke-width="2.5"/><text x="915" y="290.2" font-size="14" font-weight="700" fill="#1E1E1E" text-anchor="middle">RUNNING</text>
<rect x="812" y="372" width="112" height="48" rx="24" fill="#CDF3C9" stroke="#30A46C" stroke-width="2.5"/><text x="868" y="400.05" font-size="13.5" font-weight="700" fill="#1E1E1E" text-anchor="middle">DONE</text>
<rect x="940" y="372" width="112" height="48" rx="24" fill="#FFC9C2" stroke="#E5484D" stroke-width="2.5"/><text x="996" y="400.05" font-size="13.5" font-weight="700" fill="#1E1E1E" text-anchor="middle">FAILED</text>
<rect x="1068" y="372" width="126" height="48" rx="24" fill="#FFD7AD" stroke="#F08C00" stroke-width="2.5"/><text x="1131" y="400.05" font-size="13.5" font-weight="700" fill="#1E1E1E" text-anchor="middle">CANCELLED</text>
<rect x="1063" y="274" width="74" height="24" rx="9" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/><text x="1100" y="291" font-size="12.5" font-weight="600" fill="#1E1E1E" text-anchor="middle">cancel()</text>
<rect x="1063" y="172" width="74" height="24" rx="9" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/><text x="1100" y="189" font-size="12.5" font-weight="600" fill="#1E1E1E" text-anchor="middle">cancel()</text>
<g filter="url(#shadow)"><rect x="36" y="480" width="360" height="110" rx="3" fill="#C7E4FF"/></g><text x="50" y="504" font-size="14" font-weight="400" fill="#1E1E1E" text-anchor="start">Listeners are called about 8 times a</text><text x="50" y="523.6" font-size="14" font-weight="400" fill="#1E1E1E" text-anchor="start">second: progress, speed, time left.</text>
<g filter="url(#shadow)"><rect x="420" y="480" width="360" height="110" rx="3" fill="#CDF3C9"/></g><text x="434" y="504" font-size="14" font-weight="400" fill="#1E1E1E" text-anchor="start"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13.02">getResult()</tspan><tspan> when DONE: the snapshot, the</tspan></text><text x="434" y="523.6" font-size="14" font-weight="400" fill="#1E1E1E" text-anchor="start">matches, the index, the duplicates.</text>
<g filter="url(#shadow)"><rect x="804" y="480" width="400" height="110" rx="3" fill="#FFCCE5"/></g><text x="818" y="504" font-size="14" font-weight="400" fill="#1E1E1E" text-anchor="start"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13.02">cancel()</tspan><tspan> asks the work to stop at the next</tspan></text><text x="818" y="523.6" font-size="14" font-weight="400" fill="#1E1E1E" text-anchor="start">safe point; the transfer ends as CANCELLED.</text>
<text x="36" y="52" font-size="26" font-weight="800" fill="#1E1E1E">Long operations go through one queue</text><text x="36" y="80" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13.95">TransferManager.get()</tspan><tspan> runs them on two worker threads; each call returns a </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13.95">Transfer</tspan><tspan> at once.</tspan></text><g transform="translate(1076,30)"><rect width="128" height="28" rx="14" fill="#FFFFFF" stroke="#E0E0E0"/><circle cx="16" cy="14" r="6" fill="#F08C00"/><text x="30" y="19" font-size="12.5" font-weight="700" fill="#1E1E1E">OctopusFile</text></g>
</svg>
