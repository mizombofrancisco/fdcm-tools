<rect x="400" y="506" width="190" height="84" rx="12" fill="#FFE88A" stroke="#E0B400" stroke-width="2.5"/><text x="495" y="543.05" font-size="14" font-weight="700" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13.02">ErrorCodes</tspan></text><text x="495" y="565.25" font-size="11" font-weight="400" fill="#5C5C5C" text-anchor="middle"><tspan>96 values · </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="10.23">OF-101</tspan><tspan>…</tspan></text>
<rect x="314.5" y="518" width="109" height="24" rx="9" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/><text x="369" y="535" font-size="12.5" font-weight="600" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">errorCode()</tspan></text>
<g filter="url(#shadow)"><rect x="60" y="616" width="250" height="120" rx="3" fill="#FFE88A"/></g><text x="74" y="640" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="start"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">getMessage()</tspan><tspan> is for people</tspan></text><text x="74" y="657.5" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="start"><tspan>(English); </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">errorCode()</tspan><tspan> is for</tspan></text><text x="74" y="675" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="start">your code: translate by code in</text><text x="74" y="692.5" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="start">your UI.</text>
<g filter="url(#shadow)"><rect x="330" y="616" width="260" height="120" rx="3" fill="#C7E4FF"/></g><text x="344" y="640" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="start">The module classes throw</text><text x="344" y="657.5" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="start"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">IOException</tspan><tspan>; their</tspan></text><text x="344" y="675" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="start"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">FileOperationException</tspan><tspan> carries</tspan></text><text x="344" y="692.5" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="start"><tspan>the same </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">errorCode()</tspan><tspan>.</tspan></text>
<g><circle cx="654" cy="518" r="13" fill="#1E1E1E" stroke="#1E1E1E" stroke-width="2"/><text x="654" y="522" font-size="13" font-weight="800" text-anchor="middle" fill="#FFFFFF">5</text></g>
<rect x="684" y="506" width="230" height="44" rx="22" fill="#E1D3FF" stroke="#8E4EC6" stroke-width="2.5"/><text x="799" y="531.75" font-size="12.5" font-weight="700" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">AtomicBoolean cancel</tspan></text>
<text x="930" y="533" font-size="12.5" font-weight="600" fill="#1E1E1E" text-anchor="start"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">findDuplicates</tspan><tspan>, </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">DiskAnalyzer</tspan><tspan>,</tspan></text><text x="930" y="549.875" font-size="12.5" font-weight="600" fill="#1E1E1E" text-anchor="start">snapshots</text>
<rect x="684" y="564" width="230" height="44" rx="22" fill="#E1D3FF" stroke="#8E4EC6" stroke-width="2.5"/><text x="799" y="589.75" font-size="12.5" font-weight="700" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">BooleanSupplier cancelled</tspan></text>
<text x="930" y="591" font-size="12.5" font-weight="600" fill="#1E1E1E" text-anchor="start">WebDAV upload / download,</text><text x="930" y="607.875" font-size="12.5" font-weight="600" fill="#1E1E1E" text-anchor="start"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">TreeUtils</tspan><tspan>, sharing</tspan></text>
<rect x="684" y="622" width="230" height="44" rx="22" fill="#E1D3FF" stroke="#8E4EC6" stroke-width="2.5"/><text x="799" y="647.75" font-size="12.5" font-weight="700" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">Transfer.cancel()</tspan></text>
<text x="930" y="649" font-size="12.5" font-weight="600" fill="#1E1E1E" text-anchor="start"><tspan>everything in the </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">TransferManager</tspan></text><text x="930" y="665.875" font-size="12.5" font-weight="600" fill="#1E1E1E" text-anchor="start">queue</text>
<g filter="url(#shadow)"><rect x="684" y="686" width="500" height="54" rx="3" fill="#FFE88A"/></g><text x="698" y="710" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start">Set it from another thread; the work stops at the next safe point.</text>
<text x="36" y="52" font-size="26" font-weight="800" fill="#1E1E1E">Five design rules</text><text x="36" y="80" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start">What holds for every class of the library, and what it means when you call it.</text><g transform="translate(1076,30)"><rect width="128" height="28" rx="14" fill="#FFFFFF" stroke="#E0E0E0"/><circle cx="16" cy="14" r="6" fill="#F08C00"/><text x="30" y="19" font-size="12.5" font-weight="700" fill="#1E1E1E">OctopusFile</text></g>
</svg>
