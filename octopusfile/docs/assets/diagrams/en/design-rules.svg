<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 790" width="1240" height="790" role="img" aria-label="Five design rules" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title>Five design rules</title>
<defs><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#D4D4D4"/></pattern><filter id="shadow" x="-10%" y="-10%" width="130%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#000000" flood-opacity="0.18"/></filter><marker id="arrow-1E1E1E" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1.5,1.5 L10,6 L1.5,10.5" fill="none" stroke="#1E1E1E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="1240" height="790" rx="18" fill="#F7F7F5"/><rect width="1240" height="790" rx="18" fill="url(#dots)"/><rect x="0.75" y="0.75" width="1238.5" height="788.5" rx="18" fill="none" stroke="#E0E0E0" stroke-width="1.5"/>
<g><rect x="36" y="130" width="330" height="300" rx="14" fill="#CDF3C9" fill-opacity="0.38" stroke="#30A46C" stroke-width="1.5" stroke-dasharray="0"/><rect x="48" y="117" width="210" height="26" rx="8" fill="#30A46C"/><text x="62" y="134" font-size="13" font-weight="700" fill="#FFFFFF">No external dependencies</text></g>
<g><rect x="386" y="130" width="390" height="300" rx="14" fill="#C7E4FF" fill-opacity="0.38" stroke="#0D8BF2" stroke-width="1.5" stroke-dasharray="0"/><rect x="398" y="117" width="271" height="26" rx="8" fill="#0D8BF2"/><text x="412" y="134" font-size="13" font-weight="700" fill="#FFFFFF">Blocking calls, explicit threads</text></g>
<g><rect x="796" y="130" width="408" height="300" rx="14" fill="#FFD7AD" fill-opacity="0.38" stroke="#F08C00" stroke-width="1.5" stroke-dasharray="0"/><rect x="808" y="117" width="233" height="26" rx="8" fill="#F08C00"/><text x="822" y="134" font-size="13" font-weight="700" fill="#FFFFFF">Never overwrite by surprise</text></g>
<g><rect x="36" y="480" width="574" height="280" rx="14" fill="#FFC9C2" fill-opacity="0.38" stroke="#E5484D" stroke-width="1.5" stroke-dasharray="0"/><rect x="48" y="467" width="271" height="26" rx="8" fill="#E5484D"/><text x="62" y="484" font-size="13" font-weight="700" fill="#FFFFFF">Errors are values you can act on</text></g>
<g><rect x="630" y="480" width="574" height="280" rx="14" fill="#E1D3FF" fill-opacity="0.38" stroke="#8E4EC6" stroke-width="1.5" stroke-dasharray="0"/><rect x="642" y="467" width="286" height="26" rx="8" fill="#8E4EC6"/><text x="656" y="484" font-size="13" font-weight="700" fill="#FFFFFF">Cancel everywhere it can take long</text></g>
<path d="M210,200 L210,232" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
<path d="M560,176 L604,176" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
<path d="M560,256 L604,256" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
<path d="M681,288 L681,318" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
