<text x="984" y="183" font-size="12.5" font-weight="600" fill="#5C5C5C" text-anchor="start">already there</text>
<g filter="url(#shadow)"><rect x="850" y="214" width="120" height="44" rx="3" fill="#FFD7AD"/></g><text x="864" y="238" font-size="13" font-weight="400" fill="#1E1E1E" text-anchor="start"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.09">photo.jpg</tspan></text>
<text x="984" y="241" font-size="12.5" font-weight="600" fill="#5C5C5C" text-anchor="start">arrives</text>
<rect x="1050" y="214" width="140" height="44" rx="22" fill="#CDF3C9" stroke="#30A46C" stroke-width="2.5"/><text x="1120" y="239.6" font-size="12" font-weight="700" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.16">photo (2).jpg</tspan></text>
<text x="820" y="290" font-size="12.5" font-weight="600" fill="#1E1E1E" text-anchor="start">Free names: transfers, the inbox of sharing</text>
<text x="820" y="308" font-size="12.5" font-weight="600" fill="#1E1E1E" text-anchor="start"><tspan>nearby, </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">organize</tspan><tspan>.</tspan></text>
<text x="820" y="336" font-size="12.5" font-weight="600" fill="#1E1E1E" text-anchor="start"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">copy</tspan><tspan> / </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">move</tspan><tspan> of a file onto an existing one:</tspan></text>
<text x="820" y="354" font-size="12.5" font-weight="600" fill="#1E1E1E" text-anchor="start"><tspan>refused (</tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">FileAlreadyExistsException</tspan><tspan>).</tspan></text>
<g filter="url(#shadow)"><rect x="820" y="368" width="368" height="50" rx="3" fill="#FFCCE5"/></g><text x="834" y="392" font-size="12" font-weight="400" fill="#1E1E1E" text-anchor="start"><tspan>Not covered: </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.16">extract</tspan><tspan> / </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.16">restoreTo</tspan><tspan> replace files</tspan></text><text x="834" y="408.8" font-size="12" font-weight="400" fill="#1E1E1E" text-anchor="start">of the same name.</text>
