<rect x="206" y="240" width="140" height="36" rx="18" fill="#2B2B2B" stroke="#1E1E1E" stroke-width="2.5"/><text x="276" y="261.75" font-size="12.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">java.logging</text>
<rect x="56" y="286" width="140" height="36" rx="18" fill="#2B2B2B" stroke="#1E1E1E" stroke-width="2.5"/><text x="126" y="307.75" font-size="12.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">java.net.http</text>
<rect x="206" y="286" width="140" height="36" rx="18" fill="#2B2B2B" stroke="#1E1E1E" stroke-width="2.5"/><text x="276" y="307.75" font-size="12.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">java.xml</text>
<text x="56" y="350" font-size="12.5" font-weight="600" fill="#1E1E1E" text-anchor="start"><tspan>+ </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">jdk.crypto.ec</tspan><tspan> in a </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">jlink</tspan><tspan> runtime</tspan></text>
<text x="56" y="370" font-size="12.5" font-weight="600" fill="#5C5C5C" text-anchor="start">(X25519 for sharing nearby)</text>
<text x="56" y="400" font-size="12.5" font-weight="600" fill="#30A46C" text-anchor="start">Nothing else on the class path.</text>
<g><circle cx="410" cy="168" r="13" fill="#1E1E1E" stroke="#1E1E1E" stroke-width="2"/><text x="410" y="172" font-size="13" font-weight="800" text-anchor="middle" fill="#FFFFFF">2</text></g>
<rect x="440" y="156" width="120" height="40" rx="20" fill="#EBEBEB" stroke="#8F8F8F" stroke-width="2.5"/><text x="500" y="179.9" font-size="13" font-weight="700" fill="#1E1E1E" text-anchor="middle">your thread</text>
<rect x="606" y="150" width="150" height="52" rx="12" fill="#C7E4FF" stroke="#0D8BF2" stroke-width="2.5"/><text x="681" y="171.4" font-size="13" font-weight="700" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.09">copy(a).to(b)</tspan></text><text x="681" y="192.3" font-size="10" font-weight="400" fill="#5C5C5C" text-anchor="middle">returns when done</text>
<rect x="406" y="236" width="154" height="40" rx="20" fill="#EBEBEB" stroke="#8F8F8F" stroke-width="2.5"/><text x="483" y="259.9" font-size="13" font-weight="700" fill="#1E1E1E" text-anchor="middle">long work</text>
<rect x="606" y="224" width="150" height="64" rx="12" fill="#E1D3FF" stroke="#8E4EC6" stroke-width="2.5"/><text x="681" y="251.4" font-size="13" font-weight="700" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.09">TransferManager</tspan></text><text x="681" y="272.3" font-size="10" font-weight="400" fill="#5C5C5C" text-anchor="middle">2 worker threads</text>
<rect x="606" y="320" width="150" height="40" rx="20" fill="#CDF3C9" stroke="#30A46C" stroke-width="2.5"/><text x="681" y="343.75" font-size="12.5" font-weight="700" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">Transfer</tspan><tspan> at once</tspan></text>
<g filter="url(#shadow)"><rect x="406" y="312" width="180" height="96" rx="3" fill="#FFE88A"/></g><text x="420" y="336" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="start">Methods block the</text><text x="420" y="353.5" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="start">calling thread; none</text><text x="420" y="371" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="start">needs a UI thread.</text>
<g><circle cx="820" cy="168" r="13" fill="#1E1E1E" stroke="#1E1E1E" stroke-width="2"/><text x="820" y="172" font-size="13" font-weight="800" text-anchor="middle" fill="#FFFFFF">3</text></g>
