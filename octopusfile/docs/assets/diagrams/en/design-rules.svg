<rect x="231" y="204" width="74" height="24" rx="9" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/><text x="268" y="221" font-size="12.5" font-weight="600" fill="#1E1E1E" text-anchor="middle">requires</text>
