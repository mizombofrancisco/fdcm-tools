<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 800" width="1240" height="800" role="img" aria-label="Dated ZIP backups — BackupService" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title>Dated ZIP backups — BackupService</title>
<defs><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#D4D4D4"/></pattern><filter id="shadow" x="-10%" y="-10%" width="130%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#000000" flood-opacity="0.18"/></filter><marker id="arrow-1E1E1E" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1.5,1.5 L10,6 L1.5,10.5" fill="none" stroke="#1E1E1E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="1240" height="800" rx="18" fill="#F7F7F5"/><rect width="1240" height="800" rx="18" fill="url(#dots)"/><rect x="0.75" y="0.75" width="1238.5" height="798.5" rx="18" fill="none" stroke="#E0E0E0" stroke-width="1.5"/>
<g><rect x="36" y="430" width="560" height="200" rx="14" fill="#C7E4FF" fill-opacity="0.38" stroke="#0D8BF2" stroke-width="1.5" stroke-dasharray="0"/><rect x="48" y="417" width="286" height="26" rx="8" fill="#0D8BF2"/><text x="62" y="434" font-size="13" font-weight="700" fill="#FFFFFF">BackupMetadata — what you get back</text></g>
<g><rect x="640" y="430" width="564" height="200" rx="14" fill="#E1D3FF" fill-opacity="0.38" stroke="#8E4EC6" stroke-width="1.5" stroke-dasharray="0"/><rect x="652" y="417" width="278" height="26" rx="8" fill="#8E4EC6"/><text x="666" y="434" font-size="13" font-weight="700" fill="#FFFFFF">BackupScheduler — at a fixed rate</text></g>
<path d="M196,175 L248,175" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
<path d="M460,175 L508,175" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
<path d="M730,175 L778,175" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
<path d="M1020,175 L1072,175" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
<path d="M266,715 L318,715" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
<path d="M680,715 L732,715" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
<rect x="36" y="130" width="160" height="90" rx="12" fill="#EBEBEB" stroke="#8F8F8F" stroke-width="2.5"/><text x="116" y="169.7" font-size="15" font-weight="700" fill="#1E1E1E" text-anchor="middle">source</text><text x="116" y="193.2" font-size="12" font-weight="400" fill="#5C5C5C" text-anchor="middle">file or folder</text>
<rect x="250" y="130" width="210" height="90" rx="12" fill="#FFE88A" stroke="#E0B400" stroke-width="2.5"/><text x="355" y="169.875" font-size="14.5" font-weight="700" fill="#1E1E1E" text-anchor="middle">Source exists?</text><text x="355" y="192.725" font-size="11.5" font-weight="400" fill="#5C5C5C" text-anchor="middle"><tspan>if not: </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="10.695">IOException</tspan></text>
<g><circle cx="254" cy="134" r="13" fill="#1E1E1E" stroke="#1E1E1E" stroke-width="2"/><text x="254" y="138" font-size="13" font-weight="800" text-anchor="middle" fill="#FFFFFF">1</text></g>
<rect x="510" y="130" width="220" height="90" rx="12" fill="#C7E4FF" stroke="#0D8BF2" stroke-width="2.5"/><text x="620" y="169.875" font-size="14.5" font-weight="700" fill="#1E1E1E" text-anchor="middle">Create the backup folder</text><text x="620" y="192.725" font-size="11.5" font-weight="400" fill="#5C5C5C" text-anchor="middle">when it is missing</text>
<g><circle cx="514" cy="134" r="13" fill="#1E1E1E" stroke="#1E1E1E" stroke-width="2"/><text x="514" y="138" font-size="13" font-weight="800" text-anchor="middle" fill="#FFFFFF">2</text></g>
<rect x="780" y="130" width="240" height="90" rx="12" fill="#FFD7AD" stroke="#F08C00" stroke-width="2.5"/><text x="900" y="162.4" font-size="14.5" font-weight="700" fill="#1E1E1E" text-anchor="middle">Compress to ZIP</text><text x="900" y="185.25" font-size="11.5" font-weight="400" fill="#5C5C5C" text-anchor="middle">streamed in blocks; JPEG, MP4,</text><text x="900" y="200.2" font-size="11.5" font-weight="400" fill="#5C5C5C" text-anchor="middle">ZIP… stored as they are</text>
<g><circle cx="784" cy="134" r="13" fill="#1E1E1E" stroke="#1E1E1E" stroke-width="2"/><text x="784" y="138" font-size="13" font-weight="800" text-anchor="middle" fill="#FFFFFF">3</text></g>
<path d="M1074,135 v80 a65,10 0 0 0 130,0 v-80" fill="#C2F0E6" stroke="#12A594" stroke-width="2.5"/><ellipse cx="1139" cy="135" rx="65" ry="10" fill="#C2F0E6" stroke="#12A594" stroke-width="2.5"/><text x="1139" y="183.8" font-size="16" font-weight="700" fill="#1E1E1E" text-anchor="middle">.zip</text>
<text x="36" y="300" font-size="15" font-weight="800" fill="#1E1E1E" text-anchor="start">The name</text>
<rect x="160" y="274" width="160" height="44" rx="22" fill="#FFE88A" stroke="#E0B400" stroke-width="2.5"/><text x="240" y="300.5" font-size="15" font-weight="700" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13.95">Documents</tspan></text>
<text x="240" y="340" font-size="12.5" font-weight="600" fill="#5C5C5C" text-anchor="middle">name of the source</text><text x="240" y="356.875" font-size="12.5" font-weight="600" fill="#5C5C5C" text-anchor="middle"><tspan>(</tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">backup</tspan><tspan> for a drive</tspan></text><text x="240" y="373.75" font-size="12.5" font-weight="600" fill="#5C5C5C" text-anchor="middle">root)</text>
<rect x="326" y="274" width="150" height="44" rx="22" fill="#C7E4FF" stroke="#0D8BF2" stroke-width="2.5"/><text x="401" y="300.5" font-size="15" font-weight="700" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13.95">-20261121</tspan></text>
<text x="401" y="340" font-size="12.5" font-weight="600" fill="#5C5C5C" text-anchor="middle"><tspan>date </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">yyyyMMdd</tspan></text>
<rect x="482" y="274" width="170" height="44" rx="22" fill="#E1D3FF" stroke="#8E4EC6" stroke-width="2.5"/><text x="567" y="300.5" font-size="15" font-weight="700" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13.95">-143005123</tspan></text>
<text x="567" y="340" font-size="12.5" font-weight="600" fill="#5C5C5C" text-anchor="middle"><tspan>time </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">HHmmssSSS</tspan></text>
<rect x="658" y="274" width="80" height="44" rx="22" fill="#EBEBEB" stroke="#8F8F8F" stroke-width="2.5"/><text x="698" y="300.5" font-size="15" font-weight="700" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13.95">.zip</tspan></text>
<text x="698" y="340" font-size="12.5" font-weight="600" fill="#5C5C5C" text-anchor="middle">ZIP</text>
<g filter="url(#shadow)"><rect x="800" y="266" width="404" height="86" rx="3" fill="#FFE88A"/></g><text x="814" y="290" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="start">A later backup gets another name, so it never</text><text x="814" y="308.9" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="start">replaces an earlier one. Nothing is deleted: old</text><text x="814" y="327.8" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="start">ZIPs stay until you remove them.</text>
<text x="58" y="470" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="start"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.555">getOriginalPath()</tspan><tspan>  — what was backed up</tspan></text>
<text x="58" y="501" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="start"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.555">getBackupPath()</tspan><tspan>  — the new .zip</tspan></text>
<text x="58" y="532" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="start"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.555">getCreatedAt()</tspan><tspan>  — when</tspan></text>
<text x="58" y="563" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="start"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.555">getOriginalSizeBytes()</tspan><tspan> · </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.555">getCompressedSizeBytes()</tspan></text>
<text x="58" y="594" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="start"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.555">getCompressionRatio()</tspan><tspan>  — % saved (0 for an empty source)</tspan></text>
<rect x="662" y="456" width="520" height="48" rx="12" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2.5"/><text x="922" y="483.9" font-size="13" font-weight="700" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.09">schedule(source, folder, period, unit, onBackupCreated)</tspan></text>
<text x="662" y="532" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="start"><tspan>• one daemon thread: </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.555">OctopusFile-BackupScheduler</tspan></text>
<text x="662" y="556" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="start">• first run after one period, then every period</text>
<text x="662" y="580" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="start">• a failed run is logged; the next runs go on</text>
<text x="662" y="604" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="start"><tspan>• </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.555">stop()</tspan><tspan> or </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.555">close()</tspan><tspan> ends it</tspan></text>
<rect x="36" y="680" width="230" height="70" rx="35" fill="#CDF3C9" stroke="#30A46C" stroke-width="2.5"/><text x="151" y="718.9" font-size="13" font-weight="700" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.09">backup(zip).restoreTo(dir)</tspan></text>
<rect x="320" y="670" width="360" height="90" rx="12" fill="#FFD7AD" stroke="#F08C00" stroke-width="2.5"/><text x="500" y="702.4" font-size="14.5" font-weight="700" fill="#1E1E1E" text-anchor="middle">Extract every entry</text><text x="500" y="725.25" font-size="11.5" font-weight="400" fill="#5C5C5C" text-anchor="middle"><tspan>dates kept; an entry that would leave </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="10.695">dir</tspan><tspan> (zip</tspan></text><text x="500" y="740.2" font-size="11.5" font-weight="400" fill="#5C5C5C" text-anchor="middle">slip) stops it</text>
<rect x="734" y="680" width="150" height="70" rx="12" fill="#EBEBEB" stroke="#8F8F8F" stroke-width="2.5"/><text x="809" y="719.2" font-size="14" font-weight="700" fill="#1E1E1E" text-anchor="middle"><tspan>files in </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13.02">dir</tspan></text>
<g filter="url(#shadow)"><rect x="930" y="664" width="274" height="104" rx="3" fill="#FFCCE5"/></g><text x="944" y="688" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="start"><tspan>Files with the same name in </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.555">dir</tspan></text><text x="944" y="706.9" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="start">are replaced: restore into an</text><text x="944" y="725.8" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="start">empty folder.</text>
<text x="36" y="52" font-size="26" font-weight="800" fill="#1E1E1E">Dated ZIP backups — BackupService</text><text x="36" y="80" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13.95">backup(source, folder)</tspan><tspan> writes a new ZIP every time: the name carries the date and the time, to the millisecond.</tspan></text><g transform="translate(1076,30)"><rect width="128" height="28" rx="14" fill="#FFFFFF" stroke="#E0E0E0"/><circle cx="16" cy="14" r="6" fill="#F08C00"/><text x="30" y="19" font-size="12.5" font-weight="700" fill="#1E1E1E">OctopusFile</text></g>
</svg>
