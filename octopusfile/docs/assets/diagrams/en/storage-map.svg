<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 806" width="1240" height="806" role="img" aria-label="Where files can live, and how OctopusFile reaches them" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title>Where files can live, and how OctopusFile reaches them</title>
<defs><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#D4D4D4"/></pattern><filter id="shadow" x="-10%" y="-10%" width="130%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#000000" flood-opacity="0.18"/></filter><marker id="arrow-1E1E1E" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1.5,1.5 L10,6 L1.5,10.5" fill="none" stroke="#1E1E1E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="1240" height="806" rx="18" fill="#F7F7F5"/><rect width="1240" height="806" rx="18" fill="url(#dots)"/><rect x="0.75" y="0.75" width="1238.5" height="804.5" rx="18" fill="none" stroke="#E0E0E0" stroke-width="1.5"/>

<path d="M286,182 L328,182" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
<path d="M286,274 L328,274" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
<path d="M286,366 L328,366" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
<path d="M286,458 L328,458" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
<path d="M286,550 L328,550" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
<path d="M286,642 L328,642" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
<path d="M710,182 L798,182" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
<path d="M710,274 L798,274" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
<path d="M710,366 L798,366" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
<path d="M710,458 L798,458" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
<path d="M710,554 L798,554" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
<path d="M710,646 L798,646" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
<text x="36" y="128" font-size="14" font-weight="800" fill="#5C5C5C" text-anchor="start">Where the files are</text>
<text x="330" y="128" font-size="14" font-weight="800" fill="#5C5C5C" text-anchor="start">How OctopusFile reaches them</text>
<text x="800" y="128" font-size="14" font-weight="800" fill="#5C5C5C" text-anchor="start">What your code gets</text>
<path d="M36,156 v52 a125,10 0 0 0 250,0 v-52" fill="#EBEBEB" stroke="#8F8F8F" stroke-width="2.5"/><ellipse cx="161" cy="156" rx="125" ry="10" fill="#EBEBEB" stroke="#8F8F8F" stroke-width="2.5"/><text x="161" y="190.2" font-size="14" font-weight="700" fill="#1E1E1E" text-anchor="middle">Local disk</text>
<rect x="330" y="148" width="380" height="68" rx="12" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2.5"/><text x="520" y="177.225" font-size="13.5" font-weight="700" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.555">LocalDiskStorage</tspan></text><text x="520" y="198.775" font-size="10.5" font-weight="400" fill="#5C5C5C" text-anchor="middle">the path itself</text>
<rect x="36" y="238" width="250" height="72" rx="12" fill="#FFE88A" stroke="#E0B400" stroke-width="2.5"/><text x="161" y="278.2" font-size="14" font-weight="700" fill="#1E1E1E" text-anchor="middle">USB drive, memory card</text>
<rect x="330" y="240" width="380" height="68" rx="12" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2.5"/><text x="520" y="269.225" font-size="13.5" font-weight="700" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.555">ExternalDevices.listRemovable()</tspan></text><text x="520" y="290.775" font-size="10.5" font-weight="400" fill="#5C5C5C" text-anchor="middle"><tspan>drive letters, </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="9.765">/media</tspan><tspan>, </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="9.765">/Volumes</tspan></text>
<rect x="36" y="330" width="250" height="72" rx="12" fill="#C7E4FF" stroke="#0D8BF2" stroke-width="2.5"/><text x="161" y="361.1" font-size="14" font-weight="700" fill="#1E1E1E" text-anchor="middle">OneDrive, Dropbox, Google</text><text x="161" y="379.3" font-size="14" font-weight="700" fill="#1E1E1E" text-anchor="middle">Drive…</text>
<rect x="330" y="332" width="380" height="68" rx="12" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2.5"/><text x="520" y="361.225" font-size="13.5" font-weight="700" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.555">CloudSyncFolders.detect()</tspan></text><text x="520" y="382.775" font-size="10.5" font-weight="400" fill="#5C5C5C" text-anchor="middle">the folder the official app keeps in sync</text>
<rect x="36" y="422" width="250" height="72" rx="12" fill="#E1D3FF" stroke="#8E4EC6" stroke-width="2.5"/><text x="161" y="462.2" font-size="14" font-weight="700" fill="#1E1E1E" text-anchor="middle">NAS / shared folder (SMB)</text>
<rect x="330" y="424" width="380" height="68" rx="12" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2.5"/><text x="520" y="453.225" font-size="13.5" font-weight="700" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.555">NetworkShares.connect(…)</tspan></text><text x="520" y="474.775" font-size="10.5" font-weight="400" fill="#5C5C5C" text-anchor="middle">the operating system mounts it</text>
<rect x="36" y="514" width="250" height="72" rx="12" fill="#C2F0E6" stroke="#12A594" stroke-width="2.5"/><text x="161" y="545.1" font-size="14" font-weight="700" fill="#1E1E1E" text-anchor="middle">Nextcloud, ownCloud, any</text><text x="161" y="563.3" font-size="14" font-weight="700" fill="#1E1E1E" text-anchor="middle">WebDAV</text>
<rect x="330" y="516" width="380" height="68" rx="12" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2.5"/><text x="520" y="545.225" font-size="13.5" font-weight="700" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.555">WebDavStorage</tspan></text><text x="520" y="566.775" font-size="10.5" font-weight="400" fill="#5C5C5C" text-anchor="middle"><tspan>HTTP requests, </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="9.765">java.net.http</tspan></text>
<rect x="36" y="606" width="250" height="72" rx="12" fill="#FFCCE5" stroke="#E93D82" stroke-width="2.5"/><text x="161" y="646.2" font-size="14" font-weight="700" fill="#1E1E1E" text-anchor="middle">Memory (tests)</text>
<rect x="330" y="608" width="380" height="68" rx="12" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2.5"/><text x="520" y="637.225" font-size="13.5" font-weight="700" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.555">InMemoryBucketStorage</tspan></text><text x="520" y="658.775" font-size="10.5" font-weight="400" fill="#5C5C5C" text-anchor="middle">a map: name → bytes</text>
<rect x="800" y="150" width="404" height="340" rx="12" fill="#CDF3C9" stroke="#30A46C" stroke-width="2.5"/><text x="1002" y="324.5" font-size="15" font-weight="700" fill="#1E1E1E" text-anchor="middle"></text>
<text x="1002" y="260" font-size="17" font-weight="800" fill="#1E1E1E" text-anchor="middle"><tspan>an ordinary local </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="15.81">Path</tspan></text>
<text x="1002" y="292" font-size="13.5" font-weight="400" fill="#5C5C5C" text-anchor="middle">every OctopusFile operation works on it:</text>
<text x="1002" y="316" font-size="13.5" font-weight="400" fill="#5C5C5C" text-anchor="middle">copy, trash, search, sync, snapshots…</text>
<rect x="800" y="520" width="404" height="68" rx="12" fill="#C2F0E6" stroke="#12A594" stroke-width="2.5"/><text x="1002" y="540.45" font-size="13.5" font-weight="700" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.555">list</tspan><tspan>, </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.555">upload</tspan><tspan>, </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.555">download</tspan><tspan>, </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.555">mkdir</tspan><tspan>, </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.555">move</tspan><tspan>,</tspan></text><text x="1002" y="558" font-size="13.5" font-weight="700" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.555">delete</tspan></text><text x="1002" y="579.55" font-size="10.5" font-weight="400" fill="#5C5C5C" text-anchor="middle"><tspan>or </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="9.765">push</tspan><tspan> / </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="9.765">pull</tspan><tspan> of snapshots</tspan></text>
<rect x="800" y="612" width="404" height="68" rx="12" fill="#FFCCE5" stroke="#E93D82" stroke-width="2.5"/><text x="1002" y="641.225" font-size="13.5" font-weight="700" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.555">openRead</tspan><tspan> / </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.555">openWrite</tspan></text><text x="1002" y="662.775" font-size="10.5" font-weight="400" fill="#5C5C5C" text-anchor="middle">nothing is written to the disk</text>
<g filter="url(#shadow)"><rect x="36" y="714" width="560" height="64" rx="3" fill="#FFE88A"/></g><text x="50" y="738" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="start">Every kind except the synced cloud folders also has a</text><text x="50" y="756.9" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="start"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.555">StorageProvider</tspan><tspan>, so code can use one interface for all of them.</tspan></text>
<g filter="url(#shadow)"><rect x="620" y="714" width="584" height="64" rx="3" fill="#C7E4FF"/></g><text x="634" y="738" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="start"><tspan>Long transfers to or from a cloud: </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.555">TransferManager.upload</tspan><tspan> / </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.555">download</tspan><tspan>,</tspan></text><text x="634" y="756.9" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="start">with progress and cancel.</text>
<text x="36" y="52" font-size="26" font-weight="800" fill="#1E1E1E">Where files can live, and how OctopusFile reaches them</text><text x="36" y="80" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start">Most kinds end as an ordinary local path; only WebDAV speaks HTTP, and the bucket lives in memory.</text><g transform="translate(1076,30)"><rect width="128" height="28" rx="14" fill="#FFFFFF" stroke="#E0E0E0"/><circle cx="16" cy="14" r="6" fill="#F08C00"/><text x="30" y="19" font-size="12.5" font-weight="700" fill="#1E1E1E">OctopusFile</text></g>
</svg>
