<path d="M506,360 L544,360" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
<path d="M876,212 L934,212" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
<path d="M1060,252 L1060,288" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1E1E1E)"/>
<rect x="56" y="170" width="120" height="80" rx="12" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2.5"/><text x="116" y="214.05" font-size="13.5" font-weight="700" fill="#1E1E1E" text-anchor="middle">.docx</text>
<rect x="196" y="170" width="290" height="80" rx="12" fill="#FFE88A" stroke="#E0B400" stroke-width="2.5"/><text x="341" y="205.575" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">word/document.xml</tspan></text><text x="341" y="225.825" font-size="9.5" font-weight="400" fill="#5C5C5C" text-anchor="middle">one line per paragraph</text>
<rect x="56" y="270" width="120" height="80" rx="12" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2.5"/><text x="116" y="314.05" font-size="13.5" font-weight="700" fill="#1E1E1E" text-anchor="middle">.pptx</text>
<rect x="196" y="270" width="290" height="80" rx="12" fill="#FFE88A" stroke="#E0B400" stroke-width="2.5"/><text x="341" y="305.575" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">ppt/slides/slideN.xml</tspan></text><text x="341" y="325.825" font-size="9.5" font-weight="400" fill="#5C5C5C" text-anchor="middle">slide by slide, in number order</text>
<rect x="56" y="370" width="120" height="80" rx="12" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2.5"/><text x="116" y="414.05" font-size="13.5" font-weight="700" fill="#1E1E1E" text-anchor="middle">.xlsx</text>
<rect x="196" y="370" width="290" height="80" rx="12" fill="#FFE88A" stroke="#E0B400" stroke-width="2.5"/><text x="341" y="405.575" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">xl/sharedStrings.xml</tspan><tspan> + </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">sheetN.xml</tspan></text><text x="341" y="425.825" font-size="9.5" font-weight="400" fill="#5C5C5C" text-anchor="middle">one line per row, cells joined by a tab</text>
<rect x="56" y="470" width="120" height="80" rx="12" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2.5"/><text x="116" y="505.275" font-size="13.5" font-weight="700" fill="#1E1E1E" text-anchor="middle">.odt .ods</text><text x="116" y="522.825" font-size="13.5" font-weight="700" fill="#1E1E1E" text-anchor="middle">.odp</text>
<rect x="196" y="470" width="290" height="80" rx="12" fill="#FFE88A" stroke="#E0B400" stroke-width="2.5"/><text x="341" y="505.575" font-size="12.5" font-weight="400" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.625">content.xml</tspan></text><text x="341" y="525.825" font-size="9.5" font-weight="400" fill="#5C5C5C" text-anchor="middle">one line per paragraph or heading</text>
<rect x="570" y="168" width="282" height="92" rx="12" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2.5"/><text x="711" y="209.05" font-size="14" font-weight="700" fill="#1E1E1E" text-anchor="middle">No DTD, no external entities</text><text x="711" y="231.25" font-size="11" font-weight="400" fill="#5C5C5C" text-anchor="middle">XXE and entity expansion are impossible</text>
<rect x="570" y="274" width="282" height="84" rx="12" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2.5"/><text x="711" y="311.05" font-size="14" font-weight="700" fill="#1E1E1E" text-anchor="middle">≤ 200 MB of XML</text><text x="711" y="333.25" font-size="11" font-weight="400" fill="#5C5C5C" text-anchor="middle">decompressed, per document (ZIP bomb)</text>
<rect x="570" y="372" width="282" height="72" rx="12" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2.5"/><text x="711" y="403.05" font-size="14" font-weight="700" fill="#1E1E1E" text-anchor="middle">≤ 20 000 000 characters</text><text x="711" y="425.25" font-size="11" font-weight="400" fill="#5C5C5C" text-anchor="middle">of text returned</text>
<text x="570" y="476" font-size="12.5" font-weight="400" fill="#5C5C5C" text-anchor="start">Over a limit, missing part or bad XML:</text>
<rect x="570" y="522" width="282" height="36" rx="18" fill="#FFC9C2" stroke="#E5484D" stroke-width="2.5"/><text x="711" y="543.9" font-size="13" font-weight="700" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.09">IOException</tspan></text>
<rect x="936" y="172" width="248" height="80" rx="12" fill="#CDF3C9" stroke="#30A46C" stroke-width="2.5"/><text x="1060" y="206.7" font-size="15" font-weight="700" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13.95">List&lt;String&gt;</tspan></text><text x="1060" y="230.2" font-size="12" font-weight="400" fill="#5C5C5C" text-anchor="middle">the lines of text</text>
<rect x="936" y="290" width="248" height="110" rx="12" fill="#E1D3FF" stroke="#8E4EC6" stroke-width="2.5"/><text x="1060" y="332.9" font-size="14" font-weight="700" fill="#1E1E1E" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13.02">ContentSearcher</tspan></text><text x="1060" y="355.1" font-size="11" font-weight="400" fill="#5C5C5C" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="10.23">Match.line()</tspan><tspan> = paragraph or row</tspan></text><text x="1060" y="369.4" font-size="11" font-weight="400" fill="#5C5C5C" text-anchor="middle">number</text>
<g filter="url(#shadow)"><rect x="936" y="420" width="248" height="140" rx="3" fill="#FFCCE5"/></g><text x="950" y="444" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="start">A damaged document is</text><text x="950" y="462.9" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="start">skipped, like an unreadable</text><text x="950" y="481.8" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="start">text file.</text>
<g filter="url(#shadow)"><rect x="36" y="610" width="1168" height="56" rx="3" fill="#FFE88A"/></g><text x="50" y="634" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="start"><tspan>Only the JDK: </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.555">java.util.zip</tspan><tspan> + </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.555">javax.xml.stream</tspan><tspan>. In </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.555">ContentSearcher</tspan><tspan> the </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.555">maxFileBytes</tspan><tspan> limit (20 MiB) also applies to the document file itself.</tspan></text>
<text x="36" y="52" font-size="26" font-weight="800" fill="#1E1E1E">Office documents are ZIP files of XML</text><text x="36" y="80" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13.95">DocumentText.lines(file)</tspan><tspan> reads only the XML parts with text and returns one line per paragraph or row.</tspan></text><g transform="translate(1076,30)"><rect width="128" height="28" rx="14" fill="#FFFFFF" stroke="#E0E0E0"/><circle cx="16" cy="14" r="6" fill="#F08C00"/><text x="30" y="19" font-size="12.5" font-weight="700" fill="#1E1E1E">OctopusFile</text></g>
</svg>
