<rect x="830.5" y="138" width="39" height="24" rx="9" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/><text x="850" y="155" font-size="12.5" font-weight="600" fill="#1E1E1E" text-anchor="middle">yes</text>
<rect x="784" y="276" width="32" height="24" rx="9" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/><text x="800" y="293" font-size="12.5" font-weight="600" fill="#1E1E1E" text-anchor="middle">no</text>
<g filter="url(#shadow)"><rect x="880" y="362" width="324" height="96" rx="3" fill="#FFE88A"/></g><text x="894" y="386" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="start"><tspan>Only for an intended addition: </tspan><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.555">ant</tspan></text><text x="894" y="404.9" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="start"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.555">selftest -Dapi.update=true</tspan><tspan> rewrites</tspan></text><text x="894" y="423.8" font-size="13.5" font-weight="400" fill="#1E1E1E" text-anchor="start">the list; review the diff.</text>
<rect x="678" y="398" width="74" height="24" rx="9" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/><text x="715" y="415" font-size="12.5" font-weight="600" fill="#1E1E1E" text-anchor="middle">new list</text>
<rect x="60" y="566" width="340" height="96" rx="12" fill="#FFD7AD" stroke="#F08C00" stroke-width="2.5"/><text x="230" y="598.9" font-size="17" font-weight="700" fill="#1E1E1E" text-anchor="middle">2.0.x</text><text x="230" y="625" font-size="14" font-weight="400" fill="#5C5C5C" text-anchor="middle">fixes only: the API stays exactly the</text><text x="230" y="643.2" font-size="14" font-weight="400" fill="#5C5C5C" text-anchor="middle">same</text>
<rect x="440" y="566" width="340" height="96" rx="12" fill="#CDF3C9" stroke="#30A46C" stroke-width="2.5"/><text x="610" y="608" font-size="17" font-weight="700" fill="#1E1E1E" text-anchor="middle">2.1, 2.2…</text><text x="610" y="634.1" font-size="14" font-weight="400" fill="#5C5C5C" text-anchor="middle">additions only: never remove or change</text>
<rect x="820" y="566" width="340" height="96" rx="12" fill="#C7E4FF" stroke="#0D8BF2" stroke-width="2.5"/><text x="990" y="608" font-size="17" font-weight="700" fill="#1E1E1E" text-anchor="middle">3.0</text><text x="990" y="634.1" font-size="14" font-weight="400" fill="#5C5C5C" text-anchor="middle">only then: removing what 2.x deprecated</text>
<text x="36" y="506" font-size="13.5" font-weight="600" fill="#5C5C5C" text-anchor="start">Every public element has Javadoc.</text>
<text x="36" y="52" font-size="26" font-weight="800" fill="#1E1E1E">API freeze: a test is the gate</text><text x="36" y="80" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start">From 2.0.0-rc.1 every public element is listed in a file; the test suite fails if the code differs.</text><g transform="translate(1076,30)"><rect width="128" height="28" rx="14" fill="#FFFFFF" stroke="#E0E0E0"/><circle cx="16" cy="14" r="6" fill="#F08C00"/><text x="30" y="19" font-size="12.5" font-weight="700" fill="#1E1E1E">OctopusFile</text></g>
</svg>
