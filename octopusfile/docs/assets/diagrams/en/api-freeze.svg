<rect x="36" y="150" width="210" height="96" rx="12" fill="#C7E4FF" stroke="#0D8BF2" stroke-width="2.5"/><text x="141" y="184.9" font-size="15" font-weight="700" fill="#1E1E1E" text-anchor="middle">Public API</text><text x="141" y="208.4" font-size="12" font-weight="400" fill="#5C5C5C" text-anchor="middle">packages exported by</text><text x="141" y="224" font-size="12" font-weight="400" fill="#5C5C5C" text-anchor="middle"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.16">module-info</tspan></text>
