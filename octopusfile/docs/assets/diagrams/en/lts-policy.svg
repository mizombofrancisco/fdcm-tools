<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 650" width="1240" height="650" role="img" aria-label="The LTS policy of 2.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title>The LTS policy of 2.0</title>
<defs><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#D4D4D4"/></pattern><filter id="shadow" x="-10%" y="-10%" width="130%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#000000" flood-opacity="0.18"/></filter></defs>
<rect width="1240" height="650" rx="18" fill="#F7F7F5"/><rect width="1240" height="650" rx="18" fill="url(#dots)"/><rect x="0.75" y="0.75" width="1238.5" height="648.5" rx="18" fill="none" stroke="#E0E0E0" stroke-width="1.5"/>

<path d="M140,190 H1100" fill="none" stroke="#F08C00" stroke-width="8" stroke-linecap="round"/>
<circle cx="140" cy="190" r="12" fill="#FFFFFF" stroke="#F08C00" stroke-width="4"/>
<text x="140" y="160" font-size="14" font-weight="700" fill="#1E1E1E" text-anchor="middle">2.0.0</text>
<text x="140" y="226" font-size="12.5" font-weight="400" fill="#5C5C5C" text-anchor="middle">21 Nov 2026</text>
<circle cx="620" cy="190" r="12" fill="#FFFFFF" stroke="#F08C00" stroke-width="4"/>
<text x="620" y="160" font-size="14" font-weight="700" fill="#1E1E1E" text-anchor="middle">1 year</text>
<text x="620" y="226" font-size="12.5" font-weight="400" fill="#5C5C5C" text-anchor="middle">21 Nov 2027</text>
<circle cx="1100" cy="190" r="12" fill="#FFFFFF" stroke="#F08C00" stroke-width="4"/>
<text x="1100" y="160" font-size="14" font-weight="700" fill="#1E1E1E" text-anchor="middle">end of support</text>
<text x="1100" y="226" font-size="12.5" font-weight="400" fill="#5C5C5C" text-anchor="middle">21 Nov 2028</text>
<rect x="300" y="238" width="640" height="40" rx="20" fill="#FFD7AD" stroke="#F08C00" stroke-width="2.5"/><text x="620" y="262.05" font-size="13.5" font-weight="700" fill="#1E1E1E" text-anchor="middle">2.0.1, 2.0.2… — bug and security fixes only, no new features</text>
<g filter="url(#shadow)"><rect x="36" y="318" width="376" height="136" rx="3" fill="#FFD7AD"/></g><text x="50" y="342" font-size="15" font-weight="700" fill="#1E1E1E">Support</text><text x="50" y="364.925" font-size="14.5" font-weight="400" fill="#1E1E1E" text-anchor="start">2 years from the release of 2.0.0. No new</text><text x="50" y="385.225" font-size="14.5" font-weight="400" fill="#1E1E1E" text-anchor="start">features and no API changes in 2.0.x.</text>
<g filter="url(#shadow)"><rect x="432" y="318" width="376" height="136" rx="3" fill="#C7E4FF"/></g><text x="446" y="342" font-size="15" font-weight="700" fill="#1E1E1E">API</text><text x="446" y="364.925" font-size="14.5" font-weight="400" fill="#1E1E1E" text-anchor="start">No breaking change in the whole 2.x line.</text><text x="446" y="385.225" font-size="14.5" font-weight="400" fill="#1E1E1E" text-anchor="start">Deprecated in 2.x → removed only in 3.0.</text><text x="446" y="405.525" font-size="14.5" font-weight="400" fill="#1E1E1E" text-anchor="start"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13.485">ApiSignatureTest</tspan><tspan> checks</tspan></text><text x="446" y="425.825" font-size="14.5" font-weight="400" fill="#1E1E1E" text-anchor="start"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13.485">api/octopusfile-api.txt</tspan><tspan>.</tspan></text>
<g filter="url(#shadow)"><rect x="828" y="318" width="376" height="136" rx="3" fill="#CDF3C9"/></g><text x="842" y="342" font-size="15" font-weight="700" fill="#1E1E1E">Java</text><text x="842" y="364.925" font-size="14.5" font-weight="400" fill="#1E1E1E" text-anchor="start">Java 17 and newer. The CI tests on Windows,</text><text x="842" y="385.225" font-size="14.5" font-weight="400" fill="#1E1E1E" text-anchor="start">Linux and macOS.</text>
<g filter="url(#shadow)"><rect x="36" y="478" width="376" height="136" rx="3" fill="#E1D3FF"/></g><text x="50" y="502" font-size="15" font-weight="700" fill="#1E1E1E">Formats</text><text x="50" y="524.925" font-size="14.5" font-weight="400" fill="#1E1E1E" text-anchor="start">Vault, encrypted files, snapshot</text><text x="50" y="545.225" font-size="14.5" font-weight="400" fill="#1E1E1E" text-anchor="start">repositories, saved index written by 2.0:</text><text x="50" y="565.525" font-size="14.5" font-weight="400" fill="#1E1E1E" text-anchor="start">readable by every later version.</text>
<g filter="url(#shadow)"><rect x="432" y="478" width="376" height="136" rx="3" fill="#EBEBEB"/></g><text x="446" y="502" font-size="15" font-weight="700" fill="#1E1E1E">Dependencies</text><text x="446" y="524.925" font-size="14.5" font-weight="400" fill="#1E1E1E" text-anchor="start">None. Only the JDK.</text>
<g filter="url(#shadow)"><rect x="828" y="478" width="376" height="136" rx="3" fill="#C2F0E6"/></g><text x="842" y="502" font-size="15" font-weight="700" fill="#1E1E1E">Branches</text><text x="842" y="524.925" font-size="14.5" font-weight="400" fill="#1E1E1E" text-anchor="start"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13.485">main</tspan><tspan>: new features (2.1, 2.2…).</tspan></text><text x="842" y="545.225" font-size="14.5" font-weight="400" fill="#1E1E1E" text-anchor="start"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13.485">lts/2.0</tspan><tspan>: the fixes of 2.0, created with</tspan></text><text x="842" y="565.525" font-size="14.5" font-weight="400" fill="#1E1E1E" text-anchor="start">2.0.0.</text>
<text x="36" y="52" font-size="26" font-weight="800" fill="#1E1E1E">The LTS policy of 2.0</text><text x="36" y="80" font-size="15" font-weight="400" fill="#5C5C5C" text-anchor="start">Two years of support from 2.0.0: fixes only in 2.0.x, and the API never broken in 2.x.</text><g transform="translate(1076,30)"><rect width="128" height="28" rx="14" fill="#FFFFFF" stroke="#E0E0E0"/><circle cx="16" cy="14" r="6" fill="#F08C00"/><text x="30" y="19" font-size="12.5" font-weight="700" fill="#1E1E1E">OctopusFile</text></g>
</svg>
